# Legacy enterprise deployment template: unsupported by the current Prodex CLI.
# The dedicated gateway/control-plane executables and storage adapters were removed.
# Retained for historical reference and isolated database image validation only.
# See docs/deployment.md for supported CLI container commands; do not start this
# template as a current Prodex application deployment.
services:
  prodex-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: prodex-gateway:local
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/prodex-gateway"]
    environment:
      PRODEX_HOME: /var/lib/prodex
      PRODEX_RUNTIME_LOG_DIR: /var/log/prodex
    command: ["serve", "--listen", "0.0.0.0:4000"]
    ports:
      - "127.0.0.1:4000:4000"
    secrets:
      - source: prodex_gateway_token
        target: PRODEX_GATEWAY_TOKEN
      - source: openai_api_key
        target: OPENAI_API_KEY
      - source: prodex_gateway_postgres_url
        target: PRODEX_GATEWAY_POSTGRES_URL
      - source: prodex_gateway_redis_url
        target: PRODEX_GATEWAY_REDIS_URL
    volumes:
      - prodex-data:/var/lib/prodex
      - prodex-runtime-logs:/var/log/prodex
      - ./deploy/compose-gateway-policy.toml:/var/lib/prodex/policy.toml:ro
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://127.0.0.1:4000/readyz >/dev/null",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    # postgres:19.0-alpine; Dependabot updates the tag and digest together.
    image: postgres:19.0-alpine@sha256:cac45fb483caee3668946088a1c0532db89d5285c28dbfeac889b4068296e06f
    profiles: ["postgres"]
    restart: unless-stopped
    user: "70:70"
    environment:
      POSTGRES_DB: ${PRODEX_POSTGRES_DB:-prodex}
      POSTGRES_USER: ${PRODEX_POSTGRES_USER:-prodex}
      POSTGRES_PASSWORD_FILE: /run/secrets/PRODEX_POSTGRES_PASSWORD
    secrets:
      - source: prodex_postgres_password
        target: PRODEX_POSTGRES_PASSWORD
    volumes:
      # Preserve the named volume: PostgreSQL 19 rejects legacy PG_VERSION
      # files at its root before initializing the new 19/docker layout.
      - prodex-postgres:/var/lib/postgresql
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  redis:
    # redis:8.12.0-alpine; Dependabot updates the tag and digest together.
    image: redis:8.12.0-alpine@sha256:ff55e25203f915f2fe9cc1428e6da969fec257dd6e6feb71a34fd0cf3a86b289
    profiles: ["redis"]
    restart: unless-stopped
    user: "999:1000"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - prodex-redis:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  prodex-data:
  prodex-runtime-logs:
  prodex-postgres:
  prodex-redis:

secrets:
  prodex_gateway_token:
    file: ${PRODEX_GATEWAY_TOKEN_FILE:?set PRODEX_GATEWAY_TOKEN_FILE}
  openai_api_key:
    file: ${OPENAI_API_KEY_FILE:?set OPENAI_API_KEY_FILE}
  prodex_gateway_postgres_url:
    file: ${PRODEX_GATEWAY_POSTGRES_URL_FILE:?set PRODEX_GATEWAY_POSTGRES_URL_FILE}
  prodex_gateway_redis_url:
    file: ${PRODEX_GATEWAY_REDIS_URL_FILE:?set PRODEX_GATEWAY_REDIS_URL_FILE}
  prodex_postgres_password:
    file: ${PRODEX_POSTGRES_PASSWORD_FILE:?set PRODEX_POSTGRES_PASSWORD_FILE}
