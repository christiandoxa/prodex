[package]
name = "prodex-observability"
version.workspace = true
edition.workspace = true
description = "Observability boundary primitives for Prodex traces, spans, and metric labels"
license.workspace = true
repository.workspace = true

[lib]
name = "prodex_observability"
path = "src/lib.rs"

[features]
default = []
# Kept as a compatibility feature name; Mojo owns semantics in every build.
mojo = ["prodex_mojo_core/mojo-observability"]

[dependencies]
prodex_mojo_core = { workspace = true, features = ["mojo-observability"] }

[lints]
workspace = true
