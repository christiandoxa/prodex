[package]
name = "prodex-runtime-store"
version.workspace = true
edition.workspace = true
description = "Runtime store merge and compaction helpers for prodex"
license.workspace = true
repository.workspace = true

[package.metadata.cargo-machete]
ignored = ["serde_json"]

[lib]
name = "prodex_runtime_store"
path = "src/lib.rs"

[features]
default = []
mojo = []

[dependencies]
prodex_mojo_core = { workspace = true, features = ["mojo-runtime"] }
prodex_runtime_state = { workspace = true }
prodex_state = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
