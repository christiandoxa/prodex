[package]
name = "prodex-runtime-store"
version.workspace = true
edition.workspace = true
description = "Runtime store merge and compaction helpers for prodex"
license.workspace = true
repository.workspace = true

[lib]
name = "prodex_runtime_store"
path = "src/lib.rs"

[features]
default = []
mojo = ["dep:prodex_mojo_core", "prodex_mojo_core/mojo-runtime"]

[dependencies]
prodex_mojo_core = { workspace = true, optional = true }
prodex_runtime_state = { workspace = true }
prodex_state = { workspace = true }
serde = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
