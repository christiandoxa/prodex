[package]
name = "prodex-runtime-doctor"
version.workspace = true
edition.workspace = true
description = "Runtime doctor log parsing and diagnostics for prodex"
license.workspace = true
repository.workspace = true

[lib]
name = "prodex_runtime_doctor"
path = "src/lib.rs"

[features]
default = ["runtime-log-mojo", "state-summary-mojo"]
mojo = ["runtime-log-mojo", "runtime_proxy_crate/mojo", "state-summary-mojo"]
runtime-log-mojo = []
state-summary-mojo = ["runtime-log-mojo"]

[dependencies]
anyhow = { workspace = true }
prodex_mojo_core = { workspace = true, features = ["mojo-rich"] }
prodex_quota = { workspace = true }
prodex_runtime_state = { workspace = true }
runtime_proxy_crate = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
