[package]
name = "prodex-cli"
version.workspace = true
edition.workspace = true
description = "CLI argument model and parsing helpers for prodex"
license.workspace = true
repository.workspace = true

[lib]
name = "prodex_cli"
path = "src/lib.rs"

[features]
default = []
mojo-core = ["prodex_mojo_core/mojo-runtime"]

[dependencies]
clap = { workspace = true }
prodex_mojo_core = { workspace = true, features = ["mojo-runtime"] }
prodex_optional_tools = { workspace = true }
prodex_provider_core = { workspace = true }
url = { workspace = true }
serde = { workspace = true, features = ["derive"] }

[lints]
workspace = true
