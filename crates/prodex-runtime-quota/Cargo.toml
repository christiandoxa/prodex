[package]
name = "prodex-runtime-quota"
version.workspace = true
edition.workspace = true
description = "Runtime quota adapter helpers for prodex"
license.workspace = true
repository.workspace = true

[package.metadata.cargo-machete]
ignored = ["serde_json"]

[lib]
name = "prodex_runtime_quota"
path = "src/lib.rs"

[features]
default = []
mojo = [
    "runtime_proxy_crate/mojo",
]

[dependencies]
chrono = { workspace = true }
prodex_mojo_core = { workspace = true, features = ["mojo-runtime"] }
prodex_quota = { workspace = true }
prodex_runtime_state = { workspace = true }
prodex_shared_types = { workspace = true }
prodex_state = { workspace = true }
runtime_proxy_crate = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

[lints]
workspace = true
