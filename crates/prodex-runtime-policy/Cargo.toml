[package]
name = "prodex-runtime-policy"
version.workspace = true
edition.workspace = true
description = "Runtime policy parsing and validation for prodex"
license.workspace = true
repository.workspace = true

[lib]
name = "prodex_runtime_policy"
path = "src/lib.rs"

[features]
default = []
mojo = [
    "dep:prodex_mojo_core",
    "prodex_mojo_core/mojo-runtime",
    "prodex_mojo_core/mojo-rich",
]

[dependencies]
anyhow = { workspace = true }
base64 = { workspace = true }
prodex_authn = { workspace = true }
prodex_core = { workspace = true }
prodex_domain = { workspace = true }
prodex_provider_core = { workspace = true }
prodex_mojo_core = { workspace = true, optional = true }
secret_store = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
