[package]
name = "prodex-provider-spi"
version.workspace = true
edition.workspace = true
description = "Transport-neutral provider service-provider interface primitives for Prodex"
license.workspace = true
repository.workspace = true

[lib]
name = "prodex_provider_spi"
path = "src/lib.rs"

[features]
default = []
mojo = [
    "dep:prodex_mojo_core",
    "prodex_mojo_core/mojo-routing",
    "prodex_provider_core/mojo",
]

[dependencies]
prodex_domain = { workspace = true }
prodex_provider_core = { workspace = true }
prodex_mojo_core = { workspace = true, optional = true }

[lints]
workspace = true
