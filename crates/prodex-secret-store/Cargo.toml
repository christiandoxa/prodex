[package]
name = "prodex-secret-store"
version.workspace = true
edition.workspace = true
description = "Secret storage primitives for prodex"
license.workspace = true
repository.workspace = true

[lib]
name = "secret_store"
path = "src/lib.rs"

[dependencies]
prodex_mojo_core = { workspace = true, features = ["mojo-rich"] }
aes-gcm-siv = { workspace = true }
getrandom = { workspace = true }
keyring = { workspace = true }
keyring-core = { workspace = true }
libc = { workspace = true }
prodex_domain = { workspace = true }
sha2 = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
dbus-secret-service-keyring-store = { version = "1.0.1", features = ["crypto-rust", "vendored"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "1"
windows-sys = { version = "=0.61.2", features = [
    "Wdk_Storage_FileSystem",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }

[lints]
workspace = true
