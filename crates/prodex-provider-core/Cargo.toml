[package]
name = "prodex-provider-core"
version.workspace = true
edition.workspace = true
description = "Provider catalog, adapter contracts, and cost helpers for prodex"
license.workspace = true
repository.workspace = true

[lib]
name = "prodex_provider_core"
path = "src/lib.rs"

[features]
default = []
mojo = [
    "prodex_mojo_core/mojo-provider-constraints",
]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
url = { workspace = true }
# Mojo owns model fallback even when the broader Mojo feature is disabled.
prodex_mojo_core = { workspace = true, features = ["mojo-rich"] }

[lints]
workspace = true
