[package]
name = "prodex-runtime-proxy"
version.workspace = true
edition.workspace = true
description = "Runtime proxy boundary primitives for prodex"
license.workspace = true
repository.workspace = true

[lib]
name = "runtime_proxy"
path = "src/lib.rs"

[features]
default = []
mojo = [
    "dep:prodex_mojo_core",
    "prodex_mojo_core/mojo-quota",
    "prodex_mojo_core/mojo-runtime",
    "prodex_provider_core/mojo",
]

[dependencies]
base64 = { workspace = true }
prodex_gateway_core = { workspace = true }
prodex_mojo_core = { workspace = true, optional = true }
prodex_provider_core = { workspace = true }
prodex_runtime_tuning = { workspace = true }
prodex_runtime_state = { workspace = true }
redaction = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tiktoken-rs = { workspace = true }

[lints]
workspace = true
