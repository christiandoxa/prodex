[package]
name = "prodex-runtime-proxy"
version.workspace = true
edition.workspace = true
description = "Runtime proxy boundary primitives for prodex"
license.workspace = true
repository.workspace = true

[package.metadata.cargo-machete]
ignored = ["prodex_provider_core"]

[lib]
name = "runtime_proxy"
path = "src/lib.rs"

[features]
default = []
mojo = [
    "prodex_mojo_core/mojo-quota",
]

[dependencies]
base64 = { workspace = true }
prodex_mojo_core = { workspace = true, features = ["mojo-runtime", "mojo-rich", "mojo-quota"] }
prodex_runtime_tuning = { workspace = true }
prodex_runtime_state = { workspace = true }
redaction = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
tiktoken-rs = { workspace = true }

[dev-dependencies]
prodex_provider_core = { workspace = true }

[lints]
workspace = true
