[package]
name = "prodex-context"
version.workspace = true
edition.workspace = true
description = "Mojo-backed critical-signal safety helpers for prodex"
license.workspace = true
repository.workspace = true

[lib]
name = "prodex_context"
path = "src/lib.rs"

[features]
default = []
mojo = ["dep:prodex_mojo_core", "prodex_mojo_core/mojo-runtime", "prodex_mojo_core/mojo-rich"]

[dependencies]
serde = { workspace = true }
prodex_mojo_core = { workspace = true, optional = true }

[lints]
workspace = true
