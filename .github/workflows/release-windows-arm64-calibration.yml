name: Windows ARM64 native release build calibration

# Opt-in comparison only. Do not publish or modify any release.
on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact source SHA used by a successful standalone release
        required: true
        type: string
      source_release_run_id:
        description: Completed official release workflow containing the same-source ARM64 Mojo archive
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: windows-arm64-calibration-${{ inputs.target_sha }}
  cancel-in-progress: true

jobs:
  native-arm64:
    name: Benchmark release binary on native Windows ARM64
    runs-on: windows-11-arm
    timeout-minutes: 70
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_HTTP_MULTIPLEXING: "false"
      PRODEX_MOJO_REQUIRED: "1"
      PRODEX_MOJO_VERSION: "1.1.0"
      PRODEX_MOJO_ARCHIVE: ${{ github.workspace }}\target\mojo-release\aarch64-pc-windows-msvc\prodex_mojo_core.lib

    steps:
      - name: Verify completed same-source official release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ inputs.target_sha }}
          RELEASE_RUN_ID: ${{ inputs.source_release_run_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:TARGET_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'Invalid immutable source SHA' }
          if ($env:RELEASE_RUN_ID -notmatch '^[0-9]+$') { throw 'Invalid official release run ID' }
          $data = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:RELEASE_RUN_ID" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify GitHub release run' }
          if ($data.head_sha -cne $env:TARGET_SHA -or
              $data.event -cne 'workflow_dispatch' -or
              $data.head_branch -cne 'main' -or
              $data.path -cne '.github/workflows/standalone-release.yml' -or
              $data.repository.full_name -cne $env:GITHUB_REPOSITORY -or
              $data.status -cne 'completed' -or
              $data.conclusion -cne 'success') {
            throw 'Untrusted release run or source identity mismatch'
          }

      - name: Check out exact release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.target_sha }}
          persist-credentials: false

      - name: Verify checked-out source identity
        shell: pwsh
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $sha -cne $env:TARGET_SHA) {
            throw 'Checkout does not match release source'
          }

      - name: Download exact-source strict ARM64 Mojo archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mojo-archive-aarch64-pc-windows-msvc
          run-id: ${{ inputs.source_release_run_id }}
          github-token: ${{ github.token }}
          path: target/mojo-release/aarch64-pc-windows-msvc

      - name: Verify native host and Mojo ABI before compiling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PROCESSOR_ARCHITECTURE -cne 'ARM64') {
            throw "Expected native Windows ARM64, got $env:PROCESSOR_ARCHITECTURE"
          }
          if (-not (Test-Path -Path $env:PRODEX_MOJO_ARCHIVE -PathType Leaf)) {
            throw 'Required Mojo archive missing'
          }
          if ((Get-Item $env:PRODEX_MOJO_ARCHIVE).Length -lt 1024) {
            throw 'Required Mojo archive unexpectedly empty'
          }
          $symbols = & llvm-nm -g $env:PRODEX_MOJO_ARCHIVE
          if ($LASTEXITCODE -ne 0) { throw 'Mojo symbol scan failed' }
          foreach ($entry in @('prodex_mojo_rich_abi_version', 'prodex_mojo_log_level_classify_v1')) {
            if (-not ($symbols | Select-String -SimpleMatch $entry -Quiet)) {
              throw "Missing required Mojo ABI symbol: $entry"
            }
          }
          $unresolved = & llvm-nm -u $env:PRODEX_MOJO_ARCHIVE
          if ($LASTEXITCODE -ne 0) { throw 'Mojo undefined-symbol scan failed' }
          if ($unresolved | Select-String -SimpleMatch 'KGEN_CompilerRT_' -Quiet) {
            throw 'Mojo compiler runtime dependency is forbidden'
          }

      - name: Install pinned Rust toolchain and native ARM64 target
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.99.0
          targets: aarch64-pc-windows-msvc

      - name: Cache independent ARM64 Rust release dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: windows-arm64-native-release-calibration
          cache-bin: false

      - name: Measure genuine Thin-LTO production ARM64 binary build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $watch = [System.Diagnostics.Stopwatch]::StartNew()
          cargo build --release --locked --target aarch64-pc-windows-msvc --features mojo-core --bin prodex
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows ARM64 production compilation failed' }
          $watch.Stop()
          $seconds = [int][Math]::Ceiling($watch.Elapsed.TotalSeconds)
          $binary = 'target/aarch64-pc-windows-msvc/release/prodex.exe'
          if (-not (Test-Path $binary -PathType Leaf)) { throw 'Compiled binary missing' }
          if ((Get-Item $binary).Length -lt 1024) { throw 'Compiled binary unexpectedly empty' }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $binary))
          $offset = [BitConverter]::ToInt32($bytes, 60)
          if ($offset -le 0 -or $offset + 6 -ge $bytes.Length) { throw 'Malformed PE header' }
          $machine = [BitConverter]::ToUInt16($bytes, $offset + 4)
          if ($machine -ne 0xAA64) { throw "Expected ARM64 PE machine, got $machine" }
          "Windows ARM64 native release build seconds: $seconds" >> $env:GITHUB_STEP_SUMMARY
          Set-Content -Path "$env:RUNNER_TEMP/arm64-build-seconds.txt" -Value $seconds

      - name: Run real native ARM64 Mojo smoke
        shell: pwsh
        env:
          PRODEX_HOME: ${{ runner.temp }}/prodex-arm64-benchmark
        run: |
          $ErrorActionPreference = 'Stop'
          $binary = 'target/aarch64-pc-windows-msvc/release/prodex.exe'
          & $binary --version
          if ($LASTEXITCODE -ne 0) { throw 'Native ARM64 version smoke failed' }
          & $binary --help *> "$env:RUNNER_TEMP/arm64-help.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Native ARM64 help smoke failed' }
          & $binary doctor --runtime --json *> "$env:RUNNER_TEMP/arm64-doctor.json"
          if ($LASTEXITCODE -ne 0) { throw 'Native ARM64 runtime doctor failed' }
          $text = Get-Content "$env:RUNNER_TEMP/arm64-doctor.json" -Raw
          foreach ($required in @('"implementation": "mojo-compiled-in"', '"fallback": false', '"self_test": "passed"')) {
            if (-not $text.Contains($required)) { throw "Missing strict Mojo smoke: $required" }
          }

      - name: Report benchmark timing without publishing executable
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-arm64-native-release-calibration-time
          path: ${{ runner.temp }}/arm64-build-seconds.txt
          if-no-files-found: ignore
          retention-days: 7
