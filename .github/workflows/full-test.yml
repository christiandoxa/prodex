name: Full Rust test suite

on:
  schedule:
    - cron: "37 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  SCCACHE_CACHE_SIZE: 2G
  SCCACHE_GHA_ENABLED: "true"

concurrency:
  group: full-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mojo-runtime-linux-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MOJO_VERSION: "1.1.0"
      UV_VERSION: "0.11.7"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.98.1
          targets: x86_64-unknown-linux-gnu

      - name: Install pinned uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Install pinned Mojo toolchain
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python "mojo==${MOJO_VERSION}"
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"

      - name: Build strict runtime Mojo archive
        shell: bash
        run: |
          set -euo pipefail
          target=x86_64-unknown-linux-gnu
          target_dir="${GITHUB_WORKSPACE}/target/mojo-runtime-build/${target}"
          PRODEX_MOJO_REQUIRED=1 \
          PRODEX_MOJO_VERSION="${MOJO_VERSION}" \
          PRODEX_MOJO_TARGET="${target}" \
          PRODEX_MOJO_TARGET_CPU=x86-64 \
          CARGO_TARGET_DIR="${target_dir}" \
            cargo build --release --locked --target "${target}" -p prodex-mojo-core \
              --features mojo-runtime,mojo-quota,mojo-rich
          archive="$(find "${target_dir}/${target}/release/build" -type f \
            -name libprodex_mojo_core.a -print -quit)"
          test -s "${archive}"
          mkdir -p "target/mojo-runtime/${target}"
          cp "${archive}" "target/mojo-runtime/${target}/libprodex_mojo_core.a"

      - name: Upload Linux runtime Mojo archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mojo-runtime-archive-x86_64-unknown-linux-gnu
          path: target/mojo-runtime/x86_64-unknown-linux-gnu/libprodex_mojo_core.a
          if-no-files-found: error

  full_test_shards:
    name: Generate full-test shard plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Generate full-test shard matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(node scripts/ci/prodex-app-test-shards.mjs --full-test-matrix)"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  full-test:
    name: Full tests (${{ matrix.label }})
    needs: [full_test_shards, mojo-runtime-linux-archive]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: sccache
      PRODEX_MOJO_ARCHIVE: ${{ github.workspace }}/target/mojo-runtime/x86_64-unknown-linux-gnu/libprodex_mojo_core.a
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.full_test_shards.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download runtime Mojo archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mojo-runtime-archive-x86_64-unknown-linux-gnu
          path: target/mojo-runtime/x86_64-unknown-linux-gnu

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.98.1

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install Node.js
        if: matrix.suite == 'workspace'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-bin: false
          save-if: ${{ matrix.save_cache }}

      - name: Run full test partition
        shell: bash
        env:
          PRODEX_APP_FILTERS: ${{ matrix.filters }}
          PRODEX_APP_SKIP_FILTERS: ${{ matrix.skip_filters }}
          RUST_BACKTRACE: "1"
        run: |
          set -euo pipefail
          artifact_dir="${RUNNER_TEMP}/full-test-${{ matrix.suite }}-diagnostics"
          cargo_log="${artifact_dir}/cargo-test.log"
          runtime_pointer="/tmp/prodex-runtime-latest.path"
          suite="${{ matrix.suite }}"

          case "${suite}" in
            workspace)
              command_description="node scripts/ci/full-rust-test.mjs --jobs 6 --test-threads 4 --timings --timings-json --no-prodex-app-lib (workspace passes --exclude prodex-app)"
              ;;
            remainder)
              command_description="prodex-app library remainder after the shared disjoint filters"
              ;;
            *)
              command_description="prodex-app filters: ${PRODEX_APP_FILTERS//$'\n'/, }"
              ;;
          esac

          rm -rf "${artifact_dir}"
          mkdir -p "${artifact_dir}"

          cat > "${artifact_dir}/metadata.txt" <<EOF
          event_name=${GITHUB_EVENT_NAME}
          ref=${GITHUB_REF}
          sha=${GITHUB_SHA}
          run_id=${GITHUB_RUN_ID}
          run_attempt=${GITHUB_RUN_ATTEMPT}
          runner_os=${RUNNER_OS}
          suite=${suite}
          command=${command_description}
          started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

          rustc -Vv > "${artifact_dir}/rustc-version.txt"
          cargo -Vv > "${artifact_dir}/cargo-version.txt"

          set +e
          status=0
          case "${suite}" in
            workspace)
              node scripts/ci/full-rust-test.mjs \
                --jobs 6 \
                --test-threads 4 \
                --timings \
                --timings-json \
                --no-prodex-app-lib \
                > "${cargo_log}" 2>&1
              status=$?
              ;;
            remainder)
              skip_args=()
              while IFS= read -r filter; do
                [ -z "${filter}" ] && continue
                skip_args+=(--skip "${filter}")
              done <<< "${PRODEX_APP_SKIP_FILTERS}"
              cargo test --locked -q -p prodex-app --lib -- \
                --test-threads=1 \
                "${skip_args[@]}" \
                > "${cargo_log}" 2>&1
              status=$?
              ;;
            *)
              : > "${cargo_log}"
              filter_log="${artifact_dir}/filter.log"
              while IFS= read -r filter; do
                [ -z "${filter}" ] && continue
                cargo test --locked -q -p prodex-app --lib \
                  "${filter}" -- --test-threads=1 \
                  > "${filter_log}" 2>&1
                filter_status=$?
                cat "${filter_log}" >> "${cargo_log}"
                if [ "${filter_status}" -ne 0 ]; then
                  status=1
                fi
                if grep -Fq 'running 0 tests' "${filter_log}"; then
                  echo "prodex-app filter matched no tests: ${filter}" >> "${cargo_log}"
                  status=1
                fi
              done <<< "${PRODEX_APP_FILTERS}"
              ;;
          esac
          set -e

          if [ "${status}" -eq 0 ] && [ "${suite}" = "remainder" ] && \
             grep -Fq 'running 0 tests' "${cargo_log}"; then
            echo "prodex-app shard matched no tests" >> "${cargo_log}"
            status=1
          fi

          printf 'exit_code=%s\nfinished_at=%s\n' \
            "${status}" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            >> "${artifact_dir}/metadata.txt"

          if [ "${status}" -eq 0 ]; then
            rm -rf "${artifact_dir}"
            exit 0
          fi

          tail -n 200 "${cargo_log}" > "${artifact_dir}/cargo-test-tail.txt"

          if [ -f "${runtime_pointer}" ]; then
            cp "${runtime_pointer}" "${artifact_dir}/prodex-runtime-latest.path"
            latest_runtime_log="$(tr -d '\r' < "${runtime_pointer}")"
            printf 'runtime_log_pointer=%s\nruntime_log_target=%s\n' \
              "${runtime_pointer}" \
              "${latest_runtime_log}" \
              >> "${artifact_dir}/metadata.txt"
            if [ -n "${latest_runtime_log}" ] && [ -f "${latest_runtime_log}" ]; then
              cp "${latest_runtime_log}" "${artifact_dir}/$(basename "${latest_runtime_log}")"
              tail -n 200 "${latest_runtime_log}" > "${artifact_dir}/latest-runtime-log-tail.txt"
            fi
          else
            printf 'runtime_log_pointer=%s\nruntime_log_target=missing\n' \
              "${runtime_pointer}" \
              >> "${artifact_dir}/metadata.txt"
          fi

          find /tmp -maxdepth 1 -type f \
            \( -name 'prodex-runtime-*.log' -o -name 'prodex-runtime-latest.path' \) \
            | sort > "${artifact_dir}/runtime-log-files.txt" || true

          cargo run --locked -q --bin prodex -- doctor --runtime > "${artifact_dir}/doctor-runtime.txt" 2>&1 || true
          cargo run --locked -q --bin prodex -- doctor --runtime --json > "${artifact_dir}/doctor-runtime.json" 2> "${artifact_dir}/doctor-runtime-json.stderr" || true

          echo "Full test suite failed. Recent cargo output:"
          cat "${artifact_dir}/cargo-test-tail.txt"

          if [ -f "${artifact_dir}/latest-runtime-log-tail.txt" ]; then
            echo
            echo "Latest runtime log tail:"
            cat "${artifact_dir}/latest-runtime-log-tail.txt"
          fi

          exit "${status}"

      - name: Test temp-backed state with a symlinked TMPDIR
        if: matrix.suite == 'remainder'
        shell: bash
        run: |
          set -euo pipefail
          tmp_root="$(mktemp -d)"
          trap 'find "${tmp_root}" -depth -delete' EXIT
          mkdir -m 700 "${tmp_root}/real"
          ln -s "${tmp_root}/real" "${tmp_root}/alias"
          TMPDIR="${tmp_root}/alias" cargo test --locked -q -p prodex-app \
            --lib 'runtime_tools::desktop_tests::' -- --test-threads=1
          TMPDIR="${tmp_root}/alias" cargo test --locked -q -p prodex-app \
            --lib \
            'runtime_proxy::smart_context::self_test::tests::offline_self_test_accepts_system_temp_symlink_alias' \
            -- --test-threads=1

      - name: Upload full-test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: full-test-${{ matrix.suite }}-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/full-test-${{ matrix.suite }}-diagnostics
          if-no-files-found: ignore
          retention-days: 14
