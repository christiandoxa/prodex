name: Full Rust test suite

on:
  schedule:
    - cron: "37 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  PRODEX_MOJO_REQUIRED: "1"
  SCCACHE_CACHE_SIZE: 2G
  SCCACHE_GHA_ENABLED: "true"

concurrency:
  group: full-test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mojo-runtime-linux-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      MOJO_VERSION: "1.2.0"
      UV_VERSION: "0.11.7"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Scheduled/explicit main runs can trust the same source-pinned Mojo
      # archive cache populated by the successful main push CI job.
      # Other refs must always compile their own strict archive.
      - name: Restore exact-input Mojo archive from trusted main cache
        if: ${{ github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        id: mojo-archive-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: target/mojo-runtime/x86_64-unknown-linux-gnu/libprodex_mojo_core.a
          key: mojo-static-v2-${{ runner.os }}-x86_64-unknown-linux-gnu-x86-64-mojo-${{ env.MOJO_VERSION }}-rust1.99.1-${{ hashFiles('mojo/**/*.mojo', 'crates/prodex-mojo-core/build.rs', 'crates/prodex-mojo-core/build/*.rs', 'crates/prodex-mojo-core/Cargo.toml') }}

      - name: Install Rust toolchain
        if: ${{ steps.mojo-archive-cache.outputs.cache-hit != 'true' }}
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.99.1
          targets: x86_64-unknown-linux-gnu

      - name: Install pinned uv
        if: ${{ steps.mojo-archive-cache.outputs.cache-hit != 'true' }}
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Install pinned Mojo toolchain
        if: ${{ steps.mojo-archive-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python "mojo==${MOJO_VERSION}"
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"

      - name: Build strict runtime Mojo archive
        if: ${{ steps.mojo-archive-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          target=x86_64-unknown-linux-gnu
          target_dir="${GITHUB_WORKSPACE}/target/mojo-runtime-build/${target}"
          PRODEX_MOJO_REQUIRED=1 \
          PRODEX_MOJO_VERSION="${MOJO_VERSION}" \
          PRODEX_MOJO_TARGET="${target}" \
          PRODEX_MOJO_TARGET_CPU=x86-64 \
          CARGO_TARGET_DIR="${target_dir}" \
            cargo build --release --locked --target "${target}" -p prodex-mojo-core \
              --features mojo-core
          archive="$(find "${target_dir}/${target}/release/build" -type f \
            -name libprodex_mojo_core.a -print -quit)"
          test -s "${archive}"
          mkdir -p "target/mojo-runtime/${target}"
          cp "${archive}" "target/mojo-runtime/${target}/libprodex_mojo_core.a"

      - name: Validate cached or freshly compiled strict Linux Mojo archive
        shell: bash
        run: |
          set -euo pipefail
          archive="target/mojo-runtime/x86_64-unknown-linux-gnu/libprodex_mojo_core.a"
          test -s "${archive}"
          for symbol in \
            prodex_runtime_profile_provider_order_batch \
            prodex_runtime_profile_rotation_order_batch \
            prodex_mojo_abi_version \
            prodex_mojo_observability_label_v1 \
            prodex_mojo_provider_registry_plan_v1; do
            nm -g "${archive}" | grep -F "${symbol}"
          done
          if nm -u "${archive}" | grep -F 'KGEN_CompilerRT_'; then
            echo "Nightly Mojo archive requires forbidden Mojo compiler runtime" >&2
            exit 1
          fi

      - name: Upload Linux runtime Mojo archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mojo-runtime-archive-x86_64-unknown-linux-gnu
          path: target/mojo-runtime/x86_64-unknown-linux-gnu/libprodex_mojo_core.a
          if-no-files-found: error

  full_test_shards:
    name: Compile and partition Linux application tests once
    needs: mojo-runtime-linux-archive
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_RW_MODE: READ_WRITE
      PRODEX_MOJO_ARCHIVE: ${{ github.workspace }}/.prodex-ci/mojo-runtime/x86_64-unknown-linux-gnu/libprodex_mojo_core.a
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      manifest_sha256: ${{ steps.pack.outputs.manifest_sha256 }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download Linux runtime Mojo archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mojo-runtime-archive-x86_64-unknown-linux-gnu
          path: .prodex-ci/mojo-runtime/x86_64-unknown-linux-gnu

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.99.1

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-bin: false
          shared-key: prodex-app-lib
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Generate complete application shard matrix
        id: matrix
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(node scripts/ci/prodex-app-test-shards.mjs --full-test-app-matrix)"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

      - name: Compile and bind the exact-run native test executable
        id: pack
        shell: bash
        run: node scripts/ci/native-test-artifact.mjs pack .prodex-ci/full-app-tests

      - name: Upload the exact-run native test executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: full-app-tests
          path: .prodex-ci/full-app-tests
          if-no-files-found: error
          overwrite: true
          retention-days: 7
          compression-level: 1

  full-workspace:
    name: Full tests (workspace and auto-rotate)
    needs: mojo-runtime-linux-archive
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_GHA_RW_MODE: READ_WRITE
      PRODEX_MOJO_ARCHIVE: ${{ github.workspace }}/.prodex-ci/mojo-runtime/x86_64-unknown-linux-gnu/libprodex_mojo_core.a
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download runtime Mojo archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mojo-runtime-archive-x86_64-unknown-linux-gnu
          path: .prodex-ci/mojo-runtime/x86_64-unknown-linux-gnu

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.99.1

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Cache workspace dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-bin: false
          shared-key: full-test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run workspace and auto-rotate coverage
        shell: bash
        env:
          PRODEX_FULL_TEST_SUITE: workspace
          PRODEX_APP_FILTERS: ""
          PRODEX_APP_SKIP_FILTERS: ""
          RUST_BACKTRACE: "1"
        run: bash scripts/ci/full-test-partition.sh

      - name: Upload workspace diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: full-test-workspace-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/full-test-workspace-diagnostics
          if-no-files-found: ignore
          retention-days: 14

  full-test:
    name: Full tests (${{ matrix.label }})
    needs: full_test_shards
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PRODEX_MOJO_ARCHIVE: ${{ github.workspace }}/.prodex-ci/mojo-runtime/x86_64-unknown-linux-gnu/libprodex_mojo_core.a
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix: ${{ fromJSON(needs.full_test_shards.outputs.matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download runtime Mojo archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mojo-runtime-archive-x86_64-unknown-linux-gnu
          path: .prodex-ci/mojo-runtime/x86_64-unknown-linux-gnu

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.99.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Download this run's native test executable
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: full-app-tests
          path: .prodex-ci/full-app-tests

      - name: Run full test partition
        shell: bash
        env:
          PRODEX_FULL_TEST_SUITE: ${{ matrix.suite }}
          TEST_MANIFEST_SHA256: ${{ needs.full_test_shards.outputs.manifest_sha256 }}
          PRODEX_APP_FILTERS: ${{ matrix.filters }}
          PRODEX_APP_SKIP_FILTERS: ${{ matrix.skip_filters }}
          RUST_BACKTRACE: "1"
        run: bash scripts/ci/full-test-partition.sh

      - name: Test temp-backed state with a symlinked TMPDIR
        if: matrix.suite == 'remainder'
        env:
          TEST_MANIFEST_SHA256: ${{ needs.full_test_shards.outputs.manifest_sha256 }}
          PRODEX_APP_SKIP_FILTERS: ""
        shell: bash
        run: |
          set -euo pipefail
          tmp_root="$(mktemp -d)"
          trap 'find "${tmp_root}" -depth -delete' EXIT
          mkdir -m 700 "${tmp_root}/real"
          ln -s "${tmp_root}/real" "${tmp_root}/alias"
          diagnostics="${RUNNER_TEMP}/full-test-remainder-diagnostics"
          mkdir -p "${diagnostics}"
          TMPDIR="${tmp_root}/alias" \
          PRODEX_APP_FILTERS=$'runtime_tools::overlay::overlay_tests::\nruntime_proxy::smart_context::proxy_state::compiled_store_retention_caller_tests::' \
            node scripts/ci/native-test-artifact.mjs run .prodex-ci/full-app-tests \
              2>&1 | tee "${diagnostics}/symlink-temp-tests.log"

      - name: Upload full-test diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: full-test-${{ matrix.suite }}-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/full-test-${{ matrix.suite }}-diagnostics
          if-no-files-found: ignore
          retention-days: 14
