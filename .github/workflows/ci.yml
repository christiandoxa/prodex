    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.1

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Run env-sensitive parallel guard
        run: node scripts/ci/runtime-env-parallel.mjs --runs 2 --test-threads 4

  main-internal-runtime-proxy:
    name: Main internal runtime proxy (${{ matrix.label }})
    needs: changes
    if: ${{ github.event_name != 'schedule' && needs.changes.outputs.heavy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.runtime_proxy_matrix) }}
    env:
      RUNTIME_PROXY_ARTIFACT_DIR: target/ci/runtime-proxy/${{ matrix.suite }}
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      RUSTC_WRAPPER: sccache

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.1

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ matrix.save_cache }}

      - name: Run runtime proxy internal test shard ${{ matrix.label }}
        shell: bash
        run: |
          set -euo pipefail
          status=0
          while IFS= read -r shard; do
            if [ -z "${shard}" ]; then
              continue
            fi
            shard_label="${shard%%|*}"
            filter="${shard#*|}"
            if [ -z "${shard_label}" ] || [ -z "${filter}" ] || [ "${shard_label}" = "${filter}" ]; then
              echo "Invalid runtime proxy shard entry: ${shard}"
              exit 1
            fi
            if ! node scripts/ci/runtime-proxy-shard.mjs \
              --filter "${filter}" \
              --test-threads 1 \
              --artifact-dir "${RUNTIME_PROXY_ARTIFACT_DIR}/${shard_label}"; then
              status=1
            fi
          done <<< "${{ matrix.filters }}"
          exit "${status}"

      - name: Upload runtime proxy shard diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-proxy-${{ matrix.suite }}-diagnostics
          path: ${{ env.RUNTIME_PROXY_ARTIFACT_DIR }}
          if-no-files-found: ignore

  runtime-proxy-bench-smoke:
    needs: changes
