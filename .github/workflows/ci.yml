name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  SCCACHE_CACHE_SIZE: 2G
  SCCACHE_GHA_ENABLED: "true"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      heavy: ${{ steps.impact.outputs.heavy }}
      reason: ${{ steps.impact.outputs.reason }}
      runtime_proxy_matrix: ${{ steps.runtime-matrix.outputs.matrix }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Classify CI impact
        id: impact
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [ -z "${base}" ] || [ "${base}" = "0000000000000000000000000000000000000000" ]; then
              base="${head}^"
            fi
          fi

          if ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null ||
             ! git rev-parse --verify --quiet "${head}^{commit}" >/dev/null; then
            {
              echo "heavy=true"
              echo "reason=missing git base/head; running full CI"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          node scripts/ci/ci-impact.mjs \
            --base "${base}" \
            --head "${head}" \
            --event-name "${{ github.event_name }}" \
            --ref "${{ github.ref }}" \
            --github-output

      - name: Report CI impact
        run: |
          echo "heavy=${{ steps.impact.outputs.heavy }}"
          echo "reason=${{ steps.impact.outputs.reason }}"

      - name: Generate runtime proxy shard matrix
        id: runtime-matrix
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(node scripts/ci/runtime-proxy-ci-matrix.mjs --github-matrix)"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.0
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  prodex-app-lib:
    name: prodex-app library tests (${{ matrix.label }})
    needs: changes
    if: ${{ needs.changes.outputs.heavy == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTC_WRAPPER: sccache
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: selection
            label: selection and pressure
            save_cache: true
          - suite: admission
            label: admission and state
            save_cache: false
          - suite: rotation
            label: rotation and health
            save_cache: false
          - suite: remainder
            label: remaining tests
            save_cache: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.0

      - name: Install sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false
          save-if: ${{ matrix.save_cache }}

      - name: Run prodex-app library partition
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.suite }}" in
            selection)
              cargo test --locked -q -p prodex-app --lib --all-features \
                'main_internal_tests::runtime_proxy_selection_and_pressure::selection::' -- --test-threads=1
              cargo test --locked -q -p prodex-app --lib --all-features \
                'main_internal_tests::runtime_proxy_selection_and_pressure::pressure::' -- --test-threads=1
              cargo test --locked -q -p prodex-app --lib --all-features \
                'main_internal_tests::runtime_proxy_selection_and_pressure::incidents::' -- --test-threads=1
              ;;
            admission)
              cargo test --locked -q -p prodex-app --lib --all-features \
                'main_internal_tests::runtime_proxy_selection_and_pressure::admission::' -- --test-threads=1
              cargo test --locked -q -p prodex-app --lib --all-features \
                'main_internal_tests::runtime_proxy_selection_and_pressure::state::' -- --test-threads=1
              ;;
            rotation)
              cargo test --locked -q -p prodex-app --lib --all-features \
                'main_internal_tests::runtime_proxy_selection_and_pressure::rotation::' -- --test-threads=1
              cargo test --locked -q -p prodex-app --lib --all-features \
                'main_internal_tests::runtime_proxy_selection_and_pressure::health::' -- --test-threads=1
              ;;
            remainder)
              cargo test --locked -q -p prodex-app --lib --all-features -- \
                --test-threads=1 \
                --skip 'main_internal_tests::runtime_proxy_selection_and_pressure::selection::' \
                --skip 'main_internal_tests::runtime_proxy_selection_and_pressure::pressure::' \
                --skip 'main_internal_tests::runtime_proxy_selection_and_pressure::incidents::' \
                --skip 'main_internal_tests::runtime_proxy_selection_and_pressure::admission::' \
                --skip 'main_internal_tests::runtime_proxy_selection_and_pressure::state::' \
                --skip 'main_internal_tests::runtime_proxy_selection_and_pressure::rotation::' \
                --skip 'main_internal_tests::runtime_proxy_selection_and_pressure::health::'
              ;;
            *)
              echo "unknown prodex-app library suite: ${{ matrix.suite }}" >&2
              exit 2
              ;;
          esac

      - name: Test temp-backed state with a symlinked TMPDIR
        if: matrix.suite == 'remainder'
        shell: bash
        run: |
          set -euo pipefail
          tmp_root="$(mktemp -d)"
          trap 'find "${tmp_root}" -depth -delete' EXIT
          mkdir -m 700 "${tmp_root}/real"
          ln -s "${tmp_root}/real" "${tmp_root}/alias"
          TMPDIR="${tmp_root}/alias" cargo test --locked -q -p prodex-app \
            --lib --all-features 'runtime_tools::desktop_tests::' -- --test-threads=1
          TMPDIR="${tmp_root}/alias" cargo test --locked -q -p prodex-app \
            --lib --all-features \
            'runtime_proxy::smart_context::self_test::tests::offline_self_test_accepts_system_temp_symlink_alias' \
            -- --test-threads=1

  fuzz-build:
    needs: changes
    if: ${{ needs.changes.outputs.heavy == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.0

      - name: Install pinned fuzz toolchain
        run: rustup toolchain install nightly-2026-07-11 --profile minimal

      - name: Install sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: ${{ runner.os }}-fuzz-nightly-2026-07-11
          workspaces: fuzz -> target

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2

      - name: Validate the fuzz dependency lock
        run: cargo metadata --locked --manifest-path fuzz/Cargo.toml --format-version 1 >/dev/null

      - name: Build all fuzz targets
        run: cargo +nightly-2026-07-11 fuzz build --fuzz-dir fuzz

      - name: Run bounded fuzz smoke
        shell: bash
        run: |
          set -euo pipefail
          for target in \
            canonical_request_target \
            oidc_endpoint_policy \
            profile_export_envelope \
            runtime_policy_parse \
            governance_policy \
            smart_context_inputs
          do
            cargo +nightly-2026-07-11 fuzz run "${target}" --fuzz-dir fuzz -- \
              -max_total_time=10 -timeout=5 -rss_limit_mb=2048
          done

  docs-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Lint markdown docs
        run: npm run docs:lint

  observability-alerts:
    name: Prometheus alert rule tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate alert metadata and runbooks
        run: |
          node scripts/ci/observability-alerts-guard.mjs --self-test
          node scripts/ci/observability-alerts-guard.mjs

      - name: Check and test alert rules
        shell: bash
        run: |
          set -euo pipefail
          promtool_image="docker.io/prom/prometheus:v3.12.0@sha256:69f5241418838263316593f7274a304b095c40bcf22e57272865da91bd60a8ac"
          rules_dir="${PWD}/target/promtool"
          mkdir -p "${rules_dir}"
          sed -n '/^spec:$/,$p' deploy/observability/prodex-alerts.yaml \
            | sed '1d; s/^  //' \
            > "${rules_dir}/prodex-alerts.rules.yaml"
          test -s "${rules_dir}/prodex-alerts.rules.yaml"
          cp deploy/observability/prodex-alerts.test.yaml "${rules_dir}/"
          docker run --rm --entrypoint /bin/promtool \
            -v "${rules_dir}:/rules:ro" \
            "${promtool_image}" \
            check rules /rules/prodex-alerts.rules.yaml
          docker run --rm --entrypoint /bin/promtool \
            -v "${rules_dir}:/rules:ro" \
            "${promtool_image}" \
            test rules /rules/prodex-alerts.test.yaml

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Scan repository for leaked credentials
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${PWD}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /repo --no-git --redact --no-banner --config /repo/.gitleaks.toml

  windows-security:
    name: Windows native security tests
    needs: changes
    if: ${{ needs.changes.outputs.heavy == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTC_WRAPPER: sccache

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.0

      - name: Install sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false
          save-if: false

      - name: Test native broker capability persistence
        run: cargo test --locked -p prodex-app --all-features --lib 'runtime_broker::registry::store::tests::' -- --test-threads=1

      - name: Run Windows runtime launch regressions
        timeout-minutes: 10
        env:
          RUST_BACKTRACE: "1"
          RUST_TEST_NOCAPTURE: "1"
        run: cargo test --locked -q -p prodex-app --lib --all-features 'app_commands::runtime_launch::tests::' -- --test-threads=1 --format pretty

  windows-workspace:
    name: Windows tests (${{ matrix.label }})
    needs: changes
    if: ${{ needs.changes.outputs.heavy == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTC_WRAPPER: sccache
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: members
            label: workspace members
            save_cache: true
          - suite: root-0
            label: root shard 1 of 2
            auto_rotate_shard: 0
            save_cache: false
          - suite: root-1
            label: root shard 2 of 2
            auto_rotate_shard: 1
            save_cache: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.0

      - name: Install sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false
          save-if: ${{ matrix.save_cache }}

      - name: Install Node.js
        if: matrix.suite != 'members'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Run Windows workspace member tests
        if: matrix.suite == 'members'
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: |
          cargo test --locked -q --workspace --exclude prodex --exclude prodex-app --all-features -- --test-threads=4 --skip login:: --skip quota_doctor:: --skip run:: --skip shared_state:: --skip super_mode:: --skip continuity_failure_reason_metrics_ --skip rtk::tests::
          cargo test --locked -q -p prodex-runtime-broker-log --lib --all-features continuity_failure_reason_metrics_ -- --test-threads=1
          cargo test --locked -q -p prodex-optional-tools --lib --all-features rtk::tests:: -- --test-threads=1

      - name: Prebuild Windows auto-rotate tests
        if: startsWith(matrix.suite, 'root-')
        run: cargo test --locked --test auto_rotate --all-features --no-run

      - name: Run Windows non-sharded root tests
        if: matrix.suite == 'root-1'
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: |
          cargo test --locked -q -p prodex --lib --bins --examples --test dashboard_control_plane --test enterprise_binaries --test internal_commands --all-features -- --test-threads=4
          cargo test --locked -q -p prodex --doc --all-features

      - name: Run Windows auto-rotate shard ${{ matrix.auto_rotate_shard }}
        if: startsWith(matrix.suite, 'root-')
        env:
          RUST_BACKTRACE: "1"
        run: node scripts/ci/auto-rotate-shards.mjs --all-features --jobs 4 --shard-index ${{ matrix.auto_rotate_shard }} --shard-count 2 --timings --timings-json

      - name: Build Windows installer fixture binary
        if: matrix.suite == 'root-1'
        run: cargo build --locked --bin prodex

      - name: Test Windows installer
        if: matrix.suite == 'root-1'
        run: npm run installer:test

  macos-workspace:
    name: macOS full workspace tests
    needs: changes
    if: ${{ needs.changes.outputs.heavy == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-14
    timeout-minutes: 90
    env:
      RUSTC_WRAPPER: sccache

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.0

      - name: Install sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Run full macOS Rust suite
        env:
          RUST_BACKTRACE: "1"
        run: npm run test:full -- --jobs 2 --test-threads 2 --no-prodex-app-lib

  process-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.0

      - name: Enforce churn hygiene
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run ci:churn-hygiene:check -- --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"
            exit 0
          fi

          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [ -n "${before}" ] &&
             [ "${before}" != "0000000000000000000000000000000000000000" ] &&
             git rev-parse --verify --quiet "${before}^{commit}" >/dev/null &&
             git rev-parse --verify --quiet "${after}^{commit}" >/dev/null; then
            npm run ci:churn-hygiene:check -- --base "${before}" --head "${after}"
          else
            npm run ci:churn-hygiene:check
          fi

      - name: Enforce release hygiene
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            npm run ci:release-hygiene -- --base "${base}" --head "${head}"
            exit 0
          fi

          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [ -n "${before}" ] &&
             [ "${before}" != "0000000000000000000000000000000000000000" ] &&
             git rev-parse --verify --quiet "${before}^{commit}" >/dev/null &&
             git rev-parse --verify --quiet "${after}^{commit}" >/dev/null; then
            npm run ci:release-hygiene -- --base "${before}" --head "${after}"
          else
            npm run ci:release-hygiene
          fi

      - name: Enforce Rust file size guard
        run: npm run ci:size-guard

      - name: Enforce Rust allow attribute guard
        run: npm run ci:allow-guard

      - name: Enforce optional-tool decoupling guard
        run: npm run ci:optional-tools-guard

      - name: Enforce Smart Context correctness guard
        run: npm run ci:smart-context-guard

      - name: Check generated Smart Context evidence
        run: npm run docs:smart-context-evidence:check

      - name: Enforce Rust super wildcard guard
        run: npm run ci:super-wildcard-guard

      - name: Enforce Rust env mutation guard
        run: npm run ci:env-mutation-guard

      - name: Enforce secret-bearing argument and URL guard
        run: npm run ci:secret-boundary-guard

      - name: Enforce immutable supply-chain pins
        run: npm run ci:supply-chain-guard

      - name: Enforce crate boundaries
        run: npm run ci:crate-boundary

      - name: Enforce domain crate boundary
        run: npm run ci:domain-boundary-guard

      - name: Enforce enterprise boundary guards
        shell: bash
        run: |
          set -euo pipefail
          npm run ci:enterprise-docs-guard
          npm run ci:enterprise-id-boundary-guard
          npm run ci:enterprise-binaries-guard
          npm run ci:application-boundary-guard
          npm run ci:production-boundary-guard
          npm run ci:auth-boundary-guard
          npm run ci:config-boundary-guard
          npm run ci:control-plane-boundary-guard
          npm run ci:observability-boundary-guard
          npm run ci:provider-spi-boundary-guard
          npm run ci:storage-boundary-guard
          npm run ci:storage-postgres-boundary-guard
          npm run ci:storage-redis-boundary-guard
          npm run ci:storage-sqlite-boundary-guard
          npm run ci:gateway-core-boundary-guard
          npm run ci:gateway-http-boundary-guard
          npm run ci:deployment-security-guard

      - name: Enforce dependency duplicate budget
        run: npm run ci:dependency-duplicates

      - name: Run all Node.js tests
        run: npm run test:node

  redis-integration:
    name: Redis atomic integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      PRODEX_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      RUSTC_WRAPPER: sccache
    services:
      redis:
        image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.0

      - name: Install sccache
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          cache-bin: false

      - name: Run Redis-backed atomicity tests
        run: cargo test --locked -q -p prodex-storage-redis-runtime --test redis_rate_limit_runtime -- --ignored --test-threads=1

  backup-restore-drill:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTC_WRAPPER: sccache

    steps:
      - name: Check out repository
