      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.1

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-bin: false

      - name: Check generated Smart Context evidence
        run: npm run docs:smart-context-evidence:check

  process-guard:
    name: Process guard (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lane:
          - hygiene
          - static
          - enterprise-core
          - enterprise-storage
          - enterprise-edge
          - node
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTC_WRAPPER: sccache

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Rust toolchain
        if: matrix.lane == 'static' || matrix.lane == 'enterprise-storage'
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.1

      - name: Install sccache
        if: matrix.lane == 'static' || matrix.lane == 'enterprise-storage'
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache Rust dependencies
        if: matrix.lane == 'static' || matrix.lane == 'enterprise-storage'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-bin: false
          save-if: ${{ matrix.lane == 'static' }}

      - name: Enforce churn hygiene
        if: matrix.lane == 'hygiene'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            npm run ci:churn-hygiene:check -- --base "${{ github.event.pull_request.base.sha }}" --head "${{ github.event.pull_request.head.sha }}"
            exit 0
          fi

          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [ -n "${before}" ] &&
             [ "${before}" != "0000000000000000000000000000000000000000" ] &&
             git rev-parse --verify --quiet "${before}^{commit}" >/dev/null &&
             git rev-parse --verify --quiet "${after}^{commit}" >/dev/null; then
            npm run ci:churn-hygiene:check -- --base "${before}" --head "${after}"
          else
            npm run ci:churn-hygiene:check
          fi

      - name: Enforce release hygiene
        if: matrix.lane == 'hygiene'
        shell: bash
        env:
          RUSTC_WRAPPER: ""
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            npm run ci:release-hygiene -- --base "${base}" --head "${head}"
            exit 0
          fi

          before="${{ github.event.before }}"
          after="${{ github.sha }}"
          if [ -n "${before}" ] &&
             [ "${before}" != "0000000000000000000000000000000000000000" ] &&
             git rev-parse --verify --quiet "${before}^{commit}" >/dev/null &&
             git rev-parse --verify --quiet "${after}^{commit}" >/dev/null; then
            npm run ci:release-hygiene -- --base "${before}" --head "${after}"
          else
            npm run ci:release-hygiene
          fi

      - name: Run independent static guards in parallel
        if: matrix.lane == 'static'
        run: node scripts/ci/static-guards-parallel.mjs

      - name: Enforce enterprise boundary guards (core)
        if: matrix.lane == 'enterprise-core'
        shell: bash
        run: |
          set -euo pipefail
          npm run ci:enterprise-docs-guard
          npm run ci:enterprise-id-boundary-guard
          npm run ci:enterprise-binaries-guard
          npm run ci:application-boundary-guard
          npm run ci:production-boundary-guard
          npm run ci:auth-boundary-guard

      - name: Enforce enterprise storage boundary guards
        if: matrix.lane == 'enterprise-storage'
        shell: bash
        run: |
          set -euo pipefail
          npm run ci:config-boundary-guard
          npm run ci:control-plane-boundary-guard
          npm run ci:observability-boundary-guard
          npm run ci:provider-spi-boundary-guard
          npm run ci:storage-boundary-guard
          npm run ci:storage-postgres-boundary-guard

      - name: Enforce enterprise edge boundary guards
        if: matrix.lane == 'enterprise-edge'
        shell: bash
        run: |
          set -euo pipefail
          npm run ci:storage-redis-boundary-guard
          npm run ci:storage-sqlite-boundary-guard
          npm run ci:gateway-core-boundary-guard
          npm run ci:gateway-http-boundary-guard
          npm run ci:deployment-security-guard

      - name: Enforce dependency duplicate budget
        if: matrix.lane == 'static'
        run: npm run ci:dependency-duplicates

      - name: Run all Node.js tests
        if: matrix.lane == 'node'
        run: npm run test:node

  redis-integration:
    name: Redis atomic integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      PRODEX_TEST_REDIS_URL: redis://127.0.0.1:6379/0
      RUSTC_WRAPPER: sccache
    services:
      redis:
        image: redis:7.4.5-alpine@sha256:bb186d083732f669da90be8b0f975a37812b15e913465bb14d845db72a4e3e08
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.1

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-bin: false

      - name: Run Redis-backed atomicity tests
        shell: bash
        run: |
          set -euo pipefail
          test_log="$(mktemp)"
          trap 'rm -f "${test_log}"' EXIT
          if ! cargo test --locked -q -p prodex-storage-redis-runtime --test redis_rate_limit_runtime -- --ignored --test-threads=1 2>&1 | tee "${test_log}"; then
            exit 1
          fi
          if grep -Fq 'running 0 tests' "${test_log}"; then
            echo "Redis-backed atomicity tests matched no tests" >&2
            exit 1
          fi

  backup-restore-drill:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTC_WRAPPER: sccache

    steps:
      - name: Check out repository
