      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Summarize CI job durations
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jobs_json="${RUNNER_TEMP}/ci-jobs.json"
          summary_path="${RUNNER_TEMP}/ci-job-durations.txt"
          json_path="${RUNNER_TEMP}/ci-job-durations.json"
          gh run view "${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --attempt "${{ github.run_attempt }}" \
            --json jobs > "${jobs_json}"
          set +e
          node scripts/ci/github-job-durations.mjs \
            --max-wall-minutes 6 \
            --max-runner-minutes 75 \
            --run-id "${{ github.run_id }}" \
            --exclude-name "CI duration telemetry" \
            --limit 12 < "${jobs_json}" \
            | tee "${summary_path}"
          text_status="${PIPESTATUS[0]}"
          node scripts/ci/github-job-durations.mjs \
            --max-wall-minutes 6 \
            --max-runner-minutes 75 \
            --run-id "${{ github.run_id }}" \
            --exclude-name "CI duration telemetry" \
            --limit 12 \
            --json < "${jobs_json}" > "${json_path}"
          json_status="$?"
          set -e
          {
            echo "### CI job durations"
            echo
            echo '```text'
            cat "${summary_path}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${text_status}" -ne 0 ] || [ "${json_status}" -ne 0 ]; then
            echo "CI duration budget exceeded; telemetry uploaded without failing this run."
          fi

      - name: Upload CI duration telemetry
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-duration-telemetry
          path: |
            ${{ runner.temp }}/ci-job-durations.txt
            ${{ runner.temp }}/ci-job-durations.json
          if-no-files-found: ignore
          retention-days: 14
