name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  SCCACHE_CACHE_SIZE: 2G
  SCCACHE_GHA_ENABLED: "true"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      heavy: ${{ steps.impact.outputs.heavy }}
      runtime_bench: ${{ steps.impact.outputs.runtime_bench }}
      reason: ${{ steps.impact.outputs.reason }}
      prodex_app_matrix: ${{ steps.prodex-app-matrix.outputs.matrix }}
      windows_prodex_app_matrix: ${{ steps.prodex-app-matrix.outputs.windows_matrix }}
      runtime_proxy_matrix: ${{ steps.runtime-matrix.outputs.matrix }}
      runtime_stress_matrix: ${{ steps.runtime-matrix.outputs.stress_matrix }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Classify CI impact
        id: impact
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
            if [ -z "${base}" ] || [ "${base}" = "0000000000000000000000000000000000000000" ]; then
              base="${head}^"
            fi
          fi

          if ! git rev-parse --verify --quiet "${base}^{commit}" >/dev/null ||
             ! git rev-parse --verify --quiet "${head}^{commit}" >/dev/null; then
            {
              echo "heavy=true"
              echo "reason=missing git base/head; running full CI"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          node scripts/ci/ci-impact.mjs \
            --base "${base}" \
            --head "${head}" \
            --event-name "${{ github.event_name }}" \
            --ref "${{ github.ref }}" \
            --github-output

      - name: Report CI impact
        run: |
          echo "heavy=${{ steps.impact.outputs.heavy }}"
          echo "runtime_bench=${{ steps.impact.outputs.runtime_bench }}"
          echo "reason=${{ steps.impact.outputs.reason }}"

      - name: Generate runtime proxy shard matrix
        id: runtime-matrix
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(node scripts/ci/runtime-proxy-ci-matrix.mjs --github-matrix)"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          stress_matrix="$(node scripts/ci/runtime-proxy-ci-matrix.mjs --github-stress-matrix --event-name '${{ github.event_name }}')"
          echo "stress_matrix=${stress_matrix}" >> "${GITHUB_OUTPUT}"

      - name: Generate prodex-app test shard matrix
        id: prodex-app-matrix
        shell: bash
        run: |
          set -euo pipefail
          matrix="$(node scripts/ci/prodex-app-test-shards.mjs --github-matrix)"
          echo "matrix=${matrix}" >> "${GITHUB_OUTPUT}"
          windows_matrix="$(node scripts/ci/prodex-app-test-shards.mjs --windows-github-matrix)"
          echo "windows_matrix=${windows_matrix}" >> "${GITHUB_OUTPUT}"

  fmt:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --check

  prodex-app-lib:
    name: prodex-app library tests (${{ matrix.label }})
    needs: changes
    if: ${{ github.event_name != 'schedule' && (needs.changes.outputs.heavy == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTC_WRAPPER: sccache
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.prodex_app_matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.1

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-bin: false
          save-if: ${{ matrix.save_cache }}

      - name: Run prodex-app library partition ${{ matrix.label }}
        shell: bash
        env:
          PRODEX_APP_FILTERS: ${{ matrix.filters }}
          PRODEX_APP_SKIP_FILTERS: ${{ matrix.skip_filters }}
        run: |
          set -euo pipefail
          test_log="$(mktemp)"
          trap 'rm -f "${test_log}"' EXIT
          skip_args=()
          while IFS= read -r filter; do
            [[ -z "${filter}" ]] && continue
            skip_args+=(--skip "${filter}")
          done <<< "${PRODEX_APP_SKIP_FILTERS}"
          if [[ -n "${PRODEX_APP_FILTERS}" ]]; then
            status=0
            while IFS= read -r filter; do
              [[ -z "${filter}" ]] && continue
              if ! cargo test --locked -q -p prodex-app --lib --all-features \
                "${filter}" -- --test-threads=1 "${skip_args[@]}" 2>&1 | tee "${test_log}"; then
                status=1
              fi
              if grep -Fq 'running 0 tests' "${test_log}"; then
                echo "prodex-app filter matched no tests: ${filter}"
                status=1
              fi
            done <<< "${PRODEX_APP_FILTERS}"
            exit "${status}"
          else
            cargo test --locked -q -p prodex-app --lib --all-features \
              -- --test-threads=1 "${skip_args[@]}" 2>&1 | tee "${test_log}"
            if grep -Fq 'running 0 tests' "${test_log}"; then
              echo "prodex-app shard matched no tests"
              exit 1
            fi
          fi

      - name: Test temp-backed state with a symlinked TMPDIR
        if: matrix.suite == 'remainder'
        shell: bash
        run: |
          set -euo pipefail
          tmp_root="$(mktemp -d)"
          test_log="$(mktemp)"
          trap 'find "${tmp_root}" -depth -delete; rm -f "${test_log}"' EXIT
          mkdir -m 700 "${tmp_root}/real"
          ln -s "${tmp_root}/real" "${tmp_root}/alias"
          run_targeted_test() {
            local label="$1"
            shift
            if ! "$@" 2>&1 | tee "${test_log}"; then
              return 1
            fi
            if grep -Fq 'running 0 tests' "${test_log}"; then
              echo "${label} matched no tests" >&2
              return 1
            fi
          }
          status=0
          if ! run_targeted_test "prodex-app desktop test" env TMPDIR="${tmp_root}/alias" cargo test --locked -q -p prodex-app \
            --lib --all-features 'runtime_tools::desktop_tests::' -- --test-threads=1; then
            status=1
          fi
          if ! run_targeted_test "prodex-app offline symlink test" env TMPDIR="${tmp_root}/alias" cargo test --locked -q -p prodex-app \
            --lib --all-features \
            'runtime_proxy::smart_context::self_test::tests::offline_self_test_accepts_system_temp_symlink_alias' \
            -- --test-threads=1; then
            status=1
          fi
          exit "${status}"

  fuzz-build:
    needs: changes
    if: ${{ needs.changes.outputs.heavy == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.1

      - name: Install pinned fuzz toolchain
        run: rustup toolchain install nightly-2026-07-11 --profile minimal

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ runner.os }}-fuzz-nightly-2026-07-11
          workspaces: fuzz -> target

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2

      - name: Validate the fuzz dependency lock
        run: cargo metadata --locked --manifest-path fuzz/Cargo.toml --format-version 1 >/dev/null

      - name: Build all fuzz targets
        run: cargo +nightly-2026-07-11 fuzz build --fuzz-dir fuzz

      - name: Run bounded fuzz smoke
        run: node scripts/ci/fuzz-smoke.mjs

  docs-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Lint markdown docs
        run: npm run docs:lint

  observability-alerts:
    name: Prometheus alert rule tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate alert metadata and runbooks
        run: |
          node scripts/ci/observability-alerts-guard.mjs --self-test
          node scripts/ci/observability-alerts-guard.mjs

      - name: Check and test alert rules
        shell: bash
        run: |
          set -euo pipefail
          promtool_image="docker.io/prom/prometheus:v3.12.0@sha256:69f5241418838263316593f7274a304b095c40bcf22e57272865da91bd60a8ac"
          rules_dir="${PWD}/target/promtool"
          mkdir -p "${rules_dir}"
          sed -n '/^spec:$/,$p' deploy/observability/prodex-alerts.yaml \
            | sed '1d; s/^  //' \
            > "${rules_dir}/prodex-alerts.rules.yaml"
          test -s "${rules_dir}/prodex-alerts.rules.yaml"
          cp deploy/observability/prodex-alerts.test.yaml "${rules_dir}/"
          docker run --rm --entrypoint /bin/promtool \
            -v "${rules_dir}:/rules:ro" \
            "${promtool_image}" \
            check rules /rules/prodex-alerts.rules.yaml
          docker run --rm --entrypoint /bin/promtool \
            -v "${rules_dir}:/rules:ro" \
            "${promtool_image}" \
            test rules /rules/prodex-alerts.test.yaml

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Scan repository for leaked credentials
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${PWD}:/repo" \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source /repo --no-git --redact --no-banner --config /repo/.gitleaks.toml

  windows-workspace:
    name: Windows tests (${{ matrix.label }})
    needs: changes
    if: ${{ needs.changes.outputs.heavy == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTC_WRAPPER: sccache
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: members-foundation
            label: workspace foundation members
            save_cache: true
          - suite: members-runtime
            label: workspace runtime members
            save_cache: false
          - suite: members-storage
            label: workspace storage members
            save_cache: false
          - suite: root-0
            label: root shard 1 of 2
            auto_rotate_shard: 0
            save_cache: false
          - suite: root-1
            label: root shard 2 of 2
            auto_rotate_shard: 1
            save_cache: false
          - suite: root-tests
            label: root non-sharded tests
            save_cache: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.1

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-bin: false
          save-if: ${{ matrix.save_cache }}

      - name: Install Node.js
        if: matrix.suite == 'root-0' || matrix.suite == 'root-1'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Run Windows foundation member tests
        if: matrix.suite == 'members-foundation'
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: |
          set -euo pipefail
          test_log="$(mktemp)"
          trap 'rm -f "${test_log}"' EXIT
          run_targeted_test() {
            local label="$1"
            shift
            if ! "$@" 2>&1 | tee "${test_log}"; then
              return 1
            fi
            if grep -Fq 'running 0 tests' "${test_log}"; then
              echo "${label} matched no tests" >&2
              return 1
            fi
          }
          cargo test --locked -q --workspace --exclude prodex --exclude prodex-app --exclude 'prodex-runtime-*' --exclude 'prodex-storage*' --all-features -- --test-threads=4 --skip login:: --skip quota_doctor:: --skip run:: --skip shared_state:: --skip super_mode:: --skip rtk::tests::
          run_targeted_test "Windows optional-tools rtk tests" cargo test --locked -q -p prodex-optional-tools --lib --all-features rtk::tests:: -- --test-threads=1

      - name: Run Windows runtime member tests
        if: matrix.suite == 'members-runtime'
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: |
          set -euo pipefail
          test_log="$(mktemp)"
          trap 'rm -f "${test_log}"' EXIT
          run_targeted_test() {
            local label="$1"
            shift
            if ! "$@" 2>&1 | tee "${test_log}"; then
              return 1
            fi
            if grep -Fq 'running 0 tests' "${test_log}"; then
              echo "${label} matched no tests" >&2
              return 1
            fi
          }
          cargo test --locked -q -p 'prodex-runtime-*' --all-features -- --test-threads=4 --skip continuity_failure_reason_metrics_
          run_targeted_test "Windows broker-log continuity tests" cargo test --locked -q -p prodex-runtime-broker-log --lib --all-features continuity_failure_reason_metrics_ -- --test-threads=1

      - name: Run Windows storage member tests
        if: matrix.suite == 'members-storage'
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: cargo test --locked -q -p 'prodex-storage*' --all-features -- --test-threads=4

      - name: Prebuild Windows auto-rotate tests
        if: matrix.suite == 'root-0' || matrix.suite == 'root-1'
        run: cargo test --locked --test auto_rotate --all-features --no-run

      - name: Run Windows non-sharded root tests
        if: matrix.suite == 'root-tests'
        shell: bash
        env:
          RUST_BACKTRACE: "1"
        run: |
          cargo test --locked -q -p prodex --lib --bins --examples --test dashboard_control_plane --test enterprise_binaries --test internal_commands --all-features -- --test-threads=4
          cargo test --locked -q -p prodex --doc --all-features

      - name: Run Windows auto-rotate shard ${{ matrix.auto_rotate_shard }}
        if: matrix.suite == 'root-0' || matrix.suite == 'root-1'
        env:
          RUST_BACKTRACE: "1"
        run: node scripts/ci/auto-rotate-shards.mjs --all-features --jobs 4 --shard-index ${{ matrix.auto_rotate_shard }} --shard-count 2 --timings --timings-json

      - name: Build Windows installer fixture binary
        if: ${{ always() && !cancelled() && matrix.suite == 'root-0' }}
        run: cargo build --locked --bin prodex

      - name: Test Windows installer
        if: ${{ always() && !cancelled() && matrix.suite == 'root-0' }}
        run: npm run installer:test

  windows-prodex-app:
    name: Windows prodex-app tests (${{ matrix.label }})
    needs: changes
    if: ${{ needs.changes.outputs.heavy == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTC_WRAPPER: sccache
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.windows_prodex_app_matrix) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.1

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-bin: false
          save-if: ${{ matrix.save_cache }}

      - name: Run Windows prodex-app partition ${{ matrix.label }}
        shell: bash
        env:
          PRODEX_APP_FILTERS: ${{ matrix.filters }}
          PRODEX_APP_SKIP_FILTERS: ${{ matrix.skip_filters }}
          RUST_BACKTRACE: "1"
        run: |
          set -euo pipefail
          test_log="$(mktemp)"
          trap 'rm -f "${test_log}"' EXIT
          windows_skips=(
            --skip login::
            --skip quota_doctor::
            --skip run::
            --skip shared_state::
            --skip super_mode::
            --skip continuity_failure_reason_metrics_
            --skip rtk::tests::
          )
          if [[ -n "${PRODEX_APP_FILTERS}" ]]; then
            status=0
            while IFS= read -r filter; do
              [[ -z "${filter}" ]] && continue
              if ! cargo test --locked -q -p prodex-app --lib --all-features \
                "${filter}" -- --test-threads=1 "${windows_skips[@]}" 2>&1 | tee "${test_log}"; then
                status=1
              fi
              if grep -Fq 'running 0 tests' "${test_log}"; then
                echo "prodex-app filter matched no Windows tests: ${filter}"
                status=1
              fi
            done <<< "${PRODEX_APP_FILTERS}"
            exit "${status}"
          else
            shard_skips=()
            while IFS= read -r filter; do
              [[ -z "${filter}" ]] && continue
              shard_skips+=(--skip "${filter}")
            done <<< "${PRODEX_APP_SKIP_FILTERS}"
            cargo test --locked -q -p prodex-app --lib --all-features -- \
              --test-threads=1 "${shard_skips[@]}" "${windows_skips[@]}" 2>&1 | tee "${test_log}"
            if grep -Fq 'running 0 tests' "${test_log}"; then
              echo "prodex-app Windows shard matched no tests"
              exit 1
            fi
          fi

  macos-workspace:
    name: macOS full workspace tests
    needs: changes
    if: ${{ needs.changes.outputs.heavy == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-14
    timeout-minutes: 90
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTC_WRAPPER: sccache

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.1

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-bin: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Run full macOS Rust suite
        env:
          RUST_BACKTRACE: "1"
        run: npm run test:full -- --jobs 2 --test-threads 2 --no-prodex-app-lib

      - name: Run native macOS broker recovery tests
        env:
          RUST_BACKTRACE: "1"
        shell: bash
        run: |
          set -euo pipefail
          test_log="$(mktemp)"
          trap 'rm -f "${test_log}"' EXIT
          if ! cargo test --locked -q -p prodex-app --lib --all-features runtime_broker -- --test-threads=1 2>&1 | tee "${test_log}"; then
            exit 1
          fi
          if grep -Fq 'running 0 tests' "${test_log}"; then
            echo "macOS broker recovery tests matched no tests" >&2
            exit 1
          fi

      - name: Run native macOS Kiro selector and resume tests
        env:
          RUST_BACKTRACE: "1"
        run: |
          set -euo pipefail
          test_log="$(mktemp)"
          trap 'rm -f "${test_log}"' EXIT
          run_targeted_test() {
            local label="$1"
            shift
            if ! "$@" 2>&1 | tee "${test_log}"; then
              return 1
            fi
            if grep -Fq 'running 0 tests' "${test_log}"; then
              echo "${label} matched no tests" >&2
              return 1
            fi
          }
          status=0
          for filter in \
            provider_default_efforts_follow_catalog_for_every_provider \
            pure_interactive_resolution_prompts_presidio_before_resumed_sub_agent_config \
            resume_provider_bridge_leaves_the_session_model_authoritative \
            runtime_kiro_streaming_command_forwards_model_and_effort \
            external_provider_catalog_args_use_imported_kiro_models \
            effort_suggestions_fall_back_for_dynamic_models \
            native_kiro_resolution_does_not_inject_the_codex_bridge_provider \
            native_kiro_cli_maps_resume_session_id
          do
            if ! run_targeted_test "macOS Kiro test ${filter}" cargo test --locked -q -p prodex-app --lib --all-features \
              "${filter}" -- --test-threads=1; then
              status=1
            fi
          done
          exit "${status}"

  smart-context-evidence:
    name: Smart Context evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUSTC_WRAPPER: sccache

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
