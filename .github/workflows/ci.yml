    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.1

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Run profile command internal tests
        shell: bash
        run: |
          set -euo pipefail
          test_log="$(mktemp)"
          trap 'rm -f "${test_log}"' EXIT
          if ! cargo test --locked -p prodex-app --lib --all-features profile_commands_internal_tests:: -- --test-threads=1 2>&1 | tee "${test_log}"; then
            exit 1
          fi
          if grep -Fq 'running 0 tests' "${test_log}"; then
            echo "profile command internal tests matched no tests" >&2
            exit 1
          fi

  main-internal-core:
