    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.1

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-bin: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Build instrumented runtime load binary
        run: cargo build --locked --features allocation-bench-support --bin prodex

      - name: Run runtime proxy load smoke
        run: npm run ci:runtime-load-smoke -- --mode proxy --prodex target/debug/prodex

  runtime-stress:
    name: Runtime stress (${{ matrix.label }})
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.runtime_stress_matrix) }}
    env:
      RUNTIME_STRESS_ARTIFACT_DIR: target/ci/runtime-stress/${{ matrix.id }}
      PRODEX_RUNTIME_LOG_DIR: target/ci/runtime-stress/${{ matrix.id }}/runtime-logs
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"
      RUSTC_WRAPPER: sccache

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.1

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          save-if: ${{ matrix.save_cache }}

      - name: Prepare runtime stress diagnostics
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${RUNTIME_STRESS_ARTIFACT_DIR}"
          mkdir -p "${PRODEX_RUNTIME_LOG_DIR}"
          {
            echo "suite=${{ matrix.suite }}"
            echo "label=${{ matrix.label }}"
            echo "artifact_dir=${RUNTIME_STRESS_ARTIFACT_DIR}"
            echo "runtime_log_dir=${PRODEX_RUNTIME_LOG_DIR}"
            echo "started_at=$(date -u +%FT%TZ)"
            echo "command=npm run ci:runtime-stress -- --suite ${{ matrix.suite }} --shard-index ${{ matrix.shard }} --shard-count ${{ matrix.shard_count }}"
          } > "${RUNTIME_STRESS_ARTIFACT_DIR}/metadata.txt"

      - name: Run runtime stress ${{ matrix.label }}
        shell: bash
        run: |
          set -euo pipefail
          npm run ci:runtime-stress -- \
            --suite "${{ matrix.suite }}" \
            --shard-index "${{ matrix.shard }}" \
            --shard-count "${{ matrix.shard_count }}" \
            2>&1 | tee "${RUNTIME_STRESS_ARTIFACT_DIR}/runtime-stress.log"

      - name: Collect runtime stress diagnostics
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNTIME_STRESS_ARTIFACT_DIR}" "${PRODEX_RUNTIME_LOG_DIR}"
          diagnostics_path="${RUNTIME_STRESS_ARTIFACT_DIR}/diagnostics.txt"
          pointer_path="${PRODEX_RUNTIME_LOG_DIR}/prodex-runtime-latest.path"
          latest_log_path=""
          {
            echo "suite=${{ matrix.suite }}"
            echo "label=${{ matrix.label }}"
            echo "shard=${{ matrix.shard }}"
            echo "shard_count=${{ matrix.shard_count }}"
            echo "artifact_dir=${RUNTIME_STRESS_ARTIFACT_DIR}"
            echo "runtime_log_dir=${PRODEX_RUNTIME_LOG_DIR}"
            echo "finished_at=$(date -u +%FT%TZ)"
            echo "runtime_log_pointer=${pointer_path}"
          } > "${diagnostics_path}"
          if [[ -f "${pointer_path}" ]]; then
            latest_log_path="$(tr -d '\r\n' < "${pointer_path}")"
            echo "runtime_log_pointer_target=${latest_log_path}" >> "${diagnostics_path}"
          else
            echo "runtime_log_pointer_target=missing" >> "${diagnostics_path}"
          fi
          if [[ -z "${latest_log_path}" || ! -f "${latest_log_path}" ]]; then
            latest_log_path="$(
              find "${PRODEX_RUNTIME_LOG_DIR}" -maxdepth 1 -type f -name 'prodex-runtime*.log' -printf '%T@ %p\n' \
                | sort -nr \
                | head -n 1 \
                | cut -d' ' -f2-
            )"
          fi
          find "${PRODEX_RUNTIME_LOG_DIR}" -maxdepth 1 -type f -print \
            | sort \
            | sed 's/^/log_entry=/' >> "${diagnostics_path}"
          if [[ -n "${latest_log_path}" && -f "${latest_log_path}" ]]; then
            echo "latest_runtime_log=${latest_log_path}" >> "${diagnostics_path}"
            cp "${latest_log_path}" "${RUNTIME_STRESS_ARTIFACT_DIR}/latest-runtime.log"
            tail -n 200 "${latest_log_path}" | tee "${RUNTIME_STRESS_ARTIFACT_DIR}/latest-runtime-log-tail.txt"
          else
            echo "latest_runtime_log=missing" >> "${diagnostics_path}"
          fi

      - name: Upload runtime stress diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-stress-${{ matrix.id }}-diagnostics
          path: ${{ env.RUNTIME_STRESS_ARTIFACT_DIR }}
          if-no-files-found: ignore

  real-mojo:
    name: Real Mojo / parity
    if: ${{ github.event_name != 'schedule' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MOJO_VERSION: "1.0.0"
      UV_VERSION: "0.11.7"
      PRODEX_MOJO_REQUIRED: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.1

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Install pinned Mojo toolchain
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python "mojo==${MOJO_VERSION}"
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"

      - name: Verify toolchains
        shell: bash
        run: |
          set -euo pipefail
          mojo_version="$(mojo --version)"
          printf '%s\n' "${mojo_version}"
          case "${mojo_version}" in
            "Mojo ${MOJO_VERSION}"*) ;;
            *) echo "unexpected Mojo version: ${mojo_version}" >&2; exit 1 ;;
          esac
          command -v mojo
          rustc --version
          cargo --version
          ar --version | head -n 1

      - name: Build Prodex with real Mojo
        shell: bash
        run: |
          set -euo pipefail
          PRODEX_MOJO_VERSION="${MOJO_VERSION}" cargo build --locked --features mojo-core --bin prodex
          test -x target/debug/prodex
          target/debug/prodex --version
          mojo_archive="$(find target/debug/build -type f -name 'libprodex_mojo_core.a' -print -quit)"
          test -s "${mojo_archive}"
          file "${mojo_archive}"
          diagnostics="$(PRODEX_HOME="${RUNNER_TEMP}/prodex-mojo-home" target/debug/prodex doctor --runtime --json)"
          printf '%s\n' "${diagnostics}" | grep -F '"implementation": "mojo-compiled-in"'
          printf '%s\n' "${diagnostics}" | grep -F '"fallback": false'
          printf '%s\n' "${diagnostics}" | grep -F '"compiler_required": false'
          printf '%s\n' "${diagnostics}" | grep -F '"build_strict": true'
          printf '%s\n' "${diagnostics}" | grep -F '"self_test": "passed"'

      - name: Run quota Mojo smoke and parity tests
        run: cargo test --locked -q -p prodex-quota --features mojo -- --test-threads=1

      - name: Run runtime-proxy Mojo smoke and parity tests
        run: cargo test --locked -q -p prodex-runtime-proxy --features mojo -- --test-threads=1

      - name: Run runtime-quota Mojo smoke and parity tests
        run: cargo test --locked -q -p prodex-runtime-quota --features mojo -- --test-threads=1

      - name: Run provider-routing Mojo smoke and parity tests
        run: cargo test --locked -q -p prodex-provider-spi --features mojo -- --test-threads=1

      - name: Run provider-constraint and tuning Mojo parity tests
        run: |
          cargo test --locked -q -p prodex-provider-core --features mojo -- --test-threads=1
          cargo test --locked -q -p prodex-runtime-tuning --features mojo -- --test-threads=1

      - name: Run context and runtime-policy Mojo parity tests
        run: |
          cargo test --locked -q -p prodex-context --features mojo -- --test-threads=1
          cargo test --locked -q -p prodex-runtime-policy --features mojo -- --test-threads=1

      - name: Run new Mojo production-path tests
        run: |
          cargo test --locked -q -p prodex-app --features mojo-core --lib resolved_gateway_request_constraints -- --test-threads=1
          cargo test --locked -q -p prodex-app --features mojo-core --lib smart_context_auto_rehydrate_plan_defers_over_budget_refs -- --test-threads=1

      - name: Run Mojo core kernel tests
        run: cargo test --locked -q -p prodex-mojo-core --features mojo-core -- --test-threads=1

  ci-duration-telemetry:
    name: CI duration telemetry
    needs:
      - changes
      - fmt
      - prodex-app-lib
      - fuzz-build
      - docs-lint
      - observability-alerts
      - secret-scan
      - windows-workspace
      - windows-prodex-app
      - macos-workspace
      - smart-context-evidence
      - process-guard
      - redis-integration
      - backup-restore-drill
      - compat-replay-gate
      - rust-quality
      - kics
      - supply-chain
      - release-sync
      - npm-package-smoke
      - standalone-installer
      - auto-rotate
      - profile-commands-internal
      - main-internal-core
      - env-sensitive-parallel-guard
      - main-internal-runtime-proxy
      - runtime-proxy-bench-smoke
      - runtime-load-smoke
      - runtime-stress
      - real-mojo
    if: ${{ always() && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Summarize CI job durations
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jobs_json="${RUNNER_TEMP}/ci-jobs.json"
          summary_path="${RUNNER_TEMP}/ci-job-durations.txt"
          json_path="${RUNNER_TEMP}/ci-job-durations.json"
          gh run view "${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --attempt "${{ github.run_attempt }}" \
            --json jobs > "${jobs_json}"
          set +e
          node scripts/ci/github-job-durations.mjs \
            --max-wall-minutes 6 \
            --max-runner-minutes 75 \
            --run-id "${{ github.run_id }}" \
            --exclude-name "CI duration telemetry" \
            --limit 12 < "${jobs_json}" \
            | tee "${summary_path}"
          text_status="${PIPESTATUS[0]}"
          node scripts/ci/github-job-durations.mjs \
            --max-wall-minutes 6 \
            --max-runner-minutes 75 \
            --run-id "${{ github.run_id }}" \
            --exclude-name "CI duration telemetry" \
            --limit 12 \
            --json < "${jobs_json}" > "${json_path}"
          json_status="$?"
          set -e
          {
            echo "### CI job durations"
            echo
            echo '```text'
            cat "${summary_path}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${text_status}" -ne 0 ] || [ "${json_status}" -ne 0 ]; then
            echo "CI duration budget exceeded; telemetry uploaded without failing this run."
          fi

      - name: Upload CI duration telemetry
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ci-duration-telemetry
          path: |
            ${{ runner.temp }}/ci-job-durations.txt
            ${{ runner.temp }}/ci-job-durations.json
          if-no-files-found: ignore
          retention-days: 14
