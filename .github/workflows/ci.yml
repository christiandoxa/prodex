        run: npm run compat:offline-gate

  rust-quality:
    name: SonarQube Rust quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache
      SONAR_HOST_URL: http://127.0.0.1:9000

    services:
      sonarqube:
        image: docker.io/library/sonarqube:26.7.0.124771-community@sha256:160bd2f6a3485bd09b655ef22dd63c02bd1fa7ba82aa5d9973fd010b8bcca0b3
        env:
          SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
        ports:
          - 9000:9000

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.1
          components: clippy

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-bin: false

      - name: Generate production Clippy JSON report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/sonar
          cargo clippy --locked --workspace --exclude prodex-bench-support --lib --bins --all-features --message-format=json -- -D warnings > target/sonar/clippy-report.json

      - name: Run clippy warning gate
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Create ephemeral local Sonar token
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            status="$(curl --fail --silent --show-error "${SONAR_HOST_URL}/api/system/status" 2>/dev/null | jq -r '.status // empty' || true)"
            if [ "${status}" = "UP" ]; then
              break
            fi
            if [ "${attempt}" -eq 60 ]; then
              echo "Local SonarQube did not become ready." >&2
              exit 1
            fi
            sleep 5
          done
          local_admin="admin"
          local_auth="$(printf '%s:%s' "${local_admin}" "${local_admin}" | base64 --wrap=0)"
          token_name="prodex-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          response="$(curl --fail --silent --show-error --header "Authorization: Basic ${local_auth}" --request POST \
            --data-urlencode "name=${token_name}" \
            "${SONAR_HOST_URL}/api/user_tokens/generate")"
          token="$(jq -er '.token' <<<"${response}")"
          echo "::add-mask::${token}"
          sonar_token_key="SONAR_TOKEN"
          {
            printf '%s=%s\n' "${sonar_token_key}" "${token}"
            echo "SONAR_TOKEN_NAME=${token_name}"
          } >> "${GITHUB_ENV}"

      - name: Run SonarQube scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        with:
          args: >-
            -Dsonar.projectKey=prodex-ci
            -Dsonar.projectName=prodex
            -Dsonar.projectVersion=${{ github.sha }}

      - name: Require zero Sonar issues
        shell: bash
        run: |
          set -euo pipefail
          status_response="$(curl --fail --silent --show-error --get \
            --header "Authorization: Bearer ${SONAR_TOKEN}" \
            --data-urlencode "projectKey=prodex-ci" \
            "${SONAR_HOST_URL}/api/qualitygates/project_status")"
          jq -er '.projectStatus.status == "OK"' <<<"${status_response}" >/dev/null
          response="$(curl --fail --silent --show-error --get \
            --header "Authorization: Bearer ${SONAR_TOKEN}" \
            --data-urlencode "componentKeys=prodex-ci" \
            --data-urlencode "resolved=false" \
            --data-urlencode "ps=100" \
            "${SONAR_HOST_URL}/api/issues/search")"
          total="$(jq -er '(.paging.total // .total) | select(type == "number")' <<<"${response}")"
          if [ "${total}" -ne 0 ]; then
            echo "Sonar unresolved issues:" >&2
            jq -r '.issues[] | "\(.component | sub("^prodex-ci:"; "")):\(.line // 0) \(.rule) \(.message)"' \
              <<<"${response}" >&2
            echo "Sonar reported ${total} unresolved issue(s); refusing to continue." >&2
            exit 1
          fi
          hotspots_response="$(curl --fail --silent --show-error --get \
            --header "Authorization: Bearer ${SONAR_TOKEN}" \
            --data-urlencode "projectKey=prodex-ci" \
            --data-urlencode "status=TO_REVIEW" \
            --data-urlencode "ps=1" \
            "${SONAR_HOST_URL}/api/hotspots/search")"
          hotspot_total="$(jq -er '(.paging.total // .total) | select(type == "number")' <<<"${hotspots_response}")"
          if [ "${hotspot_total}" -ne 0 ]; then
            echo "Sonar reported ${hotspot_total} unreviewed security hotspot(s); refusing to continue." >&2
            exit 1
          fi
          measures_response="$(curl --fail --silent --show-error --get \
            --header "Authorization: Bearer ${SONAR_TOKEN}" \
            --data-urlencode "component=prodex-ci" \
            --data-urlencode "metricKeys=security_rating,reliability_rating,sqale_rating,duplicated_lines_density" \
            "${SONAR_HOST_URL}/api/measures/component")"
          measures="$(jq -cer '.component.measures | map({key: .metric, value: (.value | tonumber)}) | from_entries' \
            <<<"${measures_response}")"
          if ! jq -e '
            .security_rating == 1 and
            .reliability_rating == 1 and
            .sqale_rating == 1 and
            .duplicated_lines_density <= 3
          ' <<<"${measures}" >/dev/null; then
            echo "Sonar rating or duplication gate failed: ${measures}" >&2
            exit 1
          fi
          echo "Sonar zero-issue, zero-hotspot, A-rating, and duplication gates: passed."

      - name: Revoke ephemeral local Sonar token
        if: ${{ always() && env.SONAR_TOKEN_NAME != '' }}
        shell: bash
        run: |
          local_admin="admin"
          local_auth="$(printf '%s:%s' "${local_admin}" "${local_admin}" | base64 --wrap=0)"
          curl --fail --silent --show-error --header "Authorization: Basic ${local_auth}" --request POST \
            --data-urlencode "name=${SONAR_TOKEN_NAME}" \
            "${SONAR_HOST_URL}/api/user_tokens/revoke" >/dev/null

  kics:
    name: KICS IaC security gate
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run KICS zero-finding gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/kics
          kics_image="docker.io/checkmarx/kics:v2.1.20@sha256:3e5a268eb8adda2e5a483c9359ddfc4cd520ab856a7076dc0b1d8784a37e2602"
          docker pull "${kics_image}"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --network none \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --volume "${PWD}:/path:ro" \
            --volume "${PWD}/target/kics:/results" \
            "${kics_image}" \
            scan -p /path -o /results \
            --output-name prodex-kics \
            --report-formats json,sarif \
            --disable-secrets \
            --disable-full-descriptions \
            --exclude-queries e84eaf4d-2f45-47b2-abe8-e581b06deb66,8c978947-0ff6-485c-b0c2-0bfca6026466 \
            --fail-on critical,high,medium,low,info \
            --minimal-ui \
            --no-progress
          kics_total="$(jq -er '.total_counter | select(type == "number")' target/kics/prodex-kics.json)"
          if [ "${kics_total}" -ne 0 ]; then
            jq -r '.queries[]? | "\(.severity) \(.query_id) \(.query_name): \(.files | length) finding(s)"' \
              target/kics/prodex-kics.json >&2
            echo "KICS reported ${kics_total} finding(s); refusing to continue." >&2
            exit 1
          fi
          echo "KICS zero-finding JSON gate: passed."

      - name: Upload KICS reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kics-iac-results
          path: target/kics
          if-no-files-found: error
          retention-days: 14

  supply-chain:
    needs: changes
    if: needs.changes.outputs.heavy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTC_WRAPPER: sccache

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.1

      - name: Install sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          cache-bin: false

      - name: Cache cargo supply-chain tools
        id: cargo-supply-chain-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
            ~/.cargo/bin/cargo-machete
          key: ${{ runner.os }}-cargo-supply-chain-tools-audit-0.22.1-deny-0.19.0-machete-0.9.2

      - name: Install cargo-audit
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --locked --version 0.22.1
          fi

      - name: Run cargo audit
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if cargo audit; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done

      - name: Install cargo-deny
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cargo-deny >/dev/null 2>&1; then
            cargo install cargo-deny --locked --version 0.19.0
          fi

      - name: Run cargo deny checks
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if cargo deny check advisories bans licenses sources; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done

      - name: Install cargo-machete
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v cargo-machete >/dev/null 2>&1; then
            cargo install cargo-machete --locked --version 0.9.2
          fi

      - name: Reject unused direct dependencies
        run: cargo machete --with-metadata

      - name: Generate source SBOM
        shell: bash
        run: |
          set -euo pipefail
          syft_image="anchore/syft:v1.41.2@sha256:962c5626d30cdfb814802598cbb7b63cb690bf979a4bc0ff1d9c6e0cb441db7f"
          for attempt in 1 2 3; do
            if docker pull "$syft_image"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
          docker run --rm \
            -v "${PWD}:/source:ro" \
            "$syft_image" \
            dir:/source --exclude './target/**' --exclude './.git/**' -o spdx-json \
            > source-sbom.spdx.json
          node -e 'JSON.parse(require("node:fs").readFileSync("source-sbom.spdx.json", "utf8"))'

      - name: Upload source SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: source-sbom
          path: source-sbom.spdx.json
          if-no-files-found: error
          retention-days: 14

