      - name: Upload redacted backup and restore evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: backup-restore-drill-${{ github.run_id }}-${{ github.run_attempt }}
