name: standalone release
run-name: standalone ${{ inputs.publish && 'publish' || 'verify' }} ${{ inputs.version }} @ ${{ inputs.target_sha }}

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release after all gates (false builds and verifies without any release/tag mutation)
        required: false
        default: false
        type: boolean
      target_sha:
        description: Exact main commit to release
        required: true
        type: string
      version:
        description: Exact Cargo package version to release
        required: true
        type: string
      publish_at:
        description: Optional absolute UTC publication time (ISO 8601)
        required: false
        default: ""
        type: string

concurrency:
  # Keep real publications serialized; rehearsals never block that queue.
  group: ${{ inputs.publish && 'standalone-release' || format('standalone-verify-{0}', inputs.target_sha) }}
  # Superseded same-source rehearsals are disposable; publication is not.
  cancel-in-progress: ${{ !inputs.publish }}

permissions:
  contents: read

env:
  CLAMAV_IMAGE: ghcr.io/hugoalh/scan-virus-ghaction:0.20.1-clamav@sha256:806278ed1a2829743c4b9d92f29bdd49e384ab3cdc6bf19caea19b1390d4c085
  CARGO_INCREMENTAL: "0"
  CARGO_HTTP_MULTIPLEXING: "false"
  SCCACHE_CACHE_SIZE: 2G
  SCCACHE_GHA_ENABLED: "true"
  KIRO_CLI_VERSION: "2.35.1"
  MOJO_VERSION: "1.2.0"
  UV_VERSION: "0.11.7"

jobs:
  release-preflight:
    name: Validate release source and dependency pins
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    outputs:
      target_sha: ${{ steps.target.outputs.target_sha }}
      version: ${{ steps.target.outputs.version }}
      publish_at: ${{ steps.target.outputs.publish_at }}
      kiro_cli_version: ${{ env.KIRO_CLI_VERSION }}

    steps:
      - name: Check out release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node.js for release metadata checks
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Resolve release target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_PUBLISH_AT: ${{ inputs.publish_at }}
          RELEASE_TARGET_SHA: ${{ inputs.target_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
        shell: bash
        run: |
          set -euo pipefail
          ref_name="${GITHUB_REF_NAME}"
          ref_type="${GITHUB_REF_TYPE:-branch}"
          target_sha="${RELEASE_TARGET_SHA}"
          if [ "${ref_type}" != "branch" ] || [ "${ref_name}" != "main" ]; then
            echo "workflow_dispatch release runs must target main" >&2
            exit 1
          fi
          if [[ ! "${target_sha}" =~ ^[0-9a-f]{40}$ ]] || [ "${GITHUB_SHA}" != "${target_sha}" ]; then
            echo "release target must be the exact dispatched main commit" >&2
            exit 1
          fi
          version="$(python - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as handle:
              print(tomllib.load(handle)["package"]["version"])
          PY
          )"
          if [ "${version}" != "${RELEASE_VERSION}" ]; then
            echo "release version ${RELEASE_VERSION} does not match Cargo.toml ${version}" >&2
            exit 1
          fi
          publish_at="$(RELEASE_PUBLISH_AT="${RELEASE_PUBLISH_AT}" python - <<'PY'
          from datetime import datetime, timezone
          import os

          value = os.environ["RELEASE_PUBLISH_AT"].strip()
          if not value:
              print("")
          else:
              parsed = datetime.fromisoformat(value.replace("Z", "+00:00"))
              if parsed.tzinfo is None:
                  raise SystemExit("publish_at must include an explicit timezone")
              print(parsed.astimezone(timezone.utc).isoformat().replace("+00:00", "Z"))
          PY
          )"
          # Rehearsals may validate an already-published version, but never
          # change its tag or release. Real publication retains every guard.
          if [ "${RELEASE_PUBLISH}" = true ]; then
            release_status="$(gh api --include "repos/${GITHUB_REPOSITORY}/releases/tags/${version}" 2>&1 | awk '/^HTTP\// { code = $2 } END { print code }')" || true
            case "${release_status}" in
              404) ;;
              200) echo "release ${version} already exists; refusing to overwrite it" >&2; exit 1 ;;
              *) echo "could not verify whether release ${version} exists" >&2; exit 1 ;;
            esac
            git fetch origin --tags --force
            if release_tag_sha="$(git rev-list -n1 "${version}" 2>/dev/null)" \
              && [ "${release_tag_sha}" != "${target_sha}" ]; then
              echo "release tag ${version} targets ${release_tag_sha}, not ${target_sha}" >&2
              exit 1
            fi
            if ! git rev-parse --verify --quiet "refs/tags/${version}" >/dev/null; then
              node scripts/ci/release-version-order.mjs --version "${version}" --head "${target_sha}"
            fi
          elif [ -n "${publish_at}" ]; then
            echo "publish_at is valid only with publish=true" >&2
            exit 1
          fi
          {
            echo "target_sha=${target_sha}"
            echo "version=${version}"
            echo "publish_at=${publish_at}"
          } >> "${GITHUB_OUTPUT}"

      - name: Verify optional-tool freshness at release cut
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.target.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/optional-tools-freshness.mjs \
            --check --json --checkpoint B --release-sha "${RELEASE_SHA}" \
            | tee "${RUNNER_TEMP}/optional-tools-freshness-B.json"
          test -s "${RUNNER_TEMP}/optional-tools-freshness-B.json"

      - name: Verify runtime dependency latest-stable references
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/runtime-dependency-freshness.sh

      - name: Upload optional-tool freshness evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: optional-tools-freshness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/optional-tools-freshness-B.json
          if-no-files-found: error
          retention-days: 14

      - name: Verify pinned Kiro CLI release
        shell: bash
        run: |
          set -euo pipefail
          manifest_version="$(curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors --retry-delay 2 -fsSL https://prod.download.cli.kiro.dev/stable/latest/manifest.json | python -c 'import json, sys; print(json.load(sys.stdin)["version"])')"
          if [ "${manifest_version}" != "${KIRO_CLI_VERSION}" ]; then
            echo "Kiro stable release ${manifest_version} does not match pinned ${KIRO_CLI_VERSION}" >&2
            exit 1
          fi

  verify-ci:
    name: Verify CI is green
    # Do not hold an idle runner while production targets are compiling.
    # The exact-SHA gate still precedes every privileged publication job.
    needs: [release-preflight, build]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    outputs:
      target_sha: ${{ needs.release-preflight.outputs.target_sha }}
      version: ${{ needs.release-preflight.outputs.version }}
      publish_at: ${{ needs.release-preflight.outputs.publish_at }}
    steps:
      - name: Check out exact release source for CI lookup
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Wait for CI success
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ needs.release-preflight.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 75 * 60))
          while true; do
            runs_json="$(gh run list --workflow ci.yml --event push --limit 50 --json headSha,status,conclusion,url)"
            set +e
            result="$(
              RUNS_JSON="${runs_json}" python - <<'PY'
          import json
          import os
          import sys

          target = os.environ["TARGET_SHA"]
          runs = [run for run in json.loads(os.environ["RUNS_JSON"]) if run.get("headSha") == target]
          if not runs:
              print("not-found")
              sys.exit(3)
          successful = [run for run in runs if run.get("status") == "completed" and run.get("conclusion") == "success"]
          if successful:
              run = successful[0]
              print(f"{run.get('conclusion')} {run.get('url')}")
              sys.exit(0)
          pending = [run for run in runs if run.get("status") != "completed"]
          if pending:
              run = pending[0]
              print(f"{run.get('status')}/{run.get('conclusion') or 'pending'} {run.get('url')}")
              sys.exit(2)
          run = runs[0]
          print(f"{run.get('conclusion')} {run.get('url')}")
          sys.exit(0)
          PY
            )"
            status=$?
            set -e

            if [ "${status}" -eq 0 ]; then
              conclusion="${result%% *}"
              url="${result#* }"
              if [ "${conclusion}" = "success" ]; then
                echo "CI success for ${TARGET_SHA}: ${url}"
                exit 0
              fi
              echo "CI did not pass for ${TARGET_SHA}: ${result}" >&2
              exit 1
            fi

            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "timed out waiting for CI success for ${TARGET_SHA}: ${result}" >&2
              exit 1
            fi
            echo "CI for ${TARGET_SHA}: ${result}; polling again in 30s"
            sleep 30
          done


  antivirus-health:
    name: Prove antivirus engine while targets compile
    needs: release-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Verify pinned antivirus image
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect "${CLAMAV_IMAGE%@*}" --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | grep -Fx "ghcr.io/hugoalh/scan-virus-ghaction@${CLAMAV_IMAGE##*@}"

      - name: Prepare antivirus engine health check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scan-health
          printf '%s' 'X5O!P%@AP[4\PZX54(P^)7CC)7}$' 'EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' > scan-health/eicar.com

      - name: Verify antivirus engine detects EICAR
        id: antivirus_health
        continue-on-error: true
        uses: hugoalh/scan-virus-ghaction/clamav@99c81e8991ad1074a14e5f22a21bce9be035e14e # v0.20.1
        with:
          clamav_update: "True"
          ignores_pre: |-
            Param($ElementPreMeta)
            Return ($ElementPreMeta.Path -notmatch '^scan-health[\\/]')

      - name: Require a working antivirus engine
        if: ${{ always() }}
        env:
          SCAN_OUTCOME: ${{ steps.antivirus_health.outcome }}
          SCAN_FINISH: ${{ steps.antivirus_health.outputs.finish }}
          SCAN_FOUND: ${{ steps.antivirus_health.outputs.found }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f scan-health/eicar.com
          rmdir scan-health
          if [ "${SCAN_OUTCOME}" != "failure" ] || [ "${SCAN_FINISH}" != "true" ] || [ "${SCAN_FOUND}" != "true" ]; then
            echo "antivirus engine health check did not detect EICAR" >&2
            exit 1
          fi


  build:
    name: Release target ${{ matrix.target }}
    needs: release-preflight
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-latest
            artifact-name: x86_64-unknown-linux-gnu
            binary-name: prodex
            use-cross: true
            can-native-smoke: true
            can-mojo-runtime-smoke: true
            max-glibc: GLIBC_2.23
            mojo-release: true
            mojo-target-cpu: x86-64
            mojo-features: mojo-core
          - target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-latest
            artifact-name: aarch64-unknown-linux-gnu
            binary-name: prodex
            use-cross: true
            can-native-smoke: false
            can-mojo-runtime-smoke: true
            max-glibc: GLIBC_2.23
            mojo-release: true
            mojo-target-cpu: generic
            mojo-features: mojo-core
          - target: x86_64-apple-darwin
            runs-on: macos-14
            artifact-name: x86_64-apple-darwin
            binary-name: prodex
            use-cross: false
            can-native-smoke: true
            can-mojo-runtime-smoke: true
            mojo-release: true
            mojo-target-cpu: x86-64
            mojo-features: mojo-core
          - target: aarch64-apple-darwin
            runs-on: macos-14
            artifact-name: aarch64-apple-darwin
            binary-name: prodex
            use-cross: false
            can-native-smoke: true
            can-mojo-runtime-smoke: true
            mojo-release: true
            mojo-target-cpu: generic
            mojo-features: mojo-core
          - target: x86_64-pc-windows-msvc
            # The source-pinned production-profile ARM-host benchmark built
            # and executed PE x64 under Windows-on-ARM emulation in 314s.
            runs-on: windows-11-arm
            artifact-name: x86_64-pc-windows-msvc
            binary-name: prodex.exe
            use-cross: false
            can-native-smoke: true
            can-mojo-runtime-smoke: true
            mojo-release: true
            mojo-target-cpu: x86-64
            mojo-features: mojo-core
          - target: aarch64-pc-windows-msvc
            runs-on: windows-11-arm
            artifact-name: aarch64-pc-windows-msvc
            binary-name: prodex.exe
            use-cross: false
            can-native-smoke: true
            can-mojo-runtime-smoke: true
            mojo-release: true
            mojo-target-cpu: generic
            mojo-features: mojo-core

    uses: ./.github/workflows/release-target.yml
    with:
      target_sha: ${{ needs.release-preflight.outputs.target_sha }}
      version: ${{ needs.release-preflight.outputs.version }}
      kiro_cli_version: ${{ needs.release-preflight.outputs.kiro_cli_version }}
      platforms: ${{ format('[{0}]', toJSON(matrix)) }}


  validate-release-assets:
    name: Validate release assets without publishing
    runs-on: ubuntu-latest
    needs:
      - release-preflight
      - build
      - antivirus-health
    timeout-minutes: 35
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.release-preflight.outputs.version }}"
          ref_name="${GITHUB_REF_NAME}"
          ref_type="${GITHUB_REF_TYPE:-branch}"
          target_sha="${{ needs.release-preflight.outputs.target_sha }}"
          if [ "${ref_type}" != "branch" ] || [ "${ref_name}" != "main" ]; then
            echo "workflow_dispatch release runs must target main" >&2
            exit 1
          fi
          {
            echo "version=${version}"
            echo "tag=${version}"
            echo "target_sha=${target_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Download built binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: '{aarch64,x86_64}-*'
          path: artifacts

      - name: Generate release SBOM
        shell: bash
        run: |
          set -euo pipefail
          rm -rf sbom-input
          mkdir -p sbom-input
          while IFS= read -r -d '' file; do
            parent="$(basename "$(dirname "${file}")")"
            mkdir -p "sbom-input/${parent}"
            cp "${file}" "sbom-input/${parent}/$(basename "${file}")"
          done < <(find artifacts -mindepth 2 -maxdepth 2 -type f \( -name 'prodex' -o -name 'prodex.exe' \) -print0)
          node scripts/ci/codex-purity-guard.mjs sbom-input
          if ! find sbom-input -maxdepth 2 -type f -print -quit | grep -q .; then
            echo "release SBOM input is empty" >&2
            exit 1
          fi
          syft_image="anchore/syft:v1.41.2@sha256:962c5626d30cdfb814802598cbb7b63cb690bf979a4bc0ff1d9c6e0cb441db7f"
          for attempt in 1 2 3; do
            if docker pull "$syft_image"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
          docker run --rm \
            -v "${PWD}/sbom-input:/source:ro" \
            "$syft_image" \
            dir:/source -o spdx-json > release-sbom.spdx.json
          node scripts/ci/codex-purity-guard.mjs release-sbom.spdx.json

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          while IFS= read -r -d '' file; do
            parent="$(basename "$(dirname "${file}")")"
            base="$(basename "${file}")"
            ext=""
            stem="${base}"
            if [[ "${base}" == *.* ]]; then
              ext=".${base##*.}"
              stem="${base%.*}"
            fi
            cp "${file}" "release-assets/${stem}-${parent}${ext}"
          done < <(find artifacts -mindepth 2 -maxdepth 2 -type f \( -name 'prodex' -o -name 'prodex.exe' \) -print0)
          cp release-sbom.spdx.json release-assets/release-sbom.spdx.json
          cp install.sh release-assets/install.sh
          cp install.ps1 release-assets/install.ps1
          chmod 0755 release-assets/install.sh

      - name: Generate release capability manifests
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ steps.release.outputs.target_sha }}
        run: |
          set -euo pipefail
          node scripts/release/render-release-manifest.mjs \
            --version "${RELEASE_VERSION}" \
            --commit "${RELEASE_SHA}" \
            --input migration/release-target-matrix.tsv \
            --output-tsv release-assets/release-manifest.tsv \
            --output-json release-assets/release-manifest.json
          awk -F '\t' -v sha="${RELEASE_SHA}" '$1 == "commit" && $2 == sha { found = 1 } END { exit found ? 0 : 1 }' release-assets/release-manifest.tsv
          RELEASE_SHA="${RELEASE_SHA}" RELEASE_VERSION="${RELEASE_VERSION}" node -e 'const m=require("./release-assets/release-manifest.json"); if(m.commit!==process.env.RELEASE_SHA || m.version!==process.env.RELEASE_VERSION) process.exit(1)'

      - name: Generate and verify release checksums
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/codex-purity-guard.mjs release-assets
          if find release-assets -type f -iname '*codex*' -print -quit | grep -q .; then
            echo "release assets must not contain Codex executables or bundles" >&2
            exit 1
          fi
          (
            cd release-assets
            sha256sum install.sh install.ps1 release-manifest.tsv release-manifest.json prodex-* release-sbom.spdx.json > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Verify pinned antivirus image
        shell: bash
        run: |
          set -euo pipefail
          docker image inspect "${CLAMAV_IMAGE%@*}" --format '{{range .RepoDigests}}{{println .}}{{end}}' \
            | grep -Fx "ghcr.io/hugoalh/scan-virus-ghaction@${CLAMAV_IMAGE##*@}"

      - name: Scan release assets for malware
        id: release_malware_scan
        uses: hugoalh/scan-virus-ghaction/clamav@99c81e8991ad1074a14e5f22a21bce9be035e14e # v0.20.1
        with:
          clamav_update: "True"
          found_summary: "True"
          statistics_summary: "True"
          ignores_pre: |-
            Param($ElementPreMeta)
            Return ($ElementPreMeta.Path -notmatch '^release-assets[\\/]')

      - name: Require clean release assets
        env:
          SCAN_OUTCOME: ${{ steps.release_malware_scan.outcome }}
          SCAN_FINISH: ${{ steps.release_malware_scan.outputs.finish }}
          SCAN_FOUND: ${{ steps.release_malware_scan.outputs.found }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${SCAN_OUTCOME}" != "success" ] || [ "${SCAN_FINISH}" != "true" ] || [ "${SCAN_FOUND}" != "false" ]; then
            echo "release asset malware scan did not finish cleanly" >&2
            exit 1
          fi
          if ! find release-assets -maxdepth 1 -type f -print -quit | grep -q .; then
            echo "release asset malware scan scope is empty" >&2
            exit 1
          fi

      - name: Validate curated release notes before publishing
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          curated_notes="docs/release-notes/${version}.md"
          test -f "${curated_notes}" || {
            echo "missing curated release notes: ${curated_notes}" >&2
            exit 1
          }
          for heading in "## New Features" "## Bug Fixes" "## Changelog"; do
            grep -Fqx "${heading}" "${curated_notes}" || {
              echo "${curated_notes} is missing mandatory heading: ${heading}" >&2
              exit 1
            }
          done

      - name: Upload validated release assets for the gated publisher
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: validated-release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 7
          compression-level: 1

  attest-binaries:
    name: Attest verified release assets
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    needs:
      - validate-release-assets
      - verify-ci
    timeout-minutes: 15
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Download validated release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: validated-release-assets
          path: release-assets

      - name: Attest binary, installer, manifest and SBOM provenance together
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: release-assets/*

  sync-release-docs:
    name: Sync release docs
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    needs:
      - validate-release-assets
      - verify-ci
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.verify-ci.outputs.version }}"
          ref_name="${GITHUB_REF_NAME}"
          ref_type="${GITHUB_REF_TYPE:-branch}"
          target_sha="${{ needs.verify-ci.outputs.target_sha }}"
          if [ "${ref_type}" != "branch" ] || [ "${ref_name}" != "main" ]; then
            echo "workflow_dispatch release runs must target main" >&2
            exit 1
          fi
          {
            echo "version=${version}"
            echo "tag=${version}"
            echo "target_sha=${target_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Sync documentation version metadata
        id: docs
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(git rev-parse origin/main)"
          release_sha="${{ steps.release.outputs.target_sha }}"
          version="${{ steps.release.outputs.version }}"
          if [ "${release_sha}" != "${main_sha}" ]; then
            echo "release commit ${release_sha} is not the current origin/main head; skipping docs sync"
            exit 0
          fi
          node scripts/npm/sync-docs-version.mjs --version "${version}"
          if git diff --quiet -- README.md QUICKSTART.md; then
            echo "docs already synced"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md QUICKSTART.md
          git commit -m "docs(release): sync version snippets for ${version}"
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Push synchronized documentation
        if: steps.docs.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 --wrap=0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" push origin HEAD:main

  publish-github-release:
    name: Publish GitHub release
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    needs:
      - validate-release-assets
      - attest-binaries
      - sync-release-docs
      - verify-ci
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.verify-ci.outputs.version }}"
          ref_name="${GITHUB_REF_NAME}"
          ref_type="${GITHUB_REF_TYPE:-branch}"
          target_sha="${{ needs.verify-ci.outputs.target_sha }}"
          if [ "${ref_type}" != "branch" ] || [ "${ref_name}" != "main" ]; then
            echo "workflow_dispatch release runs must target main" >&2
            exit 1
          fi
          {
            echo "version=${version}"
            echo "tag=${version}"
            echo "target_sha=${target_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Download validated release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: validated-release-assets
          path: release-assets

      - name: Verify unchanged release asset bytes before provenance checks
        shell: bash
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum --check SHA256SUMS

      - name: Verify release provenance
        env:
          TARGET_SHA: ${{ needs.verify-ci.outputs.target_sha }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          log_dir="${RUNNER_TEMP}/release-provenance"
          mkdir -p "${log_dir}"
          pids=()
          assets=()
          while IFS= read -r -d '' asset; do
            index="${#pids[@]}"
            assets+=("${asset}")
            gh attestation verify "${asset}" --repo "${GITHUB_REPOSITORY}" \
              --signer-workflow "${GITHUB_REPOSITORY}/.github/workflows/standalone-release.yml" \
              --source-digest "${TARGET_SHA}" --source-ref refs/heads/main \
              --deny-self-hosted-runners \
              >"${log_dir}/${index}.log" 2>&1 &
            pids+=("$!")
          done < <(find release-assets -maxdepth 1 -type f -print0)
          status=0
          for index in "${!pids[@]}"; do
            if wait "${pids[index]}"; then
              echo "Verified release provenance: ${assets[index]}"
            else
              status=1
              echo "Release provenance verification failed: ${assets[index]}" >&2
            fi
            cat "${log_dir}/${index}.log"
          done
          exit "${status}"

      - name: Wait for the absolute publication target and revalidate
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_AT: ${{ needs.verify-ci.outputs.publish_at }}
          RELEASE_SHA: ${{ steps.release.outputs.target_sha }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${PUBLISH_AT}" ]; then
            target_epoch="$(PUBLISH_AT="${PUBLISH_AT}" python - <<'PY'
          from datetime import datetime
          import os

          print(int(datetime.fromisoformat(os.environ["PUBLISH_AT"].replace("Z", "+00:00")).timestamp()))
          PY
            )"
            now_epoch="$(date -u +%s)"
            remaining="$((target_epoch - now_epoch))"
            if [ "${remaining}" -gt 18900 ]; then
              echo "publication target is more than 5h15m away; dispatch this workflow later" >&2
              exit 1
            fi
            while [ "${remaining}" -gt 0 ]; do
              delay=15
              if [ "${remaining}" -lt "${delay}" ]; then
                delay="${remaining}"
              fi
              echo "publication target ${PUBLISH_AT}: ${remaining}s remaining"
              sleep "${delay}"
              now_epoch="$(date -u +%s)"
              remaining="$((target_epoch - now_epoch))"
            done
          fi

          test "$(git rev-parse HEAD)" = "${RELEASE_SHA}"
          source_version="$(python - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as handle:
              print(tomllib.load(handle)["package"]["version"])
          PY
          )"
          test "${source_version}" = "${RELEASE_VERSION}"
          git fetch origin --tags --force
          release_status="$(gh api --include "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_VERSION}" 2>&1 | awk '/^HTTP\// { code = $2 } END { print code }')" || true
          case "${release_status}" in
            404) ;;
            200) echo "release ${RELEASE_VERSION} already exists; refusing to overwrite it" >&2; exit 1 ;;
            *) echo "could not verify whether release ${RELEASE_VERSION} exists" >&2; exit 1 ;;
          esac
          node scripts/ci/optional-tools-freshness.mjs \
            --check --json --checkpoint P --release-sha "${RELEASE_SHA}" \
            | tee "${RUNNER_TEMP}/optional-tools-freshness-P.json"
          test -s "${RUNNER_TEMP}/optional-tools-freshness-P.json"

      - name: Reverify runtime dependency latest-stable references
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/runtime-dependency-freshness.sh

      - name: Upload pre-publication freshness evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: optional-tools-freshness-publish-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/optional-tools-freshness-P.json
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        env:
          RELEASE_PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          test "${RELEASE_PUBLISH}" = true
          tag="${{ steps.release.outputs.tag }}"
          version="${{ steps.release.outputs.version }}"
          title="${version}"
          notes_file="$(mktemp)"
          curated_notes="docs/release-notes/${version}.md"
          test -f "${curated_notes}" || {
            echo "missing curated release notes: ${curated_notes}" >&2
            exit 1
          }
          for heading in "## New Features" "## Bug Fixes" "## Changelog"; do
            grep -Fqx "${heading}" "${curated_notes}" || {
              echo "${curated_notes} is missing mandatory heading: ${heading}" >&2
              exit 1
            }
          done
          cat "${curated_notes}" > "${notes_file}"
          cat >> "${notes_file}" <<EOF

          ---

          Install on Linux/macOS:

          \`\`\`sh
          curl -fsSL https://github.com/christiandoxa/prodex/releases/download/${version}/install.sh | sh -s -- --release ${version}
          \`\`\`

          Windows PowerShell:

          \`\`\`powershell
          \$env:PRODEX_RELEASE='${version}'; irm https://github.com/christiandoxa/prodex/releases/download/${version}/install.ps1 | iex
          \`\`\`

          Both installers verify downloaded assets against SHA256SUMS.
          Update future releases with \`prodex update\`.


          All published assets passed the release malware gate.
          EOF
          release_status="$(gh api --include "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" 2>&1 | awk '/^HTTP\// { code = $2 } END { print code }')" || true
          case "${release_status}" in
            404) ;;
            200) echo "release ${tag} already exists; refusing to overwrite it" >&2; exit 1 ;;
            *) echo "could not verify whether release ${tag} exists" >&2; exit 1 ;;
          esac
          gh release create "${tag}" release-assets/* \
            --target "${TARGET_SHA}" \
            --title "${title}" \
            --notes-file "${notes_file}" \
            --latest

  verify-release:
    name: Release verification verdict
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs:
      - release-preflight
      - verify-ci
      - build
      - validate-release-assets
      - antivirus-health
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require all validation jobs to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
          SOURCE_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          jq -e 'all(.[]; .result == "success")' <<<"${RESULTS}"
          {
            echo "## Release verification"
            echo "- Source: ${SOURCE_SHA}"
            echo "- Publishing requested: ${RELEASE_PUBLISH}"
            echo "- Six platform builds, exact-source CI, smoke, SBOM, checksums and malware gates passed."
            if [ "${RELEASE_PUBLISH}" != true ]; then
              echo "- Verification only: no release/tag mutation, documentation push or attestation performed."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

  publish-duration-telemetry:
    name: Publish duration telemetry
    runs-on: ubuntu-latest
    needs:
      - verify-release
      - build
      - sync-release-docs
      - publish-github-release
    if: ${{ always() }}
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Summarize publish job durations
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jobs_json="${RUNNER_TEMP}/publish-jobs.json"
          summary_path="${RUNNER_TEMP}/publish-job-durations.txt"
          json_path="${RUNNER_TEMP}/publish-job-durations.json"
          gh run view "${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --attempt "${{ github.run_attempt }}" \
            --json jobs > "${jobs_json}"
          set +e
          node scripts/ci/github-job-durations.mjs \
            --max-wall-minutes 12 \
            --max-runner-minutes 50 \
            --run-id "${{ github.run_id }}" \
            --exclude-name "Publish duration telemetry" \
            --limit 12 < "${jobs_json}" \
            | tee "${summary_path}"
          text_status="${PIPESTATUS[0]}"
          node scripts/ci/github-job-durations.mjs \
            --max-wall-minutes 12 \
            --max-runner-minutes 50 \
            --run-id "${{ github.run_id }}" \
            --exclude-name "Publish duration telemetry" \
            --limit 12 \
            --json < "${jobs_json}" > "${json_path}"
          json_status="$?"
          set -e
          {
            echo "### Publish job durations"
            echo
            echo '```text'
            cat "${summary_path}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${text_status}" -ne 0 ]; then
            exit "${text_status}"
          fi
          exit "${json_status}"

      - name: Upload publish duration telemetry
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: publish-duration-telemetry
          path: |
            ${{ runner.temp }}/publish-job-durations.txt
            ${{ runner.temp }}/publish-job-durations.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
