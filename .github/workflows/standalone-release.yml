name: standalone release

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact main commit to release
        required: true
        type: string
      version:
        description: Exact Cargo package version to release
        required: true
        type: string

concurrency:
  group: standalone-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_HTTP_MULTIPLEXING: "false"
  SCCACHE_CACHE_SIZE: 2G
  SCCACHE_GHA_ENABLED: "true"
  KIRO_CLI_VERSION: "2.20.2"
  MOJO_VERSION: "1.0.0"
  UV_VERSION: "0.11.7"

jobs:
  verify-ci:
    name: Verify CI is green
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    outputs:
      target_sha: ${{ steps.target.outputs.target_sha }}
      version: ${{ steps.target.outputs.version }}

    steps:
      - name: Check out release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release target
        id: target
        env:
          RELEASE_TARGET_SHA: ${{ inputs.target_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          ref_name="${GITHUB_REF_NAME}"
          ref_type="${GITHUB_REF_TYPE:-branch}"
          target_sha="${RELEASE_TARGET_SHA}"
          if [ "${ref_type}" != "branch" ] || [ "${ref_name}" != "main" ]; then
            echo "workflow_dispatch release runs must target main" >&2
            exit 1
          fi
          if [[ ! "${target_sha}" =~ ^[0-9a-f]{40}$ ]] || [ "${GITHUB_SHA}" != "${target_sha}" ]; then
            echo "release target must be the exact dispatched main commit" >&2
            exit 1
          fi
          version="$(python - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as handle:
              print(tomllib.load(handle)["package"]["version"])
          PY
          )"
          if [ "${version}" != "${RELEASE_VERSION}" ]; then
            echo "release version ${RELEASE_VERSION} does not match Cargo.toml ${version}" >&2
            exit 1
          fi
          git fetch origin --tags --force
          if release_tag_sha="$(git rev-list -n1 "${version}" 2>/dev/null)" \
            && [ "${release_tag_sha}" != "${target_sha}" ]; then
            echo "release tag ${version} targets ${release_tag_sha}, not ${target_sha}" >&2
            exit 1
          fi
          if ! git rev-parse --verify --quiet "refs/tags/${version}" >/dev/null; then
            latest_version="$(git tag --list '[0-9]*' --sort=-version:refname | head -n1)"
            if [ -n "${latest_version}" ] \
              && { [ "${version}" = "${latest_version}" ] \
                || [ "$(printf '%s\n%s\n' "${latest_version}" "${version}" | sort -V | tail -n1)" != "${version}" ]; }; then
              echo "release version ${version} must be newer than ${latest_version}" >&2
              exit 1
            fi
          fi
          {
            echo "target_sha=${target_sha}"
            echo "version=${version}"
          } >> "${GITHUB_OUTPUT}"

      - name: Install Node.js for release metadata checks
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Verify optional-tool freshness at release cut
        env:
          RELEASE_SHA: ${{ steps.target.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/optional-tools-freshness.mjs \
            --check --json --checkpoint B --release-sha "${RELEASE_SHA}" \
            | tee "${RUNNER_TEMP}/optional-tools-freshness-B.json"
          test -s "${RUNNER_TEMP}/optional-tools-freshness-B.json"

      - name: Upload optional-tool freshness evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: optional-tools-freshness-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/optional-tools-freshness-B.json
          if-no-files-found: error
          retention-days: 14

      - name: Wait for CI success
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 30 * 60))
          while true; do
            runs_json="$(gh run list --workflow ci.yml --event push --limit 50 --json headSha,status,conclusion,url)"
            set +e
            result="$(
              RUNS_JSON="${runs_json}" python - <<'PY'
          import json
          import os
          import sys

          target = os.environ["TARGET_SHA"]
          runs = [run for run in json.loads(os.environ["RUNS_JSON"]) if run.get("headSha") == target]
          if not runs:
              print("not-found")
              sys.exit(3)
          successful = [run for run in runs if run.get("status") == "completed" and run.get("conclusion") == "success"]
          if successful:
              run = successful[0]
              print(f"{run.get('conclusion')} {run.get('url')}")
              sys.exit(0)
          pending = [run for run in runs if run.get("status") != "completed"]
          if pending:
              run = pending[0]
              print(f"{run.get('status')}/{run.get('conclusion') or 'pending'} {run.get('url')}")
              sys.exit(2)
          run = runs[0]
          print(f"{run.get('conclusion')} {run.get('url')}")
          sys.exit(0)
          PY
            )"
            status=$?
            set -e

            if [ "${status}" -eq 0 ]; then
              conclusion="${result%% *}"
              url="${result#* }"
              if [ "${conclusion}" = "success" ]; then
                echo "CI success for ${TARGET_SHA}: ${url}"
                exit 0
              fi
              echo "CI did not pass for ${TARGET_SHA}: ${result}" >&2
              exit 1
            fi

            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "timed out waiting for CI success for ${TARGET_SHA}: ${result}" >&2
              exit 1
            fi
            echo "CI for ${TARGET_SHA}: ${result}; polling again in 30s"
            sleep 30
          done

      - name: Verify pinned Kiro CLI release
        shell: bash
        run: |
          set -euo pipefail
          manifest_version="$(curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors --retry-delay 2 -fsSL https://prod.download.cli.kiro.dev/stable/latest/manifest.json | python -c 'import json, sys; print(json.load(sys.stdin)["version"])')"
          if [ "${manifest_version}" != "${KIRO_CLI_VERSION}" ]; then
            echo "Kiro stable release ${manifest_version} does not match pinned ${KIRO_CLI_VERSION}" >&2
            exit 1
          fi

  build-mojo-archives:
    name: Build Mojo archive ${{ matrix.target }}
    needs: verify-ci
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            mojo-target-cpu: x86-64
          - target: aarch64-unknown-linux-gnu
            mojo-target-cpu: generic
          - target: x86_64-apple-darwin
            mojo-target-cpu: x86-64
          - target: aarch64-apple-darwin
            mojo-target-cpu: generic
          - target: x86_64-pc-windows-msvc
            mojo-target-cpu: x86-64
          - target: aarch64-pc-windows-msvc
            mojo-target-cpu: generic

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}

      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Install pinned Mojo compiler
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python "mojo==${MOJO_VERSION}"
          export PATH="${GITHUB_WORKSPACE}/.venv/bin:${PATH}"
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"
          mojo_version="$(mojo --version)"
          case "${mojo_version}" in
            "Mojo ${MOJO_VERSION}"*) ;;
            *) echo "unexpected Mojo version: ${mojo_version}" >&2; exit 1 ;;
          esac

      - name: Install LLVM archive tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y llvm

      - name: Build target Mojo archive
        shell: bash
        run: |
          set -euo pipefail
          export AR=llvm-ar
          if [[ '${{ matrix.target }}' == *-pc-windows-msvc ]]; then
            export AR=llvm-lib
          fi
          PRODEX_MOJO_REQUIRED=1 \
          PRODEX_MOJO_VERSION="${MOJO_VERSION}" \
          PRODEX_MOJO_TARGET="${{ matrix.target }}" \
          PRODEX_MOJO_TARGET_CPU="${{ matrix.mojo-target-cpu }}" \
          CARGO_TARGET_DIR="${GITHUB_WORKSPACE}/target/mojo-archive/${{ matrix.target }}" \
          cargo build --release --locked --target "${{ matrix.target }}" \
            -p prodex-mojo-core --features mojo-core
          archive_name=libprodex_mojo_core.a
          if [[ '${{ matrix.target }}' == *-pc-windows-msvc ]]; then
            archive_name=prodex_mojo_core.lib
          fi
          archive="$(find "target/mojo-archive/${{ matrix.target }}/${{ matrix.target }}/release/build" -type f -name "${archive_name}" -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          test -s "${archive}"
          mkdir -p "target/mojo-release/${{ matrix.target }}"
          cp "${archive}" "target/mojo-release/${{ matrix.target }}/${archive_name}"

      - name: Verify target archive
        shell: bash
        run: |
          set -euo pipefail
          archive_name=libprodex_mojo_core.a
          if [[ '${{ matrix.target }}' == *-pc-windows-msvc ]]; then
            archive_name=prodex_mojo_core.lib
          fi
          archive="target/mojo-release/${{ matrix.target }}/${archive_name}"
          llvm-nm -g "${archive}" | grep -F 'prodex_mojo_rich_abi_version'
          llvm-nm -g "${archive}" | grep -F 'prodex_mojo_log_classify_v3'
          if llvm-nm -u "${archive}" | grep -F 'KGEN_CompilerRT_'; then
            echo "target Mojo archive unexpectedly requires the Mojo compiler runtime" >&2
            exit 1
          fi

      - name: Upload target Mojo archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mojo-archive-${{ matrix.target }}
          path: target/mojo-release/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.target }}
    needs:
      - verify-ci
      - build-mojo-archives
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 120
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-latest
            artifact-name: x86_64-unknown-linux-gnu
            binary-name: prodex
            use-cross: true
            can-native-smoke: true
            can-mojo-runtime-smoke: true
            max-glibc: GLIBC_2.23
            mojo-release: true
            mojo-target-cpu: x86-64
            mojo-features: mojo-core
          - target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-latest
            artifact-name: aarch64-unknown-linux-gnu
            binary-name: prodex
            use-cross: true
            can-native-smoke: false
            can-mojo-runtime-smoke: true
            max-glibc: GLIBC_2.23
            mojo-release: true
            mojo-target-cpu: generic
            mojo-features: mojo-core
          - target: x86_64-apple-darwin
            runs-on: macos-15-intel
            artifact-name: x86_64-apple-darwin
            binary-name: prodex
            use-cross: false
            can-native-smoke: true
            can-mojo-runtime-smoke: true
            mojo-release: true
            mojo-target-cpu: x86-64
            mojo-features: mojo-core
          - target: aarch64-apple-darwin
            runs-on: macos-14
            artifact-name: aarch64-apple-darwin
            binary-name: prodex
            use-cross: false
            can-native-smoke: true
            can-mojo-runtime-smoke: true
            mojo-release: true
            mojo-target-cpu: generic
            mojo-features: mojo-core
          - target: x86_64-pc-windows-msvc
            runs-on: windows-latest
            artifact-name: x86_64-pc-windows-msvc
            binary-name: prodex.exe
            use-cross: false
            can-native-smoke: true
            can-mojo-runtime-smoke: true
            mojo-release: true
            mojo-target-cpu: x86-64
            mojo-features: mojo-core
          - target: aarch64-pc-windows-msvc
            runs-on: windows-latest
            artifact-name: aarch64-pc-windows-msvc
            binary-name: prodex.exe
            use-cross: false
            can-native-smoke: false
            can-mojo-runtime-smoke: false
            mojo-release: true
            mojo-target-cpu: generic
            mojo-features: mojo-core

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate release target policy
        shell: bash
        run: |
          set -euo pipefail
          row="$(awk -F '\t' -v target='${{ matrix.target }}' '$1 == target { print; exit }' migration/release-target-matrix.tsv)"
          test -n "${row}"
          expected_asset="$(printf '%s\n' "${row}" | awk -F '\t' '{ print $2 }')"
          expected_implementation="$(printf '%s\n' "${row}" | awk -F '\t' '{ print $3 }')"
          expected_glibc="$(printf '%s\n' "${row}" | awk -F '\t' '{ print $7 }')"
          expected_asset_name="prodex-${{ matrix.artifact-name }}"
          if [ "${{ matrix.binary-name }}" = "prodex.exe" ]; then
            expected_asset_name="${expected_asset_name}.exe"
          fi
          test "${expected_asset}" = "${expected_asset_name}"
          if [ "${{ matrix.mojo-release }}" = true ]; then
            test "${expected_implementation}" = mojo-compiled-in
          else
            test "${expected_implementation}" = rust
          fi
          if [[ '${{ matrix.target }}' == *-unknown-linux-gnu ]]; then
            test "${expected_glibc}" = '${{ matrix.max-glibc }}'
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.98.0
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.target }}

      - name: Download target Mojo archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: mojo-archive-${{ matrix.target }}
          path: target/mojo-release/${{ matrix.target }}

      - name: Install sccache
        if: ${{ matrix.use-cross == false || matrix.can-native-smoke || matrix.mojo-release }}
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install cross
        if: ${{ matrix.use-cross }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v cross >/dev/null 2>&1; then
            exit 0
          fi
          for attempt in 1 2 3; do
            if CARGO_HTTP_MULTIPLEXING=false cargo install cross --version 0.2.5 --locked; then
              exit 0
            fi
            if [ "${attempt}" = "3" ]; then
              exit 1
            fi
            sleep "$((attempt * 10))"
          done

      - name: Install Linux ARM cross and emulation tools
        if: ${{ matrix.target == 'aarch64-unknown-linux-gnu' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user

      - name: Test native desktop launcher
        if: ${{ matrix.can-native-smoke }}
        shell: bash
        run: |
          set -euo pipefail
          test_log="$(mktemp)"
          trap 'rm -f "${test_log}"' EXIT
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            export CARGO_TARGET_DIR="${GITHUB_WORKSPACE}/target/native-test/${{ matrix.target }}"
          fi
          feature_args=()
          if [ "${{ matrix.mojo-release }}" = "true" ]; then
            feature_args=(--features "${{ matrix.mojo-features }}")
            export PRODEX_MOJO_REQUIRED=1
            export PRODEX_MOJO_VERSION="${MOJO_VERSION}"
            export PRODEX_MOJO_TARGET="${{ matrix.target }}"
            export PRODEX_MOJO_TARGET_CPU="${{ matrix.mojo-target-cpu }}"
            archive_name=libprodex_mojo_core.a
            if [[ '${{ matrix.target }}' == *-pc-windows-msvc ]]; then
              archive_name=prodex_mojo_core.lib
            fi
            export PRODEX_MOJO_ARCHIVE="target/mojo-release/${{ matrix.target }}/${archive_name}"
            test -s "${PRODEX_MOJO_ARCHIVE}"
          fi
          if ! RUSTC_WRAPPER=sccache cargo test --release --locked --target "${{ matrix.target }}" -p prodex-app "${feature_args[@]}" --lib 'runtime_desktop::tests::' -- --test-threads=1 2>&1 | tee "${test_log}"; then
            exit 1
          fi
          if grep -Fq 'running 0 tests' "${test_log}"; then
            echo "native desktop launcher test matched no tests" >&2
            exit 1
          fi

      - name: Build prodex
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          build_args=(--release --target "${{ matrix.target }}")
          if [ "${{ matrix.mojo-release }}" = "true" ]; then
            export PRODEX_MOJO_REQUIRED=1
            export PRODEX_MOJO_VERSION="${MOJO_VERSION}"
            export PRODEX_MOJO_TARGET="${{ matrix.target }}"
            export PRODEX_MOJO_TARGET_CPU="${{ matrix.mojo-target-cpu }}"
            archive_name=libprodex_mojo_core.a
            if [[ '${{ matrix.target }}' == *-pc-windows-msvc ]]; then
              archive_name=prodex_mojo_core.lib
            fi
            export PRODEX_MOJO_ARCHIVE="target/mojo-release/${{ matrix.target }}/${archive_name}"
            export CROSS_CONTAINER_OPTS="${CROSS_CONTAINER_OPTS:-} --env PRODEX_MOJO_REQUIRED=1 --env PRODEX_MOJO_VERSION=${MOJO_VERSION} --env PRODEX_MOJO_TARGET=${{ matrix.target }} --env PRODEX_MOJO_TARGET_CPU=${{ matrix.mojo-target-cpu }} --env PRODEX_MOJO_ARCHIVE=${PRODEX_MOJO_ARCHIVE}"
            test -s "${PRODEX_MOJO_ARCHIVE}"
            build_args+=(--features "${{ matrix.mojo-features }}")
          fi
          for attempt in 1 2 3; do
            if [ "${{ matrix.use-cross }}" = "true" ]; then
              cross build --locked "${build_args[@]}" && exit 0
            else
              RUSTC_WRAPPER=sccache cargo build --locked "${build_args[@]}" && exit 0
            fi
            if [ "${attempt}" = "3" ]; then
              exit 1
            fi
            sleep "$((attempt * 10))"
          done

      - name: Verify compiled-in Mojo release
        if: ${{ matrix.mojo-release && matrix.can-mojo-runtime-smoke }}
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/${{ matrix.binary-name }}"
          archive_name=libprodex_mojo_core.a
          if [[ '${{ matrix.target }}' == *-pc-windows-msvc ]]; then
            archive_name=prodex_mojo_core.lib
          fi
          archive="target/mojo-release/${{ matrix.target }}/${archive_name}"
          test -s "${archive}"
          if [[ '${{ matrix.target }}' == *-pc-windows-msvc ]]; then
            echo "COFF archive symbols were verified on the Linux archive runner"
          else
            symbol_tool=(nm)
            "${symbol_tool[@]}" -g "${archive}" | grep -F 'prodex_quota_remaining_percent'
            "${symbol_tool[@]}" -g "${archive}" | grep -F 'prodex_mojo_abi_version'
            "${symbol_tool[@]}" -g "${archive}" | grep -F 'prodex_routing_plan_batch'
            "${symbol_tool[@]}" -g "${archive}" | grep -F 'prodex_capability_match_batch'
            "${symbol_tool[@]}" -g "${archive}" | grep -F 'prodex_mojo_text_abi_version'
            "${symbol_tool[@]}" -g "${archive}" | grep -F 'prodex_context_prepare_signal_rows_v1'
            "${symbol_tool[@]}" -g "${archive}" | grep -F 'prodex_mojo_rich_abi_version'
            "${symbol_tool[@]}" -g "${archive}" | grep -F 'prodex_mojo_rich_context_analyze_v2'
            "${symbol_tool[@]}" -g "${archive}" | grep -F 'prodex_mojo_rich_route_plan_v2'
            "${symbol_tool[@]}" -g "${archive}" | grep -F 'prodex_mojo_rich_policy_alias_v2'
            "${symbol_tool[@]}" -g "${archive}" | grep -F 'prodex_mojo_rich_model_fallback_v2'
            "${symbol_tool[@]}" -g "${archive}" | grep -F 'prodex_mojo_rich_context_plan_v2'
            "${symbol_tool[@]}" -g "${archive}" | grep -F 'prodex_mojo_log_classify_v3'
            "${symbol_tool[@]}" -g "${archive}" | grep -F 'prodex_mojo_rich_catalog_resolve_v1'
            "${symbol_tool[@]}" -g "${archive}" | grep -F 'prodex_mojo_rich_catalog_choices_v1'
            "${symbol_tool[@]}" -g "${archive}" | grep -F 'prodex_mojo_rich_catalog_merge_v1'
            "${symbol_tool[@]}" -g "${archive}" | grep -F 'prodex_runtime_quota_score_batch'
            "${symbol_tool[@]}" -g "${archive}" | grep -F 'prodex_runtime_quota_route_score_resolution_batch'
            "${symbol_tool[@]}" -g "${archive}" | grep -F 'prodex_smart_context_token_usage_summary_batch'
            if "${symbol_tool[@]}" -u "${archive}" | grep -F 'KGEN_CompilerRT_'; then
              echo "rich Mojo core unexpectedly requires the Mojo compiler runtime" >&2
              exit 1
            fi
          fi
          case '${{ matrix.target }}' in
            *-unknown-linux-gnu)
              if readelf --dynamic "${binary}" | grep -Eiq 'lib(mojo|modular)|RPATH|RUNPATH'; then
                echo "Mojo release binary has an unexpected dynamic Mojo dependency or build path" >&2
                readelf --dynamic "${binary}" >&2
                exit 1
              fi
              ;;
            *-apple-darwin)
              if otool -L "${binary}" | grep -Eiq 'mojo|modular'; then
                echo "Mojo release binary has an unexpected dynamic Mojo dependency" >&2
                otool -L "${binary}" >&2
                exit 1
              fi
              ;;
            *-pc-windows-msvc)
              if dumpbin.exe /DEPENDENTS "${binary}" 2>/dev/null | grep -Eiq 'mojo|modular'; then
                echo "Mojo release binary has an unexpected dynamic Mojo dependency" >&2
                dumpbin.exe /DEPENDENTS "${binary}" >&2
                exit 1
              fi
              ;;
          esac
          binary_command=("${binary}")
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            binary_command=(qemu-aarch64 -L /usr/aarch64-linux-gnu "${binary}")
          fi
          diagnostics="$(PRODEX_HOME="${RUNNER_TEMP}/prodex-mojo-release-home" "${binary_command[@]}" doctor --runtime --json)"
          printf '%s\n' "${diagnostics}" | grep -F '"implementation": "mojo-compiled-in"'
          printf '%s\n' "${diagnostics}" | grep -F '"fallback": false'
          printf '%s\n' "${diagnostics}" | grep -F '"compiler_required": false'
          printf '%s\n' "${diagnostics}" | grep -F '"build_strict": true'
          printf '%s\n' "${diagnostics}" | grep -F '"self_test": "passed"'
          printf '%s\n' "${diagnostics}" | grep -F '"context_text": true'
          printf '%s\n' "${diagnostics}" | grep -F '"rich_abi_version": 6'
          printf '%s\n' "${diagnostics}" | grep -F '"runtime_dependency_mode": "arena-static"'
          printf '%s\n' "${diagnostics}" | grep -F '"rich_domain": true'
          printf '%s\n' "${diagnostics}" | grep -F '"rich_context_parser": true'
          printf '%s\n' "${diagnostics}" | grep -F '"rich_provider_routing": true'
          printf '%s\n' "${diagnostics}" | grep -F '"log_semantics": true'
          clean_root="$(mktemp -d)"
          trap 'rm -rf "${clean_root}"' EXIT
          if [[ '${{ matrix.target }}' == *-pc-windows-msvc ]]; then
            PATH="${PATH}" HOME="${clean_root}/home" PRODEX_HOME="${clean_root}/prodex-home" \
              "${binary_command[@]}" doctor --runtime --json > "${clean_root}/diagnostics.json"
          else
            if PATH="/usr/bin:/bin" command -v mojo >/dev/null 2>&1; then
              echo "clean-machine smoke unexpectedly found Mojo" >&2
              exit 1
            fi
            env -i PATH="/usr/bin:/bin" HOME="${clean_root}/home" PRODEX_HOME="${clean_root}/prodex-home" \
              "${binary_command[@]}" doctor --runtime --json > "${clean_root}/diagnostics.json"
          fi
          grep -F '"implementation": "mojo-compiled-in"' "${clean_root}/diagnostics.json"
          grep -F '"compiler_required": false' "${clean_root}/diagnostics.json"
          grep -F '"self_test": "passed"' "${clean_root}/diagnostics.json"

      - name: Verify non-native Mojo release artifact
        if: ${{ matrix.mojo-release && !matrix.can-mojo-runtime-smoke }}
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/${{ matrix.binary-name }}"
          test -s "${binary}"
          echo "${{ matrix.target }} is compile/link verified; runtime smoke requires a native runner"

      - name: Verify Linux GLIBC baseline
        if: ${{ contains(matrix.target, 'unknown-linux-gnu') }}
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/${{ matrix.binary-name }}"
          versions="$(readelf --version-info "${binary}" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu || true)"
          if [ -z "${versions}" ]; then
            echo "failed to detect GLIBC symbol versions for ${binary}" >&2
            exit 1
          fi
          max_required="$(printf '%s\n' "${versions}" | tail -n1)"
          echo "detected GLIBC requirements for ${binary}:"
          printf '%s\n' "${versions}"
          if [ "$(printf '%s\n%s\n' "${max_required}" "${{ matrix.max-glibc }}" | sort -V | tail -n1)" != "${{ matrix.max-glibc }}" ]; then
            echo "binary requires ${max_required}, which exceeds allowed baseline ${{ matrix.max-glibc }}" >&2
            exit 1
          fi

      - name: Native smoke test
        if: ${{ matrix.can-native-smoke }}
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/${{ matrix.binary-name }}"
          "${binary}" --version

      - name: Prepare binary artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/${{ matrix.artifact-name }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary-name }}" "dist/${{ matrix.artifact-name }}/${{ matrix.binary-name }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/${{ matrix.artifact-name }}/${{ matrix.binary-name }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Install Node.js for native client probe
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install pinned native clients
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        shell: bash
        run: |
          set -euo pipefail
          unset GITHUB_TOKEN GH_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          mkdir -p "${HOME}/.local/bin"
          npm install --global --ignore-scripts @google/gemini-cli@0.53.0
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors --retry-delay 2 -fsSLo "${RUNNER_TEMP}/kiro-install.sh" https://cli.kiro.dev/install
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors --retry-delay 2 -fsSLo "${RUNNER_TEMP}/copilot-install.sh" https://gh.io/copilot-install
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors --retry-delay 2 -fsSLo "${RUNNER_TEMP}/claude-install.sh" https://claude.ai/install.sh
          echo "91a21bfa05cd7b58601cb83e0f1f187a9d0084726e5b824d4a4cf60306250908  ${RUNNER_TEMP}/kiro-install.sh" | sha256sum --check --strict
          echo "cd45508981a9baee5fb8f5e38495d315758cd7fea4a715b53a9f26c12544dc95  ${RUNNER_TEMP}/copilot-install.sh" | sha256sum --check --strict
          echo "3a68d3406cf674e17bed1733a4dcf37805e2e47d87417700007d7e1aa766a944  ${RUNNER_TEMP}/claude-install.sh" | sha256sum --check --strict
          bash "${RUNNER_TEMP}/kiro-install.sh" --force --channel stable
          VERSION=v1.0.77 PREFIX="${HOME}/.local" bash "${RUNNER_TEMP}/copilot-install.sh"
          bash "${RUNNER_TEMP}/claude-install.sh" 2.1.220
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Verify client discovery and direct-native guards
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          for command in gemini kiro-cli-chat copilot claude; do
            command -v "${command}"
            "${command}" --version
          done
          kiro_version="$(kiro-cli --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)"
          test "${kiro_version}" = "${KIRO_CLI_VERSION}"
          gemini --help > "${RUNNER_TEMP}/gemini-help.txt"
          grep -q -- "--yolo" "${RUNNER_TEMP}/gemini-help.txt"
          kiro-cli-chat chat --help > "${RUNNER_TEMP}/kiro-help.txt"
          grep -q -- "--model" "${RUNNER_TEMP}/kiro-help.txt"
          grep -a -q -- "KIRO_DATA_DIR" "$(command -v kiro-cli-chat)"
          copilot help environment > "${RUNNER_TEMP}/copilot-environment.txt"
          for variable in COPILOT_PROVIDER_BASE_URL COPILOT_PROVIDER_TYPE COPILOT_PROVIDER_API_KEY COPILOT_PROVIDER_WIRE_API COPILOT_PROVIDER_TRANSPORT COPILOT_MODEL; do
            grep -q -- "${variable}" "${RUNNER_TEMP}/copilot-environment.txt"
          done
          for variable in ANTHROPIC_BASE_URL ANTHROPIC_AUTH_TOKEN ANTHROPIC_MODEL; do
            grep -a -q -- "${variable}" "$(command -v claude)"
          done
          prodex_binary="target/${{ matrix.target }}/release/${{ matrix.binary-name }}"
          chmod 0755 "${prodex_binary}"
          PRODEX_HOME="${RUNNER_TEMP}/prodex-capability" "${prodex_binary}" capability list --json > "${RUNNER_TEMP}/capabilities.json"
          CAPABILITIES="${RUNNER_TEMP}/capabilities.json" python - <<'PY'
          import json
          import os

          with open(os.environ["CAPABILITIES"], encoding="utf-8") as handle:
              rows = {row["name"]: row for row in json.load(handle)}
          for name in ("gemini", "kiro", "copilot", "claude"):
              assert rows[name]["status"] == "available", rows[name]
          PY
          copilot --model gpt-5.6-luna --effort max --help > "${RUNNER_TEMP}/copilot-luna-help.txt"
          grep -q -- "GitHub Copilot CLI" "${RUNNER_TEMP}/copilot-luna-help.txt"
          smoke_root="${RUNNER_TEMP}/prodex-sub-agent-smoke"
          stub="${smoke_root}/stub-child"
          mkdir -p "${smoke_root}"
          cat > "${stub}" <<'SH'
          #!/bin/sh
          set -eu
          printf '%s\n' "$@" > "${PRODEX_STUB_ARGS}"
          printf '%s\n' "${PRODEX_SUB_AGENT:-}" > "${PRODEX_STUB_MARKER}"
          printf '%s\n' "stub child output"
          SH
          chmod 0755 "${stub}"
          for provider in kiro copilot; do
            provider_root="${smoke_root}/${provider}"
            mkdir -p "${provider_root}/tasks" "${provider_root}/slots"
            : > "${provider_root}/slots/slot-00.lock"
            printf '%s\n' "credential-free launcher smoke" > "${provider_root}/tasks/task.txt"
            SMOKE_PROVIDER_ROOT="${provider_root}" SMOKE_STUB="${stub}" SMOKE_PROVIDER="${provider}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["SMOKE_PROVIDER_ROOT"])
          spec = {
              "executable": os.environ["SMOKE_STUB"],
              "provider": os.environ["SMOKE_PROVIDER"],
              "model": "gpt-5.6-luna",
              "effort": "max",
              "local-url": None,
              "presidio-enabled": False,
              "max-concurrency": {"value": 1, "source": "custom"},
              "slot-dir": str(root / "slots"),
              "task-dir": str(root / "tasks"),
              "task-max-bytes": 65536,
              "recursion-marker": "PRODEX_SUB_AGENT",
          }
          (root / "config.json").write_text(json.dumps(spec), encoding="utf-8")
          PY
            PRODEX_STUB_ARGS="${provider_root}/args.txt" PRODEX_STUB_MARKER="${provider_root}/marker.txt" PRODEX_HOME="${provider_root}/home" "${prodex_binary}" __sub-agent-exec --config "${provider_root}/config.json" --task-file "${provider_root}/tasks/task.txt"
            test ! -e "${provider_root}/tasks/task.txt"
            grep -Fxq -- "s" "${provider_root}/args.txt"
            grep -Fxq -- "--no-sub-agent" "${provider_root}/args.txt"
            grep -Fxq -- "${provider}" "${provider_root}/args.txt"
            grep -Fxq -- "gpt-5.6-luna" "${provider_root}/args.txt"
            grep -Fxq -- "model_reasoning_effort=max" "${provider_root}/args.txt"
            grep -Fxq -- "1" "${provider_root}/marker.txt"
          done
          PRODEX_HOME="${RUNNER_TEMP}/prodex-agy" PRODEX_AGY_BIN=/bin/true "${prodex_binary}" s gemini --cli agy --no-presidio
          if PRODEX_HOME="${RUNNER_TEMP}/prodex-agy" PRODEX_AGY_BIN=/bin/true "${prodex_binary}" s gemini --cli agy --presidio 2> "${RUNNER_TEMP}/presidio-error.txt"; then
            echo "native Antigravity unexpectedly accepted --presidio" >&2
            exit 1
          fi
          grep -q -- "--presidio is unsupported" "${RUNNER_TEMP}/presidio-error.txt"

  artifact-smoke:
    name: Smoke official Linux artifact
    needs:
      - verify-ci
      - build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Node.js for artifact smoke
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Download official Linux artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: x86_64-unknown-linux-gnu
          path: artifact

      - name: Run official artifact smoke
        env:
          RELEASE_VERSION: ${{ needs.verify-ci.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          binary="artifact/prodex"
          test -f "${binary}"
          chmod 0755 "${binary}"
          node scripts/ci/release-artifact-smoke.mjs \
            --binary "${binary}" \
            --version "${RELEASE_VERSION}"

  attest-binaries:
    name: Attest binaries
    runs-on: ubuntu-latest
    needs:
      - build
      - verify-ci
    timeout-minutes: 15
    permissions:
      actions: read
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Attest binary artifact provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            artifacts/x86_64-unknown-linux-gnu/prodex
            artifacts/aarch64-unknown-linux-gnu/prodex
            artifacts/x86_64-apple-darwin/prodex
            artifacts/aarch64-apple-darwin/prodex
            artifacts/x86_64-pc-windows-msvc/prodex.exe
            artifacts/aarch64-pc-windows-msvc/prodex.exe

  publish-container:
    name: Publish container and deployment manifest
    runs-on: ubuntu-latest
    needs:
      - verify-ci
      - build
    timeout-minutes: 45
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Check out release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.verify-ci.outputs.version }}"
          if [ "${GITHUB_REPOSITORY,,}" != "christiandoxa/prodex" ]; then
            echo "container publication is restricted to christiandoxa/prodex" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE:-branch}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${version}" ]; then
            echo "release ref ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: echo "${GH_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Build, scan, and push container
        id: image
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --pull \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --tag "${image}:${VERSION}" \
            .

          trivy_image="docker.io/aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f"
          mkdir -p dist "${RUNNER_TEMP}/trivy-cache" "${RUNNER_TEMP}/trivy-input"
          docker save "${image}:${VERSION}" --output "${RUNNER_TEMP}/trivy-input/image.tar"
          docker run --rm \
            -v "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
            -v "${RUNNER_TEMP}/trivy-input:/input:ro" \
            -v "${PWD}/dist:/output" \
            "${trivy_image}" \
            image --input /input/image.tar --scanners vuln --ignore-unfixed \
            --severity HIGH,CRITICAL --exit-code 1 --format json \
            --output "/output/prodex-container-vulnerability-${VERSION}.json"
          rm -f "${RUNNER_TEMP}/trivy-input/image.tar"

          docker push "${image}:${VERSION}"
          repository_digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${image}:${VERSION}")"
          digest="${repository_digest#*@}"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "registry returned an invalid image digest" >&2
            exit 1
          fi
          {
            echo "name=${image}"
            echo "digest=${digest}"
          } >> "${GITHUB_OUTPUT}"

      - name: Attest container provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Render immutable Kubernetes manifest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          digest_hex="${IMAGE_DIGEST#sha256:}"
          output="dist/prodex-gateway-${VERSION}.yaml"
          sed "s/PRODEX_IMAGE_DIGEST/${digest_hex}/g" deploy/kubernetes/prodex-gateway.yaml > "${output}"
          if grep -q 'PRODEX_IMAGE_DIGEST' "${output}"; then
            echo "rendered Kubernetes manifest still contains an image placeholder" >&2
            exit 1
          fi
          if [ "$(grep -c "@${IMAGE_DIGEST}" "${output}")" -ne "$(grep -c '@sha256:PRODEX_IMAGE_DIGEST' deploy/kubernetes/prodex-gateway.yaml)" ]; then
            echo "rendered Kubernetes manifest does not pin all Prodex workloads" >&2
            exit 1
          fi

      - name: Attest deployment artifacts provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/prodex-gateway-${{ steps.release.outputs.version }}.yaml
            dist/prodex-container-vulnerability-${{ steps.release.outputs.version }}.json

      - name: Upload Kubernetes manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kubernetes-manifest
          path: |
            dist/prodex-gateway-${{ steps.release.outputs.version }}.yaml
            dist/prodex-container-vulnerability-${{ steps.release.outputs.version }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  prepare-release:
    name: Prepare release SBOM
    runs-on: ubuntu-latest
    needs:
      - attest-binaries
      - verify-ci
      - build
      - artifact-smoke
    timeout-minutes: 30
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download built binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Generate release SBOM
        shell: bash
        run: |
          set -euo pipefail
          syft_image="anchore/syft:v1.41.2@sha256:962c5626d30cdfb814802598cbb7b63cb690bf979a4bc0ff1d9c6e0cb441db7f"
          for attempt in 1 2 3; do
            if docker pull "$syft_image"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
          docker run --rm \
            -v "${PWD}/artifacts:/source:ro" \
            "$syft_image" \
            dir:/source -o spdx-json > release-sbom.spdx.json

      - name: Attest release SBOM provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: release-sbom.spdx.json

      - name: Upload release SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-sbom
          path: release-sbom.spdx.json
          if-no-files-found: error
          overwrite: true

  sync-release-docs:
    name: Sync release docs
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - verify-ci
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.verify-ci.outputs.version }}"
          ref_name="${GITHUB_REF_NAME}"
          ref_type="${GITHUB_REF_TYPE:-branch}"
          target_sha="${{ needs.verify-ci.outputs.target_sha }}"
          if [ "${ref_type}" != "branch" ] || [ "${ref_name}" != "main" ]; then
            echo "workflow_dispatch release runs must target main" >&2
            exit 1
          fi
          {
            echo "version=${version}"
            echo "tag=${version}"
            echo "target_sha=${target_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Sync documentation version metadata
        id: docs
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(git rev-parse origin/main)"
          release_sha="${{ steps.release.outputs.target_sha }}"
          version="${{ steps.release.outputs.version }}"
          if [ "${release_sha}" != "${main_sha}" ]; then
            echo "release commit ${release_sha} is not the current origin/main head; skipping docs sync"
            exit 0
          fi
          node scripts/npm/sync-docs-version.mjs --version "${version}"
          if git diff --quiet -- README.md QUICKSTART.md; then
            echo "docs already synced"
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md QUICKSTART.md
          git commit -m "docs(release): sync version snippets for ${version}"
          echo "changed=true" >> "${GITHUB_OUTPUT}"

      - name: Push synchronized documentation
        if: steps.docs.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 --wrap=0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" push origin HEAD:main

  publish-github-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - publish-container
      - sync-release-docs
      - verify-ci
    timeout-minutes: 60
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="${{ needs.verify-ci.outputs.version }}"
          ref_name="${GITHUB_REF_NAME}"
          ref_type="${GITHUB_REF_TYPE:-branch}"
          target_sha="${{ needs.verify-ci.outputs.target_sha }}"
          if [ "${ref_type}" != "branch" ] || [ "${ref_name}" != "main" ]; then
            echo "workflow_dispatch release runs must target main" >&2
            exit 1
          fi
          {
            echo "version=${version}"
            echo "tag=${version}"
            echo "target_sha=${target_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Download built binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Download release SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-sbom
          path: artifacts/release-sbom

      - name: Download Kubernetes manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kubernetes-manifest
          path: artifacts/kubernetes-manifest

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          while IFS= read -r -d '' file; do
            parent="$(basename "$(dirname "${file}")")"
            base="$(basename "${file}")"
            ext=""
            stem="${base}"
            if [[ "${base}" == *.* ]]; then
              ext=".${base##*.}"
              stem="${base%.*}"
            fi
            cp "${file}" "release-assets/${stem}-${parent}${ext}"
          done < <(find artifacts -mindepth 2 -maxdepth 2 -type f \( -name 'prodex' -o -name 'prodex.exe' \) -print0)
          cp artifacts/release-sbom/release-sbom.spdx.json release-assets/release-sbom.spdx.json
          cp artifacts/kubernetes-manifest/prodex-* release-assets/
          cp install.sh release-assets/install.sh
          cp install.ps1 release-assets/install.ps1
          chmod 0755 release-assets/install.sh

      - name: Generate release capability manifests
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          RELEASE_SHA: ${{ steps.release.outputs.target_sha }}
        run: |
          set -euo pipefail
          node scripts/release/render-release-manifest.mjs \
            --version "${RELEASE_VERSION}" \
            --commit "${RELEASE_SHA}" \
            --input migration/release-target-matrix.tsv \
            --output-tsv release-assets/release-manifest.tsv \
            --output-json release-assets/release-manifest.json
          awk -F '\t' -v sha="${RELEASE_SHA}" '$1 == "commit" && $2 == sha { found = 1 } END { exit found ? 0 : 1 }' release-assets/release-manifest.tsv
          RELEASE_SHA="${RELEASE_SHA}" RELEASE_VERSION="${RELEASE_VERSION}" node -e 'const m=require("./release-assets/release-manifest.json"); if(m.commit!==process.env.RELEASE_SHA || m.version!==process.env.RELEASE_VERSION) process.exit(1)'

      - name: Generate and verify release checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release-assets
            sha256sum install.sh install.ps1 release-manifest.tsv release-manifest.json prodex-* release-sbom.spdx.json > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Attest release checksum manifest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: release-assets/SHA256SUMS

      - name: Prepare antivirus engine health check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scan-health
          printf '%s' 'X5O!P%@AP[4\PZX54(P^)7CC)7}$' 'EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' > scan-health/eicar.com

      - name: Verify antivirus engine detects EICAR
        id: antivirus_health
        continue-on-error: true
        uses: hugoalh/scan-virus-ghaction/clamav@99c81e8991ad1074a14e5f22a21bce9be035e14e # v0.20.1
        with:
          clamav_update: "True"
          ignores_pre: |-
            Param($ElementPreMeta)
            Return ($ElementPreMeta.Path -notmatch '^scan-health[\\/]')

      - name: Require a working antivirus engine
        if: ${{ always() }}
        env:
          SCAN_OUTCOME: ${{ steps.antivirus_health.outcome }}
          SCAN_FINISH: ${{ steps.antivirus_health.outputs.finish }}
          SCAN_FOUND: ${{ steps.antivirus_health.outputs.found }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f scan-health/eicar.com
          rmdir scan-health
          if [ "${SCAN_OUTCOME}" != "failure" ] || [ "${SCAN_FINISH}" != "true" ] || [ "${SCAN_FOUND}" != "true" ]; then
            echo "antivirus engine health check did not detect EICAR" >&2
            exit 1
          fi

      - name: Scan release assets for malware
        id: release_malware_scan
        uses: hugoalh/scan-virus-ghaction/clamav@99c81e8991ad1074a14e5f22a21bce9be035e14e # v0.20.1
        with:
          clamav_update: "True"
          found_summary: "True"
          statistics_summary: "True"
          ignores_pre: |-
            Param($ElementPreMeta)
            Return ($ElementPreMeta.Path -notmatch '^release-assets[\\/]')

      - name: Require clean release assets
        env:
          SCAN_OUTCOME: ${{ steps.release_malware_scan.outcome }}
          SCAN_FINISH: ${{ steps.release_malware_scan.outputs.finish }}
          SCAN_FOUND: ${{ steps.release_malware_scan.outputs.found }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${SCAN_OUTCOME}" != "success" ] || [ "${SCAN_FINISH}" != "true" ] || [ "${SCAN_FOUND}" != "false" ]; then
            echo "release asset malware scan did not finish cleanly" >&2
            exit 1
          fi
          if ! find release-assets -maxdepth 1 -type f -print -quit | grep -q .; then
            echo "release asset malware scan scope is empty" >&2
            exit 1
          fi

      - name: Attest installer provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            release-assets/install.sh
            release-assets/install.ps1
            release-assets/release-manifest.tsv
            release-assets/release-manifest.json

      - name: Verify release provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          log_dir="${RUNNER_TEMP}/release-provenance"
          mkdir -p "${log_dir}"
          pids=()
          assets=()
          while IFS= read -r -d '' asset; do
            index="${#pids[@]}"
            assets+=("${asset}")
            gh attestation verify "${asset}" --repo "${GITHUB_REPOSITORY}" \
              >"${log_dir}/${index}.log" 2>&1 &
            pids+=("$!")
          done < <(find release-assets -maxdepth 1 -type f -print0)
          status=0
          for index in "${!pids[@]}"; do
            if wait "${pids[index]}"; then
              echo "Verified release provenance: ${assets[index]}"
            else
              status=1
              echo "Release provenance verification failed: ${assets[index]}" >&2
            fi
            cat "${log_dir}/${index}.log"
          done
          exit "${status}"

      - name: Validate curated release notes before tagging
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          curated_notes="docs/release-notes/${version}.md"
          test -f "${curated_notes}" || {
            echo "missing curated release notes: ${curated_notes}" >&2
            exit 1
          }
          for heading in "## New Features" "## Bug Fixes" "## Changelog"; do
            grep -Fqx "${heading}" "${curated_notes}" || {
              echo "${curated_notes} is missing mandatory heading: ${heading}" >&2
              exit 1
            }
          done

      - name: Create release tag
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.release.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.release.outputs.version }}"
          git fetch origin --tags --force
          if release_tag_sha="$(git rev-list -n1 "${version}" 2>/dev/null)"; then
            if [ "${release_tag_sha}" != "${TARGET_SHA}" ]; then
              echo "release tag ${version} targets ${release_tag_sha}, not ${TARGET_SHA}" >&2
              exit 1
            fi
            echo "release tag ${version} already targets ${TARGET_SHA}"
            exit 0
          fi
          git tag "${version}" "${TARGET_SHA}"
          auth="$(printf 'x-access-token:%s' "${GH_TOKEN}" | base64 --wrap=0)"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic ${auth}" push origin "refs/tags/${version}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          version="${{ steps.release.outputs.version }}"
          title="${version}"
          notes_file="$(mktemp)"
          curated_notes="docs/release-notes/${version}.md"
          test -f "${curated_notes}" || {
            echo "missing curated release notes: ${curated_notes}" >&2
            exit 1
          }
          for heading in "## New Features" "## Bug Fixes" "## Changelog"; do
            grep -Fqx "${heading}" "${curated_notes}" || {
              echo "${curated_notes} is missing mandatory heading: ${heading}" >&2
              exit 1
            }
          done
          cat "${curated_notes}" > "${notes_file}"
          cat >> "${notes_file}" <<EOF

          ---

          Install on Linux/macOS:

          \`\`\`sh
          curl -fsSL https://github.com/christiandoxa/prodex/releases/download/${version}/install.sh | sh -s -- --release ${version}
          \`\`\`

          Windows PowerShell:

          \`\`\`powershell
          \$env:PRODEX_RELEASE='${version}'; irm https://github.com/christiandoxa/prodex/releases/download/${version}/install.ps1 | iex
          \`\`\`

          Both installers verify downloaded assets against SHA256SUMS.
          Update future releases with \`prodex update\`.

          Container: \`ghcr.io/christiandoxa/prodex:${version}\`
          Kubernetes: \`prodex-gateway-${version}.yaml\` (pinned to the attested container digest).

          All published assets passed the release malware gate.
          EOF
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release edit "${tag}" \
              --title "${title}" \
              --notes-file "${notes_file}"
            gh release upload "${tag}" release-assets/* --clobber
          else
            gh release create "${tag}" release-assets/* \
              --title "${title}" \
              --notes-file "${notes_file}" \
              --latest
          fi

  publish-duration-telemetry:
    name: Publish duration telemetry
    runs-on: ubuntu-latest
    needs:
      - build
      - prepare-release
      - sync-release-docs
      - publish-github-release
    if: ${{ always() }}
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Summarize publish job durations
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jobs_json="${RUNNER_TEMP}/publish-jobs.json"
          summary_path="${RUNNER_TEMP}/publish-job-durations.txt"
          json_path="${RUNNER_TEMP}/publish-job-durations.json"
          gh run view "${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --attempt "${{ github.run_attempt }}" \
            --json jobs > "${jobs_json}"
          set +e
          node scripts/ci/github-job-durations.mjs \
            --max-wall-minutes 12 \
            --max-runner-minutes 50 \
            --run-id "${{ github.run_id }}" \
            --exclude-name "Publish duration telemetry" \
            --limit 12 < "${jobs_json}" \
            | tee "${summary_path}"
          text_status="${PIPESTATUS[0]}"
          node scripts/ci/github-job-durations.mjs \
            --max-wall-minutes 12 \
            --max-runner-minutes 50 \
            --run-id "${{ github.run_id }}" \
            --exclude-name "Publish duration telemetry" \
            --limit 12 \
            --json < "${jobs_json}" > "${json_path}"
          json_status="$?"
          set -e
          {
            echo "### Publish job durations"
            echo
            echo '```text'
            cat "${summary_path}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${text_status}" -ne 0 ]; then
            exit "${text_status}"
          fi
          exit "${json_status}"

      - name: Upload publish duration telemetry
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publish-duration-telemetry
          path: |
            ${{ runner.temp }}/publish-job-durations.txt
            ${{ runner.temp }}/publish-job-durations.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
