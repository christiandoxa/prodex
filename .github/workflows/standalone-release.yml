name: standalone release

on:
  workflow_dispatch:
  push:
    tags:
      - "0.*.*"

permissions:
  actions: read
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

env:
  CARGO_INCREMENTAL: "0"
  CARGO_HTTP_MULTIPLEXING: "false"
  SCCACHE_CACHE_SIZE: 2G
  SCCACHE_GHA_ENABLED: "true"
  KIRO_CLI_VERSION: "2.16.2"

jobs:
  verify-ci:
    name: Verify CI is green
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve release target
        id: target
        shell: bash
        run: |
          set -euo pipefail
          ref_name="${GITHUB_REF_NAME}"
          ref_type="${GITHUB_REF_TYPE:-branch}"
          target_sha="${GITHUB_SHA}"
          if [ "${ref_type}" = "tag" ]; then
            git fetch origin "refs/tags/${ref_name}:refs/tags/${ref_name}"
            target_sha="$(git rev-list -n1 "${ref_name}")"
          elif [ "${ref_name}" != "main" ]; then
            echo "workflow_dispatch release runs must target main or a matching version tag" >&2
            exit 1
          else
            version="$(python - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as handle:
              print(tomllib.load(handle)["package"]["version"])
          PY
            )"
            git fetch origin --tags --force
            if release_tag_sha="$(git rev-list -n1 "${version}" 2>/dev/null)" \
              && [ "${release_tag_sha}" != "${target_sha}" ]; then
              echo "release tag ${version} targets ${release_tag_sha}, not ${target_sha}" >&2
              exit 1
            fi
          fi
          echo "target_sha=${target_sha}" >> "${GITHUB_OUTPUT}"

      - name: Wait for CI success
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 30 * 60))
          while true; do
            runs_json="$(gh run list --workflow ci.yml --limit 50 --json headSha,status,conclusion,url)"
            set +e
            result="$(
              RUNS_JSON="${runs_json}" python - <<'PY'
          import json
          import os
          import sys

          target = os.environ["TARGET_SHA"]
          runs = [run for run in json.loads(os.environ["RUNS_JSON"]) if run.get("headSha") == target]
          if not runs:
              print("not-found")
              sys.exit(3)
          for run in runs:
              if run.get("status") == "completed":
                  print(f"{run.get('conclusion')} {run.get('url')}")
                  sys.exit(0)
          run = runs[0]
          print(f"{run.get('status')}/{run.get('conclusion') or 'pending'} {run.get('url')}")
          sys.exit(2)
          PY
            )"
            status=$?
            set -e

            if [ "${status}" -eq 0 ]; then
              conclusion="${result%% *}"
              url="${result#* }"
              if [ "${conclusion}" = "success" ]; then
                echo "CI success for ${TARGET_SHA}: ${url}"
                exit 0
              fi
              echo "CI did not pass for ${TARGET_SHA}: ${result}" >&2
              exit 1
            fi

            if [ "${SECONDS}" -ge "${deadline}" ]; then
              echo "timed out waiting for CI success for ${TARGET_SHA}: ${result}" >&2
              exit 1
            fi
            echo "CI for ${TARGET_SHA}: ${result}; polling again in 30s"
            sleep 30
          done

  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runs-on }}
    needs:
      - verify-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runs-on: ubuntu-latest
            artifact-name: x86_64-unknown-linux-gnu
            binary-name: prodex
            use-cross: true
            can-native-smoke: true
            max-glibc: GLIBC_2.23
          - target: aarch64-unknown-linux-gnu
            runs-on: ubuntu-latest
            artifact-name: aarch64-unknown-linux-gnu
            binary-name: prodex
            use-cross: true
            can-native-smoke: false
            max-glibc: GLIBC_2.23
          - target: x86_64-apple-darwin
            runs-on: macos-15-intel
            artifact-name: x86_64-apple-darwin
            binary-name: prodex
            use-cross: false
            can-native-smoke: true
          - target: aarch64-apple-darwin
            runs-on: macos-14
            artifact-name: aarch64-apple-darwin
            binary-name: prodex
            use-cross: false
            can-native-smoke: true
          - target: x86_64-pc-windows-msvc
            runs-on: windows-latest
            artifact-name: x86_64-pc-windows-msvc
            binary-name: prodex.exe
            use-cross: false
            can-native-smoke: true
          - target: aarch64-pc-windows-msvc
            runs-on: windows-latest
            artifact-name: aarch64-pc-windows-msvc
            binary-name: prodex.exe
            use-cross: false
            can-native-smoke: false

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.1
          targets: ${{ matrix.target }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.target }}

      - name: Install sccache
        if: ${{ matrix.use-cross == false }}
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install cross
        if: ${{ matrix.use-cross }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v cross >/dev/null 2>&1; then
            exit 0
          fi
          for attempt in 1 2 3; do
            if CARGO_HTTP_MULTIPLEXING=false cargo install cross --version 0.2.5 --locked; then
              exit 0
            fi
            if [ "${attempt}" = "3" ]; then
              exit 1
            fi
            sleep "$((attempt * 10))"
          done

      - name: Install Linux ARM cross compiler
        if: ${{ matrix.target == 'aarch64-unknown-linux-gnu' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Test native desktop launcher
        if: ${{ matrix.can-native-smoke }}
        shell: bash
        run: cargo test --locked --target "${{ matrix.target }}" -p prodex-app --all-features --lib 'runtime_desktop::tests::' -- --test-threads=1

      - name: Build prodex
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          for attempt in 1 2 3; do
            if [ "${{ matrix.use-cross }}" = "true" ]; then
              cross build --release --locked --target "${{ matrix.target }}" && exit 0
            else
              RUSTC_WRAPPER=sccache cargo build --release --locked --target "${{ matrix.target }}" && exit 0
            fi
            if [ "${attempt}" = "3" ]; then
              exit 1
            fi
            sleep "$((attempt * 10))"
          done

      - name: Verify Linux GLIBC baseline
        if: ${{ contains(matrix.target, 'unknown-linux-gnu') }}
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/${{ matrix.binary-name }}"
          versions="$(readelf --version-info "${binary}" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu || true)"
          if [ -z "${versions}" ]; then
            echo "failed to detect GLIBC symbol versions for ${binary}" >&2
            exit 1
          fi
          max_required="$(printf '%s\n' "${versions}" | tail -n1)"
          echo "detected GLIBC requirements for ${binary}:"
          printf '%s\n' "${versions}"
          if [ "$(printf '%s\n%s\n' "${max_required}" "${{ matrix.max-glibc }}" | sort -V | tail -n1)" != "${{ matrix.max-glibc }}" ]; then
            echo "binary requires ${max_required}, which exceeds allowed baseline ${{ matrix.max-glibc }}" >&2
            exit 1
          fi

      - name: Native smoke test
        if: ${{ matrix.can-native-smoke }}
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/${{ matrix.binary-name }}"
          "${binary}" --version

      - name: Prepare binary artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/${{ matrix.artifact-name }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary-name }}" "dist/${{ matrix.artifact-name }}/${{ matrix.binary-name }}"

      - name: Attest binary artifact provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/${{ matrix.artifact-name }}/${{ matrix.binary-name }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/${{ matrix.artifact-name }}/${{ matrix.binary-name }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Install Node.js for native client probe
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install pinned native clients
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        shell: bash
        run: |
          set -euo pipefail
          unset GITHUB_TOKEN GH_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          mkdir -p "${HOME}/.local/bin"
          npm install --global --ignore-scripts @google/gemini-cli@0.53.0
          curl --proto '=https' --tlsv1.2 -fsSLo "${RUNNER_TEMP}/kiro-install.sh" https://cli.kiro.dev/install
          curl --proto '=https' --tlsv1.2 -fsSLo "${RUNNER_TEMP}/copilot-install.sh" https://gh.io/copilot-install
          curl --proto '=https' --tlsv1.2 -fsSLo "${RUNNER_TEMP}/claude-install.sh" https://claude.ai/install.sh
          echo "91a21bfa05cd7b58601cb83e0f1f187a9d0084726e5b824d4a4cf60306250908  ${RUNNER_TEMP}/kiro-install.sh" | sha256sum --check --strict
          echo "cd45508981a9baee5fb8f5e38495d315758cd7fea4a715b53a9f26c12544dc95  ${RUNNER_TEMP}/copilot-install.sh" | sha256sum --check --strict
          echo "cde4f1702d3b1695f92b73d26888364e17bca476e17f0fd676484c951d36c125  ${RUNNER_TEMP}/claude-install.sh" | sha256sum --check --strict
          kiro_manifest_version="$(curl --proto '=https' --tlsv1.2 -fsSL https://prod.download.cli.kiro.dev/stable/latest/manifest.json | python -c 'import json, sys; print(json.load(sys.stdin)["version"])')"
          test "${kiro_manifest_version}" = "${KIRO_CLI_VERSION}"
          bash "${RUNNER_TEMP}/kiro-install.sh" --force --channel stable
          VERSION=v1.0.77 PREFIX="${HOME}/.local" bash "${RUNNER_TEMP}/copilot-install.sh"
          bash "${RUNNER_TEMP}/claude-install.sh" 2.1.220
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Verify client discovery and direct-native guards
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          for command in gemini kiro-cli-chat copilot claude; do
            command -v "${command}"
            "${command}" --version
          done
          kiro_version="$(kiro-cli --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)"
          test "${kiro_version}" = "${KIRO_CLI_VERSION}"
          gemini --help > "${RUNNER_TEMP}/gemini-help.txt"
          grep -q -- "--yolo" "${RUNNER_TEMP}/gemini-help.txt"
          kiro-cli-chat chat --help > "${RUNNER_TEMP}/kiro-help.txt"
          grep -q -- "--model" "${RUNNER_TEMP}/kiro-help.txt"
          grep -a -q -- "KIRO_DATA_DIR" "$(command -v kiro-cli-chat)"
          copilot help environment > "${RUNNER_TEMP}/copilot-environment.txt"
          for variable in COPILOT_PROVIDER_BASE_URL COPILOT_PROVIDER_TYPE COPILOT_PROVIDER_API_KEY COPILOT_PROVIDER_WIRE_API COPILOT_PROVIDER_TRANSPORT COPILOT_MODEL; do
            grep -q -- "${variable}" "${RUNNER_TEMP}/copilot-environment.txt"
          done
          for variable in ANTHROPIC_BASE_URL ANTHROPIC_AUTH_TOKEN ANTHROPIC_MODEL; do
            grep -a -q -- "${variable}" "$(command -v claude)"
          done
          prodex_binary="target/${{ matrix.target }}/release/${{ matrix.binary-name }}"
          chmod 0755 "${prodex_binary}"
          PRODEX_HOME="${RUNNER_TEMP}/prodex-capability" "${prodex_binary}" capability list --json > "${RUNNER_TEMP}/capabilities.json"
          CAPABILITIES="${RUNNER_TEMP}/capabilities.json" python - <<'PY'
          import json
          import os

          with open(os.environ["CAPABILITIES"], encoding="utf-8") as handle:
              rows = {row["name"]: row for row in json.load(handle)}
          for name in ("gemini", "kiro", "copilot", "claude"):
              assert rows[name]["status"] == "available", rows[name]
          PY
          copilot --model gpt-5.6-luna --effort max --help > "${RUNNER_TEMP}/copilot-luna-help.txt"
          grep -q -- "GitHub Copilot CLI" "${RUNNER_TEMP}/copilot-luna-help.txt"
          smoke_root="${RUNNER_TEMP}/prodex-sub-agent-smoke"
          stub="${smoke_root}/stub-child"
          mkdir -p "${smoke_root}"
          cat > "${stub}" <<'SH'
          #!/bin/sh
          set -eu
          printf '%s\n' "$@" > "${PRODEX_STUB_ARGS}"
          printf '%s\n' "${PRODEX_SUB_AGENT:-}" > "${PRODEX_STUB_MARKER}"
          printf '%s\n' "stub child output"
          SH
          chmod 0755 "${stub}"
          for provider in kiro copilot; do
            provider_root="${smoke_root}/${provider}"
            mkdir -p "${provider_root}/tasks" "${provider_root}/slots"
            : > "${provider_root}/slots/slot-00.lock"
            printf '%s\n' "credential-free launcher smoke" > "${provider_root}/tasks/task.txt"
            SMOKE_PROVIDER_ROOT="${provider_root}" SMOKE_STUB="${stub}" SMOKE_PROVIDER="${provider}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["SMOKE_PROVIDER_ROOT"])
          spec = {
              "executable": os.environ["SMOKE_STUB"],
              "provider": os.environ["SMOKE_PROVIDER"],
              "model": "gpt-5.6-luna",
              "effort": "max",
              "local-url": None,
              "presidio-enabled": False,
              "max-concurrency": {"value": 1, "source": "custom"},
              "slot-dir": str(root / "slots"),
              "task-dir": str(root / "tasks"),
              "task-max-bytes": 65536,
              "recursion-marker": "PRODEX_SUB_AGENT",
          }
          (root / "config.json").write_text(json.dumps(spec), encoding="utf-8")
          PY
            PRODEX_STUB_ARGS="${provider_root}/args.txt" PRODEX_STUB_MARKER="${provider_root}/marker.txt" PRODEX_HOME="${provider_root}/home" "${prodex_binary}" __sub-agent-exec --config "${provider_root}/config.json" --task-file "${provider_root}/tasks/task.txt"
            test ! -e "${provider_root}/tasks/task.txt"
            grep -Fxq -- "s" "${provider_root}/args.txt"
            grep -Fxq -- "--no-sub-agent" "${provider_root}/args.txt"
            grep -Fxq -- "${provider}" "${provider_root}/args.txt"
            grep -Fxq -- "gpt-5.6-luna" "${provider_root}/args.txt"
            grep -Fxq -- "model_reasoning_effort=max" "${provider_root}/args.txt"
            grep -Fxq -- "1" "${provider_root}/marker.txt"
          done
          PRODEX_HOME="${RUNNER_TEMP}/prodex-agy" PRODEX_AGY_BIN=/bin/true "${prodex_binary}" s gemini --cli agy --no-presidio
          if PRODEX_HOME="${RUNNER_TEMP}/prodex-agy" PRODEX_AGY_BIN=/bin/true "${prodex_binary}" s gemini --cli agy --presidio 2> "${RUNNER_TEMP}/presidio-error.txt"; then
            echo "native Antigravity unexpectedly accepted --presidio" >&2
            exit 1
          fi
          grep -q -- "--presidio is unsupported" "${RUNNER_TEMP}/presidio-error.txt"

  publish-container:
    name: Publish container and deployment manifest
    runs-on: ubuntu-latest
    needs:
      - verify-ci
      - build
    timeout-minutes: 45
    permissions:
      artifact-metadata: write
      attestations: write
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Check out release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(python - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as handle:
              print(tomllib.load(handle)["package"]["version"])
          PY
          )"
          if [ "${GITHUB_REPOSITORY,,}" != "christiandoxa/prodex" ]; then
            echo "container publication is restricted to christiandoxa/prodex" >&2
            exit 1
          fi
          if [ "${GITHUB_REF_TYPE:-branch}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "${version}" ]; then
            echo "release ref ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: echo "${GH_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Build, scan, and push container
        id: image
        env:
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build --pull \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.version=${VERSION}" \
            --tag "${image}:${VERSION}" \
            .

          trivy_image="docker.io/aquasec/trivy:0.72.0@sha256:cffe3f5161a47a6823fbd23d985795b3ed72a4c806da4c4df16266c02accdd6f"
          mkdir -p dist "${RUNNER_TEMP}/trivy-cache" "${RUNNER_TEMP}/trivy-input"
          docker save "${image}:${VERSION}" --output "${RUNNER_TEMP}/trivy-input/image.tar"
          docker run --rm \
            -v "${RUNNER_TEMP}/trivy-cache:/root/.cache/trivy" \
            -v "${RUNNER_TEMP}/trivy-input:/input:ro" \
            -v "${PWD}/dist:/output" \
            "${trivy_image}" \
            image --input /input/image.tar --scanners vuln --ignore-unfixed \
            --severity HIGH,CRITICAL --exit-code 1 --format json \
            --output "/output/prodex-container-vulnerability-${VERSION}.json"
          rm -f "${RUNNER_TEMP}/trivy-input/image.tar"

          docker push "${image}:${VERSION}"
          repository_digest="$(docker inspect --format='{{index .RepoDigests 0}}' "${image}:${VERSION}")"
          digest="${repository_digest#*@}"
          if [[ ! "${digest}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "registry returned an invalid image digest" >&2
            exit 1
          fi
          {
            echo "name=${image}"
            echo "digest=${digest}"
          } >> "${GITHUB_OUTPUT}"

      - name: Attest container provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Render immutable Kubernetes manifest
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          VERSION: ${{ steps.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          digest_hex="${IMAGE_DIGEST#sha256:}"
          output="dist/prodex-gateway-${VERSION}.yaml"
          sed "s/PRODEX_IMAGE_DIGEST/${digest_hex}/g" deploy/kubernetes/prodex-gateway.yaml > "${output}"
          if grep -q 'PRODEX_IMAGE_DIGEST' "${output}"; then
            echo "rendered Kubernetes manifest still contains an image placeholder" >&2
            exit 1
          fi
          if [ "$(grep -c "@${IMAGE_DIGEST}" "${output}")" -ne "$(grep -c '@sha256:PRODEX_IMAGE_DIGEST' deploy/kubernetes/prodex-gateway.yaml)" ]; then
            echo "rendered Kubernetes manifest does not pin all Prodex workloads" >&2
            exit 1
          fi

      - name: Attest deployment artifacts provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/prodex-gateway-${{ steps.release.outputs.version }}.yaml
            dist/prodex-container-vulnerability-${{ steps.release.outputs.version }}.json

      - name: Upload Kubernetes manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: kubernetes-manifest
          path: |
            dist/prodex-gateway-${{ steps.release.outputs.version }}.yaml
            dist/prodex-container-vulnerability-${{ steps.release.outputs.version }}.json
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  prepare-release:
    name: Prepare release SBOM
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download built binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Generate release SBOM
        shell: bash
        run: |
          set -euo pipefail
          syft_image="anchore/syft:v1.41.2@sha256:962c5626d30cdfb814802598cbb7b63cb690bf979a4bc0ff1d9c6e0cb441db7f"
          for attempt in 1 2 3; do
            if docker pull "$syft_image"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep "$((attempt * 5))"
          done
          docker run --rm \
            -v "${PWD}/artifacts:/source:ro" \
            "$syft_image" \
            dir:/source -o spdx-json > release-sbom.spdx.json

      - name: Attest release SBOM provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: release-sbom.spdx.json

      - name: Upload release SBOM
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-sbom
          path: release-sbom.spdx.json
          if-no-files-found: error
          overwrite: true

  sync-release-docs:
    name: Sync release docs
    runs-on: ubuntu-latest
    needs:
      - prepare-release
    permissions:
      contents: write

    steps:
      - name: Check out release ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(python - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as handle:
              print(tomllib.load(handle)["package"]["version"])
          PY
          )"
          ref_name="${GITHUB_REF_NAME}"
          ref_type="${GITHUB_REF_TYPE:-branch}"
          target_sha="${GITHUB_SHA}"
          if [ "${ref_type}" = "tag" ]; then
            case "${ref_name}" in
              "${version}") ;;
              *)
                echo "release ref ${ref_name} does not match Cargo.toml version ${version}" >&2
                exit 1
                ;;
            esac
            git fetch origin "refs/tags/${ref_name}:refs/tags/${ref_name}"
            target_sha="$(git rev-list -n1 "${ref_name}")"
          elif [ "${ref_name}" != "main" ]; then
            echo "workflow_dispatch release runs must target main or a matching version tag" >&2
            exit 1
          fi
          {
            echo "version=${version}"
            echo "tag=${version}"
            echo "target_sha=${target_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Sync documentation version metadata
        shell: bash
        run: |
          set -euo pipefail
          main_sha="$(git rev-parse origin/main)"
          release_sha="${{ steps.release.outputs.target_sha }}"
          version="${{ steps.release.outputs.version }}"
          if [ "${release_sha}" != "${main_sha}" ]; then
            echo "release commit ${release_sha} is not the current origin/main head; skipping docs sync"
            exit 0
          fi
          node scripts/npm/sync-docs-version.mjs --version "${version}"
          if git diff --quiet -- README.md QUICKSTART.md; then
            echo "docs already synced"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md QUICKSTART.md
          git commit -m "docs(release): sync version snippets for ${version}"
          git push origin HEAD:main

  publish-github-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs:
      - prepare-release
      - publish-container
      - sync-release-docs
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(python - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as handle:
              print(tomllib.load(handle)["package"]["version"])
          PY
          )"
          ref_name="${GITHUB_REF_NAME}"
          ref_type="${GITHUB_REF_TYPE:-branch}"
          target_sha="${GITHUB_SHA}"
          if [ "${ref_type}" = "tag" ]; then
            case "${ref_name}" in
              "${version}") ;;
              *)
                echo "release ref ${ref_name} does not match Cargo.toml version ${version}" >&2
                exit 1
                ;;
            esac
            git fetch origin "refs/tags/${ref_name}:refs/tags/${ref_name}"
            target_sha="$(git rev-list -n1 "${ref_name}")"
          elif [ "${ref_name}" != "main" ]; then
            echo "workflow_dispatch release runs must target main or a matching version tag" >&2
            exit 1
          fi
          {
            echo "version=${version}"
            echo "tag=${version}"
            echo "target_sha=${target_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Download built binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: artifacts

      - name: Download release SBOM
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-sbom
          path: artifacts/release-sbom

      - name: Download Kubernetes manifest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: kubernetes-manifest
          path: artifacts/kubernetes-manifest

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          while IFS= read -r -d '' file; do
            parent="$(basename "$(dirname "${file}")")"
            base="$(basename "${file}")"
            ext=""
            stem="${base}"
            if [[ "${base}" == *.* ]]; then
              ext=".${base##*.}"
              stem="${base%.*}"
            fi
            cp "${file}" "release-assets/${stem}-${parent}${ext}"
          done < <(find artifacts -mindepth 2 -maxdepth 2 -type f \( -name 'prodex' -o -name 'prodex.exe' \) -print0)
          cp artifacts/release-sbom/release-sbom.spdx.json release-assets/release-sbom.spdx.json
          cp artifacts/kubernetes-manifest/prodex-* release-assets/
          cp install.sh release-assets/install.sh
          cp install.ps1 release-assets/install.ps1
          chmod 0755 release-assets/install.sh

      - name: Generate and verify release checksums
        shell: bash
        run: |
          set -euo pipefail
          (
            cd release-assets
            sha256sum install.sh install.ps1 prodex-* release-sbom.spdx.json > SHA256SUMS
            sha256sum --check SHA256SUMS
          )

      - name: Prepare antivirus engine health check
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scan-health
          printf '%s' 'X5O!P%@AP[4\PZX54(P^)7CC)7}$' 'EICAR-STANDARD-ANTIVIRUS-TEST-FILE!$H+H*' > scan-health/eicar.com

      - name: Verify antivirus engine detects EICAR
        id: antivirus_health
        continue-on-error: true
        uses: hugoalh/scan-virus-ghaction/clamav@99c81e8991ad1074a14e5f22a21bce9be035e14e # v0.20.1
        with:
          clamav_update: "True"
          ignores_pre: |-
            Param($ElementPreMeta)
            Return ($ElementPreMeta.Path -notmatch '^scan-health[\\/]')

      - name: Require a working antivirus engine
        if: ${{ always() }}
        env:
          SCAN_OUTCOME: ${{ steps.antivirus_health.outcome }}
          SCAN_FINISH: ${{ steps.antivirus_health.outputs.finish }}
          SCAN_FOUND: ${{ steps.antivirus_health.outputs.found }}
        shell: bash
        run: |
          set -euo pipefail
          rm -f scan-health/eicar.com
          rmdir scan-health
          if [ "${SCAN_OUTCOME}" != "failure" ] || [ "${SCAN_FINISH}" != "true" ] || [ "${SCAN_FOUND}" != "true" ]; then
            echo "antivirus engine health check did not detect EICAR" >&2
            exit 1
          fi

      - name: Scan release assets for malware
        id: release_malware_scan
        uses: hugoalh/scan-virus-ghaction/clamav@99c81e8991ad1074a14e5f22a21bce9be035e14e # v0.20.1
        with:
          clamav_update: "True"
          found_summary: "True"
          statistics_summary: "True"
          ignores_pre: |-
            Param($ElementPreMeta)
            Return ($ElementPreMeta.Path -notmatch '^release-assets[\\/]')

      - name: Require clean release assets
        env:
          SCAN_OUTCOME: ${{ steps.release_malware_scan.outcome }}
          SCAN_FINISH: ${{ steps.release_malware_scan.outputs.finish }}
          SCAN_FOUND: ${{ steps.release_malware_scan.outputs.found }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${SCAN_OUTCOME}" != "success" ] || [ "${SCAN_FINISH}" != "true" ] || [ "${SCAN_FOUND}" != "false" ]; then
            echo "release asset malware scan did not finish cleanly" >&2
            exit 1
          fi
          if ! find release-assets -maxdepth 1 -type f -print -quit | grep -q .; then
            echo "release asset malware scan scope is empty" >&2
            exit 1
          fi

      - name: Attest installer provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            release-assets/install.sh
            release-assets/install.ps1

      - name: Verify release provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' asset; do
            gh attestation verify "${asset}" --repo "${GITHUB_REPOSITORY}"
          done < <(find release-assets -maxdepth 1 -type f ! -name SHA256SUMS -print0)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          version="${{ steps.release.outputs.version }}"
          target_sha="${{ steps.release.outputs.target_sha }}"
          title="${version}"
          notes_file="$(mktemp)"
          cat > "${notes_file}" <<EOF
          prodex ${version}

          Install:

          \`\`\`bash
          curl -fsSL https://github.com/christiandoxa/prodex/releases/download/${version}/install.sh | sh -s -- --release ${version}
          \`\`\`

          Windows PowerShell:

          \`\`\`powershell
          \$env:PRODEX_RELEASE='${version}'; irm https://github.com/christiandoxa/prodex/releases/download/${version}/install.ps1 | iex
          \`\`\`

          Update future releases with \`prodex update\`.

          Container: \`ghcr.io/christiandoxa/prodex:${version}\`
          Kubernetes: \`prodex-gateway-${version}.yaml\` (pinned to the attested container digest).

          All published assets passed the release malware gate.
          EOF
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release edit "${tag}" \
              --title "${title}" \
              --notes-file "${notes_file}"
            gh release upload "${tag}" release-assets/* --clobber
          else
            gh release create "${tag}" release-assets/* \
              --target "${target_sha}" \
              --title "${title}" \
              --notes-file "${notes_file}" \
              --latest
          fi

  publish-duration-telemetry:
    name: Publish duration telemetry
    runs-on: ubuntu-latest
    needs:
      - build
      - prepare-release
      - sync-release-docs
      - publish-github-release
    if: ${{ always() }}
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Summarize publish job durations
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          jobs_json="${RUNNER_TEMP}/publish-jobs.json"
          summary_path="${RUNNER_TEMP}/publish-job-durations.txt"
          json_path="${RUNNER_TEMP}/publish-job-durations.json"
          gh run view "${{ github.run_id }}" \
            --repo "${{ github.repository }}" \
            --attempt "${{ github.run_attempt }}" \
            --json jobs > "${jobs_json}"
          set +e
          node scripts/ci/github-job-durations.mjs \
            --max-wall-minutes 12 \
            --max-runner-minutes 50 \
            --run-id "${{ github.run_id }}" \
            --exclude-name "Publish duration telemetry" \
            --limit 12 < "${jobs_json}" \
            | tee "${summary_path}"
          text_status="${PIPESTATUS[0]}"
          node scripts/ci/github-job-durations.mjs \
            --max-wall-minutes 12 \
            --max-runner-minutes 50 \
            --run-id "${{ github.run_id }}" \
            --exclude-name "Publish duration telemetry" \
            --limit 12 \
            --json < "${jobs_json}" > "${json_path}"
          json_status="$?"
          set -e
          {
            echo "### Publish job durations"
            echo
            echo '```text'
            cat "${summary_path}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          if [ "${text_status}" -ne 0 ]; then
            exit "${text_status}"
          fi
          exit "${json_status}"

      - name: Upload publish duration telemetry
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: publish-duration-telemetry
          path: |
            ${{ runner.temp }}/publish-job-durations.txt
            ${{ runner.temp }}/publish-job-durations.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 14
