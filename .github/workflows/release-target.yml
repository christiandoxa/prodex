name: Source-pinned release target

# This workflow is called once per production target. GitHub schedules the
# matching binary immediately after its own archive, never after another target.
on:
  workflow_call:
    inputs:
      target_sha:
        required: true
        type: string
      version:
        required: true
        type: string
      kiro_cli_version:
        required: true
        type: string
      platforms:
        description: One-element array from the owning six-target release matrix
        required: true
        type: string

permissions:
  actions: read
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_HTTP_MULTIPLEXING: "false"
  SCCACHE_CACHE_SIZE: 2G
  SCCACHE_GHA_ENABLED: "true"
  KIRO_CLI_VERSION: ${{ inputs.kiro_cli_version }}
  MOJO_VERSION: "1.2.0"
  UV_VERSION: "0.11.7"

jobs:
  build-mojo-archives:
    name: Build Mojo archive ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platforms) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate archive source identity before expensive compilation
        env:
          RELEASE_TARGET_SHA: ${{ inputs.target_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_TARGET_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${GITHUB_SHA}" = "${RELEASE_TARGET_SHA}"
          actual_version="$(python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as handle:
              print(tomllib.load(handle)["package"]["version"])
          PY
          )"
          test "${actual_version}" = "${RELEASE_VERSION}"

      - name: Restore exact-input archive shared with main CI
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
        id: release-archive-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          # Exact key AND path match CI; no prefix restore or cross-target reuse.
          path: target/mojo-runtime/${{ matrix.target }}/${{ endsWith(matrix.target, '-msvc') && 'prodex_mojo_core.lib' || 'libprodex_mojo_core.a' }}
          key: mojo-static-v2-${{ runner.os }}-${{ matrix.target }}-${{ matrix.mojo-target-cpu }}-mojo-${{ env.MOJO_VERSION }}-rust1.99.1-${{ hashFiles('mojo/**/*.mojo', 'crates/prodex-mojo-core/build.rs', 'crates/prodex-mojo-core/build/*.rs', 'crates/prodex-mojo-core/Cargo.toml') }}

      - name: Materialize verified-input cached archive for release validation
        if: ${{ steps.release-archive-cache.outputs.cache-hit == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          archive_name=libprodex_mojo_core.a
          if [[ '${{ matrix.target }}' == *-pc-windows-msvc ]]; then archive_name=prodex_mojo_core.lib; fi
          mkdir -p 'target/mojo-release/${{ matrix.target }}'
          cp "target/mojo-runtime/${{ matrix.target }}/${archive_name}" "target/mojo-release/${{ matrix.target }}/${archive_name}"

      - name: Reuse exact-source strict CI Mojo archive when available
        if: ${{ steps.release-archive-cache.outputs.cache-hit != 'true' }}
        id: reuse-ci-archive
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET_SHA: ${{ inputs.target_sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/ci/reuse_mojo_ci_archive.py             --target '${{ matrix.target }}'             --sha "${RELEASE_TARGET_SHA}"             --output-dir 'target/mojo-release/${{ matrix.target }}'

      - name: Install Rust target
        if: ${{ steps.reuse-ci-archive.outputs.reused != 'true' && steps.release-archive-cache.outputs.cache-hit != 'true' }}
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}

      - name: Install pinned uv
        if: ${{ steps.reuse-ci-archive.outputs.reused != 'true' && steps.release-archive-cache.outputs.cache-hit != 'true' }}
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Install pinned Mojo compiler
        if: ${{ steps.reuse-ci-archive.outputs.reused != 'true' && steps.release-archive-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python "mojo==${MOJO_VERSION}"
          export PATH="${GITHUB_WORKSPACE}/.venv/bin:${PATH}"
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"
          mojo_version="$(mojo --version)"
          case "${mojo_version}" in
            "Mojo ${MOJO_VERSION}"*) ;;
            *) echo "unexpected Mojo version: ${mojo_version}" >&2; exit 1 ;;
          esac

      - name: Ensure LLVM archive tools
        shell: bash
        run: |
          bash scripts/ci/ensure-llvm-archive-tools.sh

      - name: Build target Mojo archive
        if: ${{ steps.reuse-ci-archive.outputs.reused != 'true' && steps.release-archive-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          export AR=llvm-ar
          if [[ '${{ matrix.target }}' == *-pc-windows-msvc ]]; then
            export AR=llvm-lib
          fi
          PRODEX_MOJO_REQUIRED=1 \
          PRODEX_MOJO_VERSION="${MOJO_VERSION}" \
          PRODEX_MOJO_TARGET="${{ matrix.target }}" \
          PRODEX_MOJO_TARGET_CPU="${{ matrix.mojo-target-cpu }}" \
          CARGO_TARGET_DIR="${GITHUB_WORKSPACE}/target/mojo-archive/${{ matrix.target }}" \
          cargo build --release --locked --target "${{ matrix.target }}" \
            -p prodex-mojo-core --features mojo-core
          archive_name=libprodex_mojo_core.a
          if [[ '${{ matrix.target }}' == *-pc-windows-msvc ]]; then
            archive_name=prodex_mojo_core.lib
          fi
          archive="$(find "target/mojo-archive/${{ matrix.target }}/${{ matrix.target }}/release/build" -type f -name "${archive_name}" -printf '%T@ %p\n' | sort -nr | head -n 1 | cut -d' ' -f2-)"
          test -s "${archive}"
          mkdir -p "target/mojo-release/${{ matrix.target }}"
          cp "${archive}" "target/mojo-release/${{ matrix.target }}/${archive_name}"

      - name: Verify target archive
        shell: bash
        run: |
          set -euo pipefail
          archive_name=libprodex_mojo_core.a
          if [[ '${{ matrix.target }}' == *-pc-windows-msvc ]]; then
            archive_name=prodex_mojo_core.lib
          fi
          archive="target/mojo-release/${{ matrix.target }}/${archive_name}"
          llvm-nm -g "${archive}" | grep -F 'prodex_mojo_rich_abi_version'
          llvm-nm -g "${archive}" | grep -F 'prodex_mojo_log_level_classify_v1'
          if [[ "${{ matrix.target }}" == *-pc-windows-msvc ]]; then
            duplicate_weak="$(llvm-nm --format=posix "${archive}" \
              | awk '$2 == "W" && $1 ~ /^static_string_/ { print $1 }' \
              | sort | uniq -d)"
            if [ -n "${duplicate_weak}" ]; then
              echo "MSVC Mojo archive contains duplicate weak static-string aliases:" >&2
              printf '%s\n' "${duplicate_weak}" >&2
              exit 1
            fi
          fi
          if llvm-nm -u "${archive}" | grep -F 'KGEN_CompilerRT_'; then
            echo "target Mojo archive unexpectedly requires the Mojo compiler runtime" >&2
            exit 1
          fi

      - name: Save only ABI-validated archive into the shared cache path
        if: ${{ steps.release-archive-cache.outputs.cache-hit != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          archive_name=libprodex_mojo_core.a
          if [[ '${{ matrix.target }}' == *-pc-windows-msvc ]]; then archive_name=prodex_mojo_core.lib; fi
          mkdir -p 'target/mojo-runtime/${{ matrix.target }}'
          cp "target/mojo-release/${{ matrix.target }}/${archive_name}" "target/mojo-runtime/${{ matrix.target }}/${archive_name}"

      - name: Upload target Mojo archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: mojo-archive-${{ matrix.target }}
          path: target/mojo-release/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.target }}
    needs: build-mojo-archives
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 180
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.platforms) }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate release target policy
        shell: bash
        run: |
          set -euo pipefail
          row="$(awk -F '\t' -v target='${{ matrix.target }}' '$1 == target { print; exit }' migration/release-target-matrix.tsv)"
          test -n "${row}"
          expected_asset="$(printf '%s\n' "${row}" | awk -F '\t' '{ print $2 }')"
          expected_implementation="$(printf '%s\n' "${row}" | awk -F '\t' '{ print $3 }')"
          expected_glibc="$(printf '%s\n' "${row}" | awk -F '\t' '{ print $7 }')"
          expected_asset_name="prodex-${{ matrix.artifact-name }}"
          if [ "${{ matrix.binary-name }}" = "prodex.exe" ]; then
            expected_asset_name="${expected_asset_name}.exe"
          fi
          test "${expected_asset}" = "${expected_asset_name}"
          if [ "${{ matrix.mojo-release }}" = true ]; then
            test "${expected_implementation}" = mojo-compiled-in
          else
            test "${expected_implementation}" = rust
          fi
          if [[ '${{ matrix.target }}' == *-unknown-linux-gnu ]]; then
            test "${expected_glibc}" = '${{ matrix.max-glibc }}'
          fi

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}

      - name: Require Rosetta for Intel macOS cross-target smoke
        if: ${{ matrix.target == 'x86_64-apple-darwin' }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          if ! arch -x86_64 /usr/bin/true; then
            sudo softwareupdate --install-rosetta --agree-to-license
          fi
          arch -x86_64 /usr/bin/true

      - name: Fingerprint only pinned external Rust dependencies
        id: rust-deps-cache-key
        shell: bash
        run: |
          set -euo pipefail
          # The macOS/Linux images provide Python 3; Windows has Python on
          # PATH. The helper requires tomllib (3.11+) and fails closed.
          if [[ "${RUNNER_OS}" == Windows ]]; then
            python scripts/ci/release_cargo_deps_cache_key.py \
              --lockfile Cargo.lock --output "${GITHUB_OUTPUT}"
          else
            python3 scripts/ci/release_cargo_deps_cache_key.py \
              --lockfile Cargo.lock --output "${GITHUB_OUTPUT}"
          fi

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          # Cargo fingerprints still recompile anything stale after restore.
          # Workspace production crates are never included in this cache.
          add-rust-environment-hash-key: "false"
          cache-workspace-crates: "false"
          shared-key: production-release-deps-v1
          key: release-deps-v1-rust1.99.1-thinlto-cgu16-mojo${{ env.MOJO_VERSION }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ matrix.mojo-target-cpu }}${{ matrix.target == 'x86_64-apple-darwin' && '-arm64-cross' || '' }}${{ matrix.target == 'aarch64-pc-windows-msvc' && '-arm64-native' || '' }}-${{ steps.rust-deps-cache-key.outputs.external_sha256 }}

      - name: Download target Mojo archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: mojo-archive-${{ matrix.target }}
          path: target/mojo-release/${{ matrix.target }}

      - name: Install sccache
        # Linux cross never uses this host wrapper, while Windows x64 logged
        # zero cache hits in 0.437.11 and measured faster without sccache.
        # Windows ARM64 was already proven with direct native Cargo.
        if: ${{ matrix.use-cross == false && (matrix.target == 'x86_64-apple-darwin' || matrix.target == 'aarch64-apple-darwin') }}
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11

      - name: Install cross
        if: ${{ matrix.use-cross }}
        shell: bash
        run: |
          set -euo pipefail
          if command -v cross >/dev/null 2>&1; then
            exit 0
          fi
          for attempt in 1 2 3; do
            if CARGO_HTTP_MULTIPLEXING=false cargo install cross --version 0.2.5 --locked; then
              exit 0
            fi
            if [ "${attempt}" = "3" ]; then
              exit 1
            fi
            sleep "$((attempt * 10))"
          done

      - name: Install Linux ARM cross and emulation tools
        if: ${{ matrix.target == 'aarch64-unknown-linux-gnu' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu qemu-user

      - name: Build prodex
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          build_args=(--release --target "${{ matrix.target }}")
          if [ "${{ matrix.mojo-release }}" = "true" ]; then
            export PRODEX_MOJO_REQUIRED=1
            export PRODEX_MOJO_VERSION="${MOJO_VERSION}"
            export PRODEX_MOJO_TARGET="${{ matrix.target }}"
            export PRODEX_MOJO_TARGET_CPU="${{ matrix.mojo-target-cpu }}"
            archive_name=libprodex_mojo_core.a
            if [[ '${{ matrix.target }}' == *-pc-windows-msvc ]]; then
              archive_name=prodex_mojo_core.lib
            fi
            export PRODEX_MOJO_ARCHIVE="target/mojo-release/${{ matrix.target }}/${archive_name}"
            export CROSS_CONTAINER_OPTS="${CROSS_CONTAINER_OPTS:-} --env PRODEX_MOJO_REQUIRED=1 --env PRODEX_MOJO_VERSION=${MOJO_VERSION} --env PRODEX_MOJO_TARGET=${{ matrix.target }} --env PRODEX_MOJO_TARGET_CPU=${{ matrix.mojo-target-cpu }} --env PRODEX_MOJO_ARCHIVE=${PRODEX_MOJO_ARCHIVE}"
            test -s "${PRODEX_MOJO_ARCHIVE}"
            build_args+=(--features "${{ matrix.mojo-features }}")
          fi
          for attempt in 1 2 3; do
            if [ "${{ matrix.use-cross }}" = "true" ]; then
              cross build --locked "${build_args[@]}" && exit 0
            else
              if [[ "${{ matrix.target }}" == *-pc-windows-msvc ]]; then
                cargo build --locked "${build_args[@]}" && exit 0
              else
                RUSTC_WRAPPER=sccache cargo build --locked "${build_args[@]}" && exit 0
              fi
            fi
            if [ "${attempt}" = "3" ]; then
              exit 1
            fi
            sleep "$((attempt * 10))"
          done

      - name: Verify emulated Windows x64 artifact on native ARM64 host
        if: ${{ matrix.target == 'x86_64-pc-windows-msvc' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PROCESSOR_ARCHITECTURE -cne 'ARM64') {
            throw "Expected native ARM64 cross-build host, got $env:PROCESSOR_ARCHITECTURE"
          }
          $binary = 'target/x86_64-pc-windows-msvc/release/prodex.exe'
          if (-not (Test-Path $binary -PathType Leaf)) {
            throw 'Windows x64 release binary missing'
          }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $binary))
          $offset = [BitConverter]::ToInt32($bytes, 60)
          if ($offset -le 0 -or ($offset + 6) -ge $bytes.Length) {
            throw 'Invalid Windows PE executable header'
          }
          $machine = [BitConverter]::ToUInt16($bytes, $offset + 4)
          if ($machine -ne 0x8664) {
            throw "Expected Windows x64 PE (0x8664), got $machine"
          }
          # Fail closed if Windows ARM emulation cannot execute the x64 binary.
          & $binary --version
          if ($LASTEXITCODE -ne 0) {
            throw 'Emulated Windows x64 version smoke failed'
          }

      - name: Verify native Windows ARM64 artifact architecture
        if: ${{ matrix.target == 'aarch64-pc-windows-msvc' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:PROCESSOR_ARCHITECTURE -cne 'ARM64') {
            throw "Wrong Windows ARM64 build host: $env:PROCESSOR_ARCHITECTURE"
          }
          $binary = 'target/aarch64-pc-windows-msvc/release/prodex.exe'
          if (-not (Test-Path $binary -PathType Leaf)) { throw 'Windows ARM64 binary missing' }
          $bytes = [System.IO.File]::ReadAllBytes((Resolve-Path $binary))
          $offset = [BitConverter]::ToInt32($bytes, 60)
          if ($offset -le 0 -or $offset + 6 -ge $bytes.Length) {
            throw 'Invalid Windows PE executable header'
          }
          $machine = [BitConverter]::ToUInt16($bytes, $offset + 4)
          if ($machine -ne 0xAA64) { throw "Expected Windows ARM64 PE (0xAA64), got $machine" }
          & $binary --version
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows ARM64 version smoke failed' }

      - name: Verify macOS Intel artifact architecture and Rosetta execution
        if: ${{ matrix.target == 'x86_64-apple-darwin' }}
        shell: bash
        run: |
          set -euo pipefail
          binary="target/x86_64-apple-darwin/release/prodex"
          test -s "${binary}"
          file "${binary}"
          test "$(lipo -archs "${binary}")" = x86_64
          arch -x86_64 "${binary}" --version

      - name: Verify compiled-in Mojo release
        if: ${{ matrix.mojo-release && matrix.can-mojo-runtime-smoke }}
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/${{ matrix.binary-name }}"
          archive_name=libprodex_mojo_core.a
          if [[ '${{ matrix.target }}' == *-pc-windows-msvc ]]; then
            archive_name=prodex_mojo_core.lib
          fi
          archive="target/mojo-release/${{ matrix.target }}/${archive_name}"
          test -s "${archive}"
          if [[ '${{ matrix.target }}' == *-pc-windows-msvc ]]; then
            echo "COFF archive symbols were verified on the Linux archive runner"
          else
            symbol_tool=(nm)
            "${symbol_tool[@]}" -g "${archive}" | grep -F 'prodex_quota_remaining_percent'
            "${symbol_tool[@]}" -g "${archive}" | grep -F 'prodex_mojo_abi_version'
            "${symbol_tool[@]}" -g "${archive}" | grep -F 'prodex_routing_plan_batch'
            "${symbol_tool[@]}" -g "${archive}" | grep -F 'prodex_capability_match_batch'
            "${symbol_tool[@]}" -g "${archive}" | grep -F 'prodex_mojo_text_abi_version'
            "${symbol_tool[@]}" -g "${archive}" | grep -F 'prodex_context_prepare_signal_rows_v1'
            "${symbol_tool[@]}" -g "${archive}" | grep -F 'prodex_mojo_rich_abi_version'
            "${symbol_tool[@]}" -g "${archive}" | grep -F 'prodex_mojo_rich_context_analyze_v2'
            "${symbol_tool[@]}" -g "${archive}" | grep -F 'prodex_mojo_provider_registry_resolve_v1'
            "${symbol_tool[@]}" -g "${archive}" | grep -F 'prodex_mojo_rich_model_fallback_v2'
            "${symbol_tool[@]}" -g "${archive}" | grep -F 'prodex_mojo_rich_context_plan_v2'
            "${symbol_tool[@]}" -g "${archive}" | grep -F 'prodex_mojo_log_level_classify_v1'
            "${symbol_tool[@]}" -g "${archive}" | grep -F 'prodex_mojo_rich_catalog_resolve_v1'
            "${symbol_tool[@]}" -g "${archive}" | grep -F 'prodex_mojo_rich_catalog_choices_v1'
            "${symbol_tool[@]}" -g "${archive}" | grep -F 'prodex_mojo_rich_catalog_merge_v1'
            "${symbol_tool[@]}" -g "${archive}" | grep -F 'prodex_runtime_quota_score_batch'
            "${symbol_tool[@]}" -g "${archive}" | grep -F 'prodex_runtime_quota_route_score_resolution_batch'
            "${symbol_tool[@]}" -g "${archive}" | grep -F 'prodex_smart_context_token_usage_summary_batch'
            if "${symbol_tool[@]}" -u "${archive}" | grep -F 'KGEN_CompilerRT_'; then
              echo "rich Mojo core unexpectedly requires the Mojo compiler runtime" >&2
              exit 1
            fi
          fi
          case '${{ matrix.target }}' in
            *-unknown-linux-gnu)
              if readelf --dynamic "${binary}" | grep -Eiq 'lib(mojo|modular)|RPATH|RUNPATH'; then
                echo "Mojo release binary has an unexpected dynamic Mojo dependency or build path" >&2
                readelf --dynamic "${binary}" >&2
                exit 1
              fi
              ;;
            *-apple-darwin)
              if otool -L "${binary}" | grep -Eiq 'mojo|modular'; then
                echo "Mojo release binary has an unexpected dynamic Mojo dependency" >&2
                otool -L "${binary}" >&2
                exit 1
              fi
              ;;
            *-pc-windows-msvc)
              if dumpbin.exe /DEPENDENTS "${binary}" 2>/dev/null | grep -Eiq 'mojo|modular'; then
                echo "Mojo release binary has an unexpected dynamic Mojo dependency" >&2
                dumpbin.exe /DEPENDENTS "${binary}" >&2
                exit 1
              fi
              ;;
          esac
          binary_command=("${binary}")
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            binary_command=(qemu-aarch64 -L /usr/aarch64-linux-gnu "${binary}")
          fi
          diagnostics="$(PRODEX_HOME="${RUNNER_TEMP}/prodex-mojo-release-home" "${binary_command[@]}" doctor --runtime --json)"
          printf '%s\n' "${diagnostics}" | grep -F '"implementation": "mojo-compiled-in"'
          printf '%s\n' "${diagnostics}" | grep -F '"fallback": false'
          printf '%s\n' "${diagnostics}" | grep -F '"compiler_required": false'
          printf '%s\n' "${diagnostics}" | grep -F '"build_strict": true'
          printf '%s\n' "${diagnostics}" | grep -F '"self_test": "passed"'
          printf '%s\n' "${diagnostics}" | grep -F '"context_text": true'
          printf '%s\n' "${diagnostics}" | grep -F '"rich_abi_version": 6'
          printf '%s\n' "${diagnostics}" | grep -F '"runtime_dependency_mode": "arena-static"'
          printf '%s\n' "${diagnostics}" | grep -F '"rich_domain": true'
          printf '%s\n' "${diagnostics}" | grep -F '"rich_context_parser": true'
          printf '%s\n' "${diagnostics}" | grep -F '"rich_provider_routing": true'
          printf '%s\n' "${diagnostics}" | grep -F '"log_semantics": true'
          clean_root="$(mktemp -d)"
          trap 'rm -rf "${clean_root}"' EXIT
          if [[ '${{ matrix.target }}' == *-pc-windows-msvc ]]; then
            PATH="${PATH}" HOME="${clean_root}/home" PRODEX_HOME="${clean_root}/prodex-home" \
              "${binary_command[@]}" doctor --runtime --json > "${clean_root}/diagnostics.json"
          else
            if PATH="/usr/bin:/bin" command -v mojo >/dev/null 2>&1; then
              echo "clean-machine smoke unexpectedly found Mojo" >&2
              exit 1
            fi
            env -i PATH="/usr/bin:/bin" HOME="${clean_root}/home" PRODEX_HOME="${clean_root}/prodex-home" \
              "${binary_command[@]}" doctor --runtime --json > "${clean_root}/diagnostics.json"
          fi
          grep -F '"implementation": "mojo-compiled-in"' "${clean_root}/diagnostics.json"
          grep -F '"compiler_required": false' "${clean_root}/diagnostics.json"
          grep -F '"self_test": "passed"' "${clean_root}/diagnostics.json"

      - name: Verify non-native Mojo release artifact
        if: ${{ matrix.mojo-release && !matrix.can-mojo-runtime-smoke }}
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/${{ matrix.binary-name }}"
          test -s "${binary}"
          echo "${{ matrix.target }} is compile/link verified; runtime smoke requires a native runner"

      - name: Verify Linux GLIBC baseline
        if: ${{ contains(matrix.target, 'unknown-linux-gnu') }}
        shell: bash
        run: |
          set -euo pipefail
          for binary in \
            "target/${{ matrix.target }}/release/${{ matrix.binary-name }}"; do
            versions="$(readelf --version-info "${binary}" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu || true)"
            if [ -z "${versions}" ]; then
              echo "failed to detect GLIBC symbol versions for ${binary}" >&2
              exit 1
            fi
            max_required="$(printf '%s\n' "${versions}" | tail -n1)"
            echo "detected GLIBC requirements for ${binary}:"
            printf '%s\n' "${versions}"
            if [ "$(printf '%s\n%s\n' "${max_required}" "${{ matrix.max-glibc }}" | sort -V | tail -n1)" != "${{ matrix.max-glibc }}" ]; then
              echo "binary requires ${max_required}, which exceeds allowed baseline ${{ matrix.max-glibc }}" >&2
              exit 1
            fi
          done
      - name: Native smoke test
        if: ${{ matrix.can-native-smoke }}
        shell: bash
        run: |
          set -euo pipefail
          binary="target/${{ matrix.target }}/release/${{ matrix.binary-name }}"
          "${binary}" --version

      - name: Prepare binary artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/${{ matrix.artifact-name }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary-name }}" "dist/${{ matrix.artifact-name }}/${{ matrix.binary-name }}"

      - name: Upload binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.artifact-name }}
          path: dist/${{ matrix.artifact-name }}
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Install Node.js for native client probe
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install pinned native clients
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        shell: bash
        run: |
          set -euo pipefail
          unset GITHUB_TOKEN GH_TOKEN ACTIONS_ID_TOKEN_REQUEST_TOKEN ACTIONS_ID_TOKEN_REQUEST_URL
          mkdir -p "${HOME}/.local/bin"
          npm install --global --ignore-scripts @google/gemini-cli@0.53.0
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors --retry-delay 2 -fsSLo "${RUNNER_TEMP}/kiro-install.sh" https://cli.kiro.dev/install
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors --retry-delay 2 -fsSLo "${RUNNER_TEMP}/copilot-install.sh" https://gh.io/copilot-install
          curl --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors --retry-delay 2 -fsSLo "${RUNNER_TEMP}/claude-install.sh" https://claude.ai/install.sh
          echo "d8dd659c11c156002942f09443b6cb7904959004d4e7f1f73777fdbb2d909b54  ${RUNNER_TEMP}/kiro-install.sh" | sha256sum --check --strict
          echo "00efcc2e196f0793d097935d6230062fc66e8247dc01334d2ac3eae4e26a1c7f  ${RUNNER_TEMP}/copilot-install.sh" | sha256sum --check --strict
          echo "3a68d3406cf674e17bed1733a4dcf37805e2e47d87417700007d7e1aa766a944  ${RUNNER_TEMP}/claude-install.sh" | sha256sum --check --strict
          bash "${RUNNER_TEMP}/kiro-install.sh" --force --channel stable
          VERSION=v1.0.77 PREFIX="${HOME}/.local" bash "${RUNNER_TEMP}/copilot-install.sh"
          bash "${RUNNER_TEMP}/claude-install.sh" 2.1.220
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Verify client discovery and direct-native guards
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' }}
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.local/bin:${PATH}"
          for command in gemini kiro-cli-chat copilot claude; do
            command -v "${command}"
            "${command}" --version
          done
          kiro_version="$(kiro-cli --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -n1)"
          test "${kiro_version}" = "${KIRO_CLI_VERSION}"
          gemini --help > "${RUNNER_TEMP}/gemini-help.txt"
          grep -q -- "--yolo" "${RUNNER_TEMP}/gemini-help.txt"
          kiro-cli-chat chat --help > "${RUNNER_TEMP}/kiro-help.txt"
          grep -q -- "--model" "${RUNNER_TEMP}/kiro-help.txt"
          grep -a -q -- "KIRO_DATA_DIR" "$(command -v kiro-cli-chat)"
          copilot help environment > "${RUNNER_TEMP}/copilot-environment.txt"
          for variable in COPILOT_PROVIDER_BASE_URL COPILOT_PROVIDER_TYPE COPILOT_PROVIDER_API_KEY COPILOT_PROVIDER_WIRE_API COPILOT_PROVIDER_TRANSPORT COPILOT_MODEL; do
            grep -q -- "${variable}" "${RUNNER_TEMP}/copilot-environment.txt"
          done
          for variable in ANTHROPIC_BASE_URL ANTHROPIC_AUTH_TOKEN ANTHROPIC_MODEL; do
            grep -a -q -- "${variable}" "$(command -v claude)"
          done
          prodex_binary="target/${{ matrix.target }}/release/${{ matrix.binary-name }}"
          chmod 0755 "${prodex_binary}"
          copilot --model gpt-5.6-luna --effort max --help > "${RUNNER_TEMP}/copilot-luna-help.txt"
          grep -q -- "GitHub Copilot CLI" "${RUNNER_TEMP}/copilot-luna-help.txt"
          smoke_root="${RUNNER_TEMP}/prodex-sub-agent-smoke"
          stub="${smoke_root}/stub-child"
          mkdir -p "${smoke_root}"
          cat > "${stub}" <<'SH'
          #!/bin/sh
          set -eu
          printf '%s\n' "$@" > "${PRODEX_STUB_ARGS}"
          printf '%s\n' "${PRODEX_SUB_AGENT:-}" > "${PRODEX_STUB_MARKER}"
          printf '%s\n' "stub child output"
          SH
          chmod 0755 "${stub}"
          for provider in kiro copilot; do
            provider_root="${smoke_root}/${provider}"
            mkdir -p "${provider_root}/tasks" "${provider_root}/slots"
            : > "${provider_root}/slots/slot-00.lock"
            printf '%s\n' "credential-free launcher smoke" > "${provider_root}/tasks/task.txt"
            SMOKE_PROVIDER_ROOT="${provider_root}" SMOKE_STUB="${stub}" SMOKE_PROVIDER="${provider}" python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["SMOKE_PROVIDER_ROOT"])
          spec = {
              "executable": os.environ["SMOKE_STUB"],
              "provider": os.environ["SMOKE_PROVIDER"],
              "model": "gpt-5.6-luna",
              "effort": "max",
              "local-url": None,
              "presidio-enabled": False,
              "max-concurrency": {"value": 1, "source": "custom"},
              "slot-dir": str(root / "slots"),
              "task-dir": str(root / "tasks"),
              "task-max-bytes": 65536,
              "recursion-marker": "PRODEX_SUB_AGENT",
          }
          (root / "config.json").write_text(json.dumps(spec), encoding="utf-8")
          PY
            PRODEX_STUB_ARGS="${provider_root}/args.txt" PRODEX_STUB_MARKER="${provider_root}/marker.txt" PRODEX_HOME="${provider_root}/home" "${prodex_binary}" __sub-agent-exec --config "${provider_root}/config.json" --task-file "${provider_root}/tasks/task.txt"
            test ! -e "${provider_root}/tasks/task.txt"
            grep -Fxq -- "s" "${provider_root}/args.txt"
            grep -Fxq -- "--no-sub-agent" "${provider_root}/args.txt"
            grep -Fxq -- "${provider}" "${provider_root}/args.txt"
            grep -Fxq -- "gpt-5.6-luna" "${provider_root}/args.txt"
            grep -Fxq -- "model_reasoning_effort=max" "${provider_root}/args.txt"
            grep -Fxq -- "1" "${provider_root}/marker.txt"
          done
          PRODEX_HOME="${RUNNER_TEMP}/prodex-agy" PRODEX_AGY_BIN=/bin/true "${prodex_binary}" s gemini --cli agy --no-presidio
          if PRODEX_HOME="${RUNNER_TEMP}/prodex-agy" PRODEX_AGY_BIN=/bin/true "${prodex_binary}" s gemini --cli agy --presidio 2> "${RUNNER_TEMP}/presidio-error.txt"; then
            echo "native Antigravity unexpectedly accepted --presidio" >&2
            exit 1
          fi
          grep -q -- "--presidio is unsupported" "${RUNNER_TEMP}/presidio-error.txt"
