name: Real Mojo parity

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: real-mojo-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  MOJO_VERSION: "1.0.0"
  UV_VERSION: "0.11.7"
  PRODEX_MOJO_REQUIRED: "1"

jobs:
  real-mojo:
    name: Real Mojo / parity
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: 1.97.1

      - name: Install pinned uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Install pinned Mojo toolchain
        shell: bash
        run: |
          set -euo pipefail
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python "mojo==${MOJO_VERSION}"
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "${GITHUB_PATH}"

      - name: Verify toolchains
        shell: bash
        run: |
          set -euo pipefail
          mojo_version="$(mojo --version)"
          printf '%s\n' "${mojo_version}"
          case "${mojo_version}" in
            "Mojo ${MOJO_VERSION}"*) ;;
            *) echo "unexpected Mojo version: ${mojo_version}" >&2; exit 1 ;;
          esac
          command -v mojo
          rustc --version
          cargo --version
          ar --version | head -n 1

      - name: Build Prodex with real Mojo
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked --features mojo-quota --bin prodex
          test -x target/debug/prodex
          target/debug/prodex --version
          quota_archive="$(find target/debug/build -type f -name 'libprodex_quota_mojo.a' -print -quit)"
          runtime_archive="$(find target/debug/build -type f -name 'libprodex_runtime_quota_mojo.a' -print -quit)"
          test -n "${quota_archive}"
          test -n "${runtime_archive}"
          file "${quota_archive}" "${runtime_archive}"

      - name: Run quota Mojo smoke and parity tests
        run: cargo test --locked -q -p prodex-quota --features mojo -- --test-threads=1

      - name: Run runtime-proxy Mojo smoke and parity tests
        run: cargo test --locked -q -p prodex-runtime-proxy --features mojo -- --test-threads=1
